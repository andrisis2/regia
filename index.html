/* ============================================================
   Le routine: compiti che Claude fa da solo, nei tre giri del
   workflow (mattina, pomeriggio, sera), in un'area. Stanno in
   chat.json → "routine"; gemello di valida_routine() in comune.py.
   ============================================================ */

function nuovoIdRoutine(){
  var usati = {};
  Object.keys(chats).forEach(function(sl){ routineDi(chats[sl]).forEach(function(r){ usati[r.id] = 1; }); });
  var id; do { id = 'r-' + rand(8); } while(usati[id]);
  return id;
}
function contaRoutine(){
  var n = 0;
  Object.keys(chats).forEach(function(sl){ if(!chats[sl].meta.archiviata) n += routineDi(chats[sl]).filter(function(r){ return r.attiva !== false; }).length; });
  return n ? n + (n === 1 ? ' attiva' : ' attive') : '';
}
function descriviRoutine(r){
  var f = FASCE.filter(function(x){ return x[0] === r.quando; })[0];
  return (f ? f[1] : r.quando) + ' · ' + descriviGiorni(r.giorni);
}

/* l'elenco: di un'area (c) o di tutte (null) */
function apriRoutine(c){
  var aree = c ? [c] : chatOrdinate().filter(function(x){ return !x.meta.archiviata; });
  var s = sheet('<h2>Routine' + (c ? ' · ' + escapeHtml(titoloChat(c)) : '') + '</h2>' +
    '<p class="help">Cose che Claude fa da solo, ogni giorno o nei giorni che scegli: la mattina (verso le ' + oraFascia('mattina').replace(/^0/, '') +
    '), il pomeriggio (verso le ' + oraFascia('pomeriggio') + ') o la sera (verso le ' + oraFascia('sera') + '). Il risultato arriva nella sua area.</p>' +
    '<div id="_rl"></div>' +
    '<div class="btnrow"><button class="btn primary" id="_nr"><svg class="i"><use href="#i-plus"/></svg>Nuova routine</button></div>');
  var host = s.q('#_rl'), quante = 0;
  aree.forEach(function(a){
    var lista = routineDi(a);
    if(!lista.length) return;
    quante += lista.length;
    if(!c){ var h = document.createElement('div'); h.className = 'sec-h'; h.style.marginLeft = '0'; h.textContent = titoloChat(a); host.appendChild(h); }
    var box = document.createElement('div'); box.className = 'rt-lista';
    lista.forEach(function(r){
      var riga = document.createElement('div'); riga.className = 'rt';
      var v = prossimaVolta(a, r);
      riga.innerHTML = '<button class="ri" style="text-align:left"><b></b><small></small><small class="area-r"></small></button>' +
        '<button class="interruttore' + (r.attiva !== false ? ' on' : '') + '" role="switch" aria-checked="' + (r.attiva !== false) + '"></button>';
      riga.querySelector('b').textContent = r.titolo || '(senza titolo)';
      riga.querySelector('small').textContent = descriviRoutine(r);
      riga.querySelector('.area-r').textContent = r.attiva === false ? 'Spenta' : v ? 'Prossima: ' + quandoVolta(v) : '';
      riga.querySelector('.interruttore').setAttribute('aria-label', (r.attiva !== false ? 'Spegni ' : 'Accendi ') + (r.titolo || 'la routine'));
      riga.querySelector('.ri').onclick = function(){ s.close(function(){ formRoutine(a, r); }); };
      riga.querySelector('.interruttore').onclick = function(){
        // la versione di adesso (un tocco prima può averla già cambiata)
        var cur = routineDi(a).filter(function(x){ return x.id === r.id; })[0] || r, acceso = cur.attiva === false;
        this.classList.toggle('on', acceso); this.setAttribute('aria-checked', String(acceso)); vibra();
        salvaRoutine(a, Object.assign({}, cur, { attiva: acceso }), (acceso ? 'accesa ' : 'spenta ') + '«' + cur.titolo + '»',
          acceso ? 'Routine accesa' : 'Routine spenta');
      };
      box.appendChild(riga);
    });
    host.appendChild(box);
  });
  if(!quante) host.innerHTML = '<div class="empty" style="padding:18px 6px">Ancora nessuna routine' + (c ? ' in quest\'area' : '') + '.<br>' +
    'Per esempio: «ogni mattina la rassegna stampa», «il lunedì le offerte di lavoro nuove», «la sera il Vangelo del giorno dopo».</div>';
  s.q('#_nr').onclick = function(){ s.close(function(){ formRoutine(c || chats.generale || aree[0], null, !c); }); };
}

/* salva una routine (nuova o cambiata) dentro chat.json dell'area */
function salvaRoutine(c, r, cosa, ok){
  var meta = clone(c.meta), lista = Array.isArray(meta.routine) ? meta.routine.slice() : [], i = -1;
  lista.forEach(function(x, j){ if(x && x.id === r.id) i = j; });
  if(r.giorni && (!r.giorni.length || r.giorni.length === 7)) delete r.giorni;
  if(!r.modello) delete r.modello;
  if(i < 0) lista.push(r); else lista[i] = r;
  meta.routine = lista;
  return salvaMeta(c, meta, 'routine ' + cosa, ok);
}

/* il modulo: area (solo per una nuova, se si viene dall'elenco di tutte), cosa,
   quando, in quali giorni, con che modello */
function formRoutine(c, r, sceltaArea){
  var nuova = !r;
  r = clone(r || { titolo: '', testo: '', quando: 'mattina', attiva: true });
  var giorni = r.giorni && r.giorni.length ? r.giorni.slice() : [1, 2, 3, 4, 5, 6, 7];
  var s = sheet('<h2>' + (nuova ? 'Nuova routine' : 'Routine') + '</h2>' +
    (sceltaArea ? '<label class="l">In quale area</label><select class="f" id="_a"></select>' :
      '<p class="help">Nell\'area «' + escapeHtml(titoloChat(c)) + '».</p>') +
    '<label class="l">Nome</label><input class="f" id="_t" autocomplete="off" placeholder="es. Rassegna del mattino">' +
    '<label class="l">Cosa deve fare Claude ogni volta</label>' +
    '<textarea class="f" id="_x" placeholder="es. Le 5 notizie più importanti di oggi su Italia, economia e Russia, con i link. Corto."></textarea>' +
    '<label class="l">Quando</label><div class="segf" id="_q">' + FASCE.map(function(f){
      return '<button data-v="' + f[0] + '">' + f[1] + '<small>' + oraFascia(f[0]).replace(/^0/, '') + '</small></button>'; }).join('') + '</div>' +
    '<label class="l">In quali giorni</label><div class="giorni-r" id="_g">' + SIGLE.map(function(g, i){
      return '<button data-g="' + (i + 1) + '" aria-label="' + GIORNI[(i + 1) % 7] + '">' + g.charAt(0).toUpperCase() + '</button>'; }).join('') + '</div>' +
    '<label class="l">Modello</label><select class="f" id="_m">' + MODELLI.map(function(m){
      return '<option value="' + escapeHtml(m.id) + '">' + escapeHtml(m.nome) + '</option>'; }).join('') + '</select>' +
    '<label class="switch"><input type="checkbox" id="_on"> Accesa</label>' +
    '<div class="btnrow">' + (nuova ? '<button class="btn" id="_no">Annulla</button>' :
      '<button class="btn danger solo" id="_del" aria-label="Elimina"><svg class="i"><use href="#i-trash"/></svg></button><button class="btn" id="_ora"><svg class="i"><use href="#i-play"/></svg>Fai ora</button>') +
    '<button class="btn primary" id="_si">Salva</button></div>');
  if(sceltaArea){
    chatOrdinate().filter(function(x){ return !x.meta.archiviata; }).forEach(function(x){
      var o = document.createElement('option'); o.value = x.slug; o.textContent = titoloChat(x);
      if(x.slug === c.slug) o.selected = true;
      s.q('#_a').appendChild(o);
    });
  }
  s.q('#_t').value = r.titolo || ''; s.q('#_x').value = r.testo || '';
  s.q('#_m').value = modelloDi(r.modello) ? r.modello || '' : '';
  s.q('#_on').checked = r.attiva !== false;
  function segna(){
    s.el.querySelectorAll('#_q button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === r.quando); });
    s.el.querySelectorAll('#_g button').forEach(function(b){ b.classList.toggle('on', giorni.indexOf(+b.getAttribute('data-g')) >= 0); });
  }
  s.el.querySelectorAll('#_q button').forEach(function(b){ b.onclick = function(){ r.quando = b.getAttribute('data-v'); segna(); }; });
  s.el.querySelectorAll('#_g button').forEach(function(b){
    b.onclick = function(){
      var g = +b.getAttribute('data-g'), i = giorni.indexOf(g);
      if(i >= 0){ if(giorni.length > 1) giorni.splice(i, 1); } else { giorni.push(g); giorni.sort(); }
      segna();
    };
  });
  segna();
  if(nuova){ s.q('#_no').onclick = s.close; setTimeout(function(){ s.q('#_t').focus(); }, 60); }
  else {
    s.q('#_del').onclick = function(){
      askConfirm('Eliminare la routine?', '«' + escapeHtml(r.titolo) + '» non girerà più. I messaggi che ha già scritto restano.', 'Elimina').then(function(ok){
        if(!ok) return;
        var meta = clone(c.meta);
        meta.routine = (meta.routine || []).filter(function(x){ return x && x.id !== r.id; });
        s.close(function(){ salvaMeta(c, meta, 'routine eliminata «' + r.titolo + '»', 'Routine eliminata'); });
      });
    };
    // «fai ora»: un messaggio normale nell'area, che Claude fa al prossimo turno
    s.q('#_ora').onclick = function(){
      s.close(function(){
        accoda(c.slug, 'Fai adesso la routine «' + r.titolo + '»:\n\n' + r.testo, [], '', modelloDi(r.modello) ? r.modello || '' : '')
          .then(function(){ apriChat(c.slug); disegna(); sync(); });
      });
    };
  }
  s.q('#_si').onclick = function(){
    var dove = sceltaArea ? chats[s.q('#_a').value] || c : c;
    r.titolo = s.q('#_t').value.trim(); r.testo = s.q('#_x').value.trim();
    if(!r.titolo){ s.q('#_t').focus(); return; }
    if(!r.testo){ s.q('#_x').focus(); toast('Scrivi cosa deve fare Claude'); return; }
    r.giorni = giorni.slice(); r.modello = s.q('#_m').value; r.attiva = s.q('#_on').checked;
    if(nuova) r = Object.assign({ id: nuovoIdRoutine() }, r);
    s.close(function(){ salvaRoutine(dove, r, (nuova ? 'nuova ' : 'cambiata ') + '«' + r.titolo + '»', nuova ? 'Routine creata: ' + descriviRoutine(r) : 'Routine salvata'); });
  };
}

/* ============================================================
   La casella di scrittura: la stessa nella pagina di partenza e
   nella chat. Testo, allegati, il modo (Ricerca / Ragiona) e la
   dettatura; quando si manda, passa tutto a opts.manda().
   ============================================================ */

/* il modello scelto resta, area per area, su questo telefono (come in Grok):
   «automatico» vuol dire quello dell'area, o quello delle Impostazioni */
if(!ui.modelli || typeof ui.modelli !== 'object') ui.modelli = {};
function modelloScelto(slug){ var m = ui.modelli[slug]; return modelloDi(m) && m ? m : ''; }
function modelloArea(slug){
  var c = chats[slug], m = c && c.meta && c.meta.modello;
  return modelloDi(m) && m ? m : '';
}
/* quello che userà davvero Claude, e da dove viene */
function modelloEffettivo(slug){
  var m = modelloScelto(slug);
  if(m) return { id: m, da: 'messaggio' };
  m = modelloArea(slug);
  if(m) return { id: m, da: 'area' };
  m = impostazioni && modelloDi(impostazioni.modello) ? impostazioni.modello || '' : '';
  return { id: m, da: m ? 'impostazioni' : '' };
}

var Dettatura = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var casellaFile = null;      // la casella che ha aperto la scelta dei file

function alComputer(){
  return !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
}

/* pre: il prefisso degli id ('h' pagina di partenza, 'c' chat).
   opts: manda(testo, allegati, modo, modello) · chiave() dove tenere la bozza ·
   dopo(vuota) · area() l'area in cui si scrive (per il modello) */
function casella(pre, opts){
  var root = $(pre + 'Comp'), input = $(pre + 'Input'), send = $(pre + 'Send'), mic = $(pre + 'Mic');
  var k = { input: input, allegati: [], modo: '', modello: '', ascolto: null };

  /* il bottone del modello dice quello che userà Claude; il pallino ha il
     colore del modello, pieno se l'hai scelto tu, tenue se è automatico */
  var bm = $(pre + 'Modello');
  k.disegnaModello = function(){
    var slug = opts.area && opts.area();
    k.modello = slug ? modelloScelto(slug) : '';
    var e = slug ? modelloEffettivo(slug) : { id: '', da: '' }, m = modelloDi(e.id);
    bm.querySelector('span').textContent = e.id && m ? m.breve : 'Auto';
    var p = bm.querySelector('.pallino');
    p.style.background = m && m.serie ? 'var(--m' + m.serie + ')' : '';
    bm.classList.toggle('scelto', !!k.modello);
    bm.setAttribute('aria-label', 'Modello di Claude: ' + (e.id ? nomeModello(e.id) : 'automatico') + (k.modello ? '' : ' (automatico)'));
  };
  bm.onclick = function(){
    var slug = opts.area && opts.area();
    if(!slug) return;
    var auto = modelloArea(slug) || (impostazioni && modelloDi(impostazioni.modello) && impostazioni.modello) || '';
    var da = auto ? nomeModello(auto) + (modelloArea(slug) ? ', quello di quest\'area.' : ', quello delle Impostazioni.') : 'Il predefinito di Claude Code.';
    scegliModello(k.modello, 'Modello di Claude', 'Vale per i prossimi messaggi in «' + escapeHtml(titoloChat(chats[slug])) + '», finché non lo cambi.',
      function(id){
        if(id) ui.modelli[slug] = id; else delete ui.modelli[slug];
        salvaUi(); k.disegnaModello(); vibra();
        toast(id ? 'Claude userà ' + escapeHtml(nomeModello(id)) : 'Modello automatico');
      }, da);
  };

  k.adatta = function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight + 2, 220) + 'px';
    var vuota = !input.value.trim() && !k.allegati.length;
    send.disabled = vuota;
    // come in Grok: a casella vuota c'è il microfono, appena si scrive la freccia
    var conMic = !!Dettatura && (vuota || !!k.ascolto);
    mic.classList.toggle('hide', !conMic);
    send.classList.toggle('hide', conMic && vuota);
    var ch = opts.chiave && opts.chiave();
    if(ch){ if(input.value) lsSet(K.draft(ch), input.value); else lsDel(K.draft(ch)); }
    if(opts.dopo) opts.dopo(vuota && !input.value);
  };

  k.setModo = function(m){
    k.modo = modoDi(m) ? m : '';
    root.querySelectorAll('.modo').forEach(function(b){
      var on = b.getAttribute('data-modo') === k.modo;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    // il modo acceso si legge anche nella casella: vale per il prossimo messaggio
    if(!input.getAttribute('data-segnaposto')) input.setAttribute('data-segnaposto', input.placeholder);
    input.placeholder = k.modo ? MODI[k.modo].invito : input.getAttribute('data-segnaposto');
  };
  root.querySelectorAll('.modo').forEach(function(b){
    b.title = MODI[b.getAttribute('data-modo')].nome;
    b.onclick = function(){
      var m = b.getAttribute('data-modo');
      k.setModo(k.modo === m ? '' : m); vibra();
    };
  });

  k.disegnaAllegati = function(){
    var box = $(pre + 'Atts'); box.innerHTML = '';
    k.allegati.forEach(function(a, i){
      var d = document.createElement('div'); d.className = 'patt';
      d.innerHTML = '<svg class="i" style="width:16px;height:16px"><use href="#i-' + (isImg(a.nome) ? 'clip' : 'file') + '"/></svg><span></span>' +
        '<button aria-label="Togli"><svg class="i" style="width:15px;height:15px"><use href="#i-x"/></svg></button>';
      d.querySelector('span').textContent = a.nome + ' · ' + Math.max(1, Math.round(a.b64.length * 0.75 / 1024)) + ' kB';
      d.querySelector('button').onclick = function(){ k.allegati.splice(i, 1); k.disegnaAllegati(); k.adatta(); };
      box.appendChild(d);
    });
  };
  k.aggiungi = function(lista){
    var files = Array.prototype.slice.call(lista || []);
    var troppo = files.filter(function(f){ return f.size > 20 * 1024 * 1024; });
    if(troppo.length) toast('Oltre 20 MB non si può: ' + escapeHtml(troppo[0].name), 4000);
    Promise.all(files.filter(function(f){ return f.size <= 20 * 1024 * 1024; }).map(preparaAllegato)).then(function(pronti){
      k.allegati = k.allegati.concat(pronti); k.disegnaAllegati(); k.adatta();
    }).catch(function(e){ toast(escapeHtml(e.message), 4000); });
  };
  $(pre + 'Attach').onclick = function(){ casellaFile = k; $('filePick').value = ''; $('filePick').click(); };
  // dal computer: un'immagine incollata o un file trascinato diventano allegati
  input.addEventListener('paste', function(e){
    var f = e.clipboardData && e.clipboardData.files;
    if(f && f.length){ e.preventDefault(); k.aggiungi(f); }
  });
  var box = root.querySelector('.cbox');
  box.addEventListener('dragover', function(e){ e.preventDefault(); box.classList.add('trascina'); });
  box.addEventListener('dragleave', function(){ box.classList.remove('trascina'); });
  box.addEventListener('drop', function(e){
    e.preventDefault(); box.classList.remove('trascina');
    if(e.dataTransfer && e.dataTransfer.files.length) k.aggiungi(e.dataTransfer.files);
  });

  k.riempi = function(t, fuoco){
    input.value = t; k.adatta();
    if(fuoco !== false){ input.focus(); input.setSelectionRange(t.length, t.length); }
  };

  k.invia = function(){
    var testo = input.value.trim();
    if(!testo && !k.allegati.length) return;
    if(!testo) testo = k.allegati.length === 1 ? '(allegato)' : '(allegati)';
    var allegati = k.allegati.slice(), modo = k.modo, modello = k.modello;
    k.ferma();
    input.value = ''; k.allegati = []; k.setModo('');
    k.disegnaAllegati(); k.adatta();
    vibra();
    opts.manda(testo, allegati, modo, modello);
  };
  send.onclick = function(){ k.invia(); };
  input.addEventListener('input', k.adatta);
  input.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.isComposing) return;
    // Ctrl/Cmd+Invio manda sempre; col computer basta Invio (Maiusc+Invio va a capo);
    // dal telefono Invio va a capo, come in tutte le chat
    if(e.ctrlKey || e.metaKey || (!e.shiftKey && alComputer())){ e.preventDefault(); k.invia(); }
  });

  /* dettatura: il riconoscimento vocale del browser, in italiano */
  k.ascolta = function(){
    var r;
    try{ r = new Dettatura(); }catch(e){ toast('Dettatura non disponibile qui'); return; }
    r.lang = 'it-IT'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    var base = input.value.replace(/\s+$/, '');
    r.onresult = function(ev){
      var t = '';
      for(var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
      t = t.trim();
      if(!base) t = t.charAt(0).toUpperCase() + t.slice(1);
      input.value = (base ? base + ' ' : '') + t;
      k.adatta();
    };
    r.onerror = function(ev){
      if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast('Per dettare serve il permesso del microfono', 4000);
      else if(ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Dettatura interrotta (' + escapeHtml(ev.error) + ')');
    };
    r.onend = function(){ k.ascolto = null; mic.classList.remove('ascolta'); k.adatta(); };
    k.ascolto = r; mic.classList.add('ascolta'); vibra();
    try{ r.start(); }catch(e){ k.ascolto = null; mic.classList.remove('ascolta'); }
    k.adatta();
  };
  k.ferma = function(){ if(k.ascolto){ try{ k.ascolto.stop(); }catch(e){} } };
  mic.onclick = function(){ if(k.ascolto) k.ferma(); else k.ascolta(); };

  // la bozza lasciata a metà l'ultima volta (adatta() la cancellerebbe)
  var ch0 = opts.chiave && opts.chiave();
  if(ch0) input.value = lsGet(K.draft(ch0), '') || '';
  k.adatta();
  k.disegnaModello();
  return k;
}

function giornoEtichetta(d){
  var g = giornoDi(d), n = dDiff(g, oggi());
  if(n === 0) return 'Oggi';
  if(n === -1) return 'Ieri';
  var s = dataLunga(g);
  return s.charAt(0).toUpperCase() + s.slice(1) + (g.slice(0, 4) !== oggi().slice(0, 4) ? ' ' + g.slice(0, 4) : '');
}

/* quanto si aspetta: «45 s», «3:07», «2 h 05» */
function durata(ms){
  var s = Math.max(0, Math.round(ms / 1000));
  if(s < 60) return s + ' s';
  var m = Math.floor(s / 60);
  if(m < 60) return m + ':' + pad(s % 60);
  return Math.floor(m / 60) + ' h ' + pad(m % 60);
}

/* «Claude sta lavorando»: il segno che gira, la scritta che luccica, il
   tempo e le fasi del turno (in coda → preparo → al lavoro → salvo) */
function pensiero(st){
  var w = document.createElement('div'); w.className = 'msg claude pensiero';
  var fase = st.tipo === 'lavoro' ? faseRun(st.run) : 0;
  var etichetta = st.tipo === 'lavoro' ? ['Claude sta per partire…', 'Preparo il turno…', 'Claude sta lavorando…', 'Salvo la risposta…'][fase] :
    st.tipo === 'coda' ? 'In coda: Claude parte tra poco…' : runs && runs.ok ? 'In attesa che Claude parta…' : 'In attesa di Claude…';
  var da = st.attesa.length ? st.attesa[0].quando.getTime() : Date.now();
  var html = '<div class="who"><span class="mark"><svg class="i"><use href="#i-spark"/></svg></span>' +
    '<span class="shimmer">' + etichetta + '</span><span class="timer" data-da="' + da + '">' + durata(Date.now() - da) + '</span></div>';
  // le fasi si vedono solo se il token può guardare i turni (Actions)
  if(runs && runs.ok){
    html += '<div class="fasi">' + FASI.map(function(n, i){
      var cls = st.tipo === 'lavoro' ? (i < fase ? 'fatta' : i === fase ? 'ora' : '') : (i === 0 ? 'ora' : '');
      return '<div class="fase ' + cls + '"><i></i><span>' + n + '</span></div>';
    }).join('') + '</div>';
  }
  var vecchio = st.tipo === 'attesa' && st.attesa.length && Date.now() - st.attesa[st.attesa.length - 1].quando > 240000;
  html += '<div class="meta">' + (st.run ? '<a href="' + escapeHtml(st.run.url) + '" target="_blank" rel="noopener">vedi il turno</a>' : '') +
    (vecchio ? '<button class="_rip">Riprova</button>' : '') + '</div>';
  w.innerHTML = html;
  return w;
}

function disegnaChat(scrollaGiu){
  if(!aperta) return;

  var sub = st.tipo === 'ok' ? ((c.meta.descrizione || '').slice(0, 80) || 'con Claude') : ETICHETTE[st.tipo];
  $('cSub').textContent = sub;

  var mostra = c.msgs.slice(-aperta.quanti);

  var chiave = [mostra.map(function(m){ return m.nome; }).join(','), uscita.map(function(o){ return o.nome + o.errore; }).join(','),
                st.tipo, st.run && st.run.id, faseRun(st.run), agenda.sha, agq.length, aperta.quanti, runs && runs.ok].join('|');
  disegnaSuggerimenti(c);
  if(chiave === chiaveChat) return;

  Promise.all(mostra.map(function(m){ return blobText(m.sha).catch(function(){ return '*(messaggio non leggibile)*'; }); })).then(function(testiMsg){
    if(!aperta || aperta.slug !== c.slug) return;
    chiaveChat = chiave;
    var box = $('cmsgs');
    var vicinoAlFondo = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    var altezzaPrima = box.scrollHeight;
    var resi = aperta.resi, ora = {};
    box.innerHTML = '';
    if(c.msgs.length > mostra.length){
      var piu = document.createElement('button'); piu.className = 'loadmore';
      piu.textContent = 'Messaggi precedenti (' + (c.msgs.length - mostra.length) + ')';
      // i messaggi più vecchi non sono «nuovi»: niente animazione d'arrivo
      piu.onclick = function(){ aperta.quanti += 60; aperta.resi = null; chiaveChat = ''; disegnaChat(false); };
      box.appendChild(piu);

    if(!mostra.length && !uscita.length){
      var v = document.createElement('div'); v.className = 'vuota';
      v.innerHTML = '<svg class="logo"><use href="#i-spark"/></svg><h3>' + escapeHtml(titoloChat(c)) + '</h3>' +
        '<p>Scrivi qui a Claude: ' + (c.slug === 'generale' ? 'domande, commissioni, appuntamenti.' : 'tutto quello che riguarda questo progetto.') +
        '<br>Di solito risponde in un paio di minuti.</p>';

    var giornoPrima = '', lineaNuovi = false;

    var ultimo = mostra.length - 1;
    mostra.forEach(function(m, i){

      if(!lineaNuovi && aperta.lettoPrima && i > 0 && m.autore !== 'andrea' && m.nome > aperta.lettoPrima){
        lineaNuovi = true;

      }));
    });

      box.appendChild(f);

    box.querySelectorAll('._rip').forEach(function(b){ b.onclick = riprovaRisposta; });
    var bersaglio = aperta.vai && box.querySelector('[data-nome="' + aperta.vai + '"]');
    aperta.vai = null;
    if(bersaglio){
      bersaglio.scrollIntoView({ block: 'center' });
      bersaglio.classList.add('lampeggia');
    }
    else if(scrollaGiu || vicinoAlFondo) box.scrollTop = box.scrollHeight;
    else if(!scrollaGiu && box.scrollHeight > altezzaPrima && box.scrollTop < 40) box.scrollTop = box.scrollHeight - altezzaPrima;
    aggiornaGiu();

function bolla(c, autore, testo, quando, o){
  var fm = leggiFrontmatter(testo || '');
  var mattino = autore === 'claude' && fm.campi.tipo === 'briefing';
  var rout = autore === 'claude' && !mattino && (fm.campi.tipo === 'routine' || !!fm.campi.routine);
  var corpo = fm.corpo.trim();
  var el = document.createElement('div');
  el.className = 'msg ' + autore + (mattino ? ' briefing' : '') + (rout ? ' routine' : '') +
    (o.uscita ? ' out' + (o.uscita.errore ? ' fail' : '') : '') + (o.nuovo ? ' nuovo' : '');
  if(o.nome) el.setAttribute('data-nome', o.nome);
  var nomeR = '';
  if(rout){
    var r = routineDi(c).filter(function(x){ return x.id === fm.campi.routine; })[0];
    nomeR = r ? String(r.titolo || '') : '';
  }
  var who = autore === 'claude' ?
      '<div class="who"><span class="mark"><svg class="i"><use href="#i-' + (mattino ? 'sun' : rout ? 'repeat' : 'spark') + '"/></svg></span>' +
      (mattino ? 'Briefing del mattino' : rout ? 'Routine' + (nomeR ? ' · ' + escapeHtml(nomeR) : '') : 'Claude') + '</div>' :
    autore === 'sistema' ? '<div class="who"><span class="mark"><svg class="i"><use href="#i-alert"/></svg></span>Regia</div>' : '';
  el.innerHTML = who + '<div class="bubble md">' + mdToHtml(corpo || ' ', true) + '</div>';
  var bub = el.querySelector('.bubble'), base = 'chat/' + c.slug;
  collegaRepo(bub, base);
  collegaCodice(bub);
  // una risposta appena arrivata compare a pezzi, come se la stesse scrivendo
  if(o.nuovo && autore === 'claude') Array.prototype.forEach.call(bub.children, function(x, i){ x.style.setProperty('--i', Math.min(i, 14)); });

  // allegati di Andrea
  var all = o.uscita ? o.uscita.allegati.map(function(a){ return a.rel; }) : [].concat(fm.campi.allegati || []);
  if(all.length){
    var at = document.createElement('div'); at.className = 'atts';
    all.forEach(function(rel){
      var p = risolvi(base, rel), b = document.createElement('button');
      if(isImg(p)){
        b.className = 'att img'; b.innerHTML = '<img alt="">';
        if(idx && idx.files[p]) caricaImg(b.querySelector('img'), p);
      } else {
        b.className = 'att'; b.innerHTML = '<svg class="i"><use href="#i-file"/></svg><span></span>';
        b.querySelector('span').textContent = nomeFile(p).replace(/^\d{8}-\d{6}-/, '');
      }
      b.onclick = function(){ if(idx && idx.files[p]) apriFile(p); else toast('L\'allegato è ancora in viaggio verso GitHub'); };
      at.appendChild(b);
    });
    el.appendChild(at);
  }

  // le voci d'agenda toccate da Claude
  var ev = [].concat(fm.campi.eventi || []), co = [].concat(fm.campi.compiti || []);
  if(ev.length || co.length){
    var cards = document.createElement('div'); cards.className = 'cards';
    var d = agendaConGoogle();
    ev.forEach(function(id){ cards.appendChild(schedaVoce(d.eventi.filter(function(e){ return e.id === id; })[0], 'evento', id)); });
    co.forEach(function(id){ cards.appendChild(schedaVoce(d.compiti.filter(function(x){ return x.id === id; })[0], 'compito', id)); });
    el.appendChild(cards);
  }

  // le risposte rapide: solo sotto l'ultima risposta, finché non hai scritto tu
  var proposte = o.proposte ? leggiProposte(fm.campi.proposte) : [];
  if(proposte.length){
    var pr = document.createElement('div'); pr.className = 'proposte';
    proposte.forEach(function(t){
      var b = document.createElement('button'); b.className = 'proposta';
      b.innerHTML = '<svg class="i"><use href="#i-arrow"/></svg><span></span>';
      b.lastChild.textContent = t;
      b.onclick = function(){ mandaProposta(c.slug, t); };
      pr.appendChild(b);
    });
    el.appendChild(pr);
  }

  if(autore === 'claude'){
    // sotto ogni risposta, come in Grok: copia, leggi ad alta voce, condividi, cita
    var acts = document.createElement('div'); acts.className = 'acts';
    acts.innerHTML =
      '<button class="_cp" title="Copia" aria-label="Copia"><svg class="i"><use href="#i-copy"/></svg></button>' +
      '<button class="_vo" title="Leggi ad alta voce" aria-label="Leggi ad alta voce"><svg class="i"><use href="#i-volume"/></svg></button>' +
      '<button class="_sh" title="Condividi" aria-label="Condividi"><svg class="i"><use href="#i-share"/></svg></button>' +
      '<button class="_qu" title="Rispondi citando" aria-label="Rispondi citando"><svg class="i"><use href="#i-quote"/></svg></button>' +
      '<span class="ora">' + oraDi(quando) + '</span>';
    acts.querySelector('._cp').onclick = function(){ copia(corpo, 'Risposta copiata'); };
    acts.querySelector('._vo').onclick = function(){ parla(testoPiano(corpo), this); };
    acts.querySelector('._sh').onclick = function(){ condividi(corpo); };
    acts.querySelector('._qu').onclick = function(){ cita(corpo); };
    el.appendChild(acts);
    return el;
  }

  var meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML = '<span>' + oraDi(quando) + '</span>';
  var modo = modoDi((o.uscita && o.uscita.modo) || fm.campi.modo);
  if(autore === 'andrea' && modo) meta.innerHTML += '<span class="tagmodo"><svg class="i"><use href="#i-' + modo.icona + '"/></svg>' + escapeHtml(modo.nome) + '</span>';
  var mod = modelloDi((o.uscita && o.uscita.modello) || fm.campi.modello);
  if(autore === 'andrea' && mod && mod.id) meta.innerHTML += '<span class="tagmodello"><i style="background:var(--m' + mod.serie + ')"></i>' + escapeHtml(mod.breve) + '</span>';
  if(o.uscita){
    meta.innerHTML += o.uscita.errore ? '<span style="color:var(--danger)">non inviato</span><button class="_re">Riprova</button><button class="_del">Elimina</button>' : '<span>invio…</span>';
    if(o.uscita.errore){
      meta.querySelector('._re').onclick = function(){ o.uscita.errore = ''; salvaOutbox(); chiaveChat = ''; disegnaChat(false); sync(); };
      meta.querySelector('._del').onclick = function(){
        outbox = outbox.filter(function(x){ return x !== o.uscita; }); salvaOutbox();
        if(!kc.input.value.trim()) kc.riempi(o.uscita.testo, false);
        chiaveChat = ''; disegnaChat(false); disegna();
      };
    }
  } else if(autore === 'sistema' && o.ultimo && (o.st.tipo === 'errore')){
    meta.innerHTML += '<button class="_rip">Riprova</button>';
  }
  el.appendChild(meta);
  return el;
}

/* una risposta rapida parte subito, come un messaggio scritto */
function mandaProposta(slug, testo){
  vibra();

  if(tipo === 'evento'){
    b.className = 'mini';
    b.style.setProperty('--tcol', tipoColore(v));
    b.innerHTML = '<svg class="i" style="color:var(--tcol)"><use href="#i-cal"/></svg><div class="mi"><div class="mt"></div><div class="ms"></div></div>';
    b.querySelector('.mt').textContent = v.titolo;
    b.querySelector('.ms').textContent = descriviQuando(v);
    b.onclick = function(){ formEvento(v); };
  } else {
    b.className = 'mini compito' + (v.fatto ? ' fatto' : '');
    b.innerHTML = '<svg class="i" style="color:var(--muted)"><use href="#i-list"/></svg><div class="mi"><div class="mt"></div><div class="ms"></div></div>';
    b.querySelector('.mt').textContent = v.titolo;

    b.onclick = function(){ formCompito(v); };
  }
  return b;
}

function descriviQuando(v){
  var s = relativo(v.data);
  s = s.charAt(0).toUpperCase() + s.slice(1);
  if(v.data_fine) s += ' → ' + relativo(v.data_fine);
  if(v.ora) s += ' · ' + v.ora + (v.ora_fine ? '–' + v.ora_fine : '');
  if(v.ripeti) s += ' · ' + descriviRipeti(v.ripeti);
  if(v.luogo) s += ' · ' + v.luogo;
  return s;
}

/* i percorsi relativi nei messaggi partono dalla cartella della chat;
   quelli che cominciano con chat/ o agenda/ dalla radice del repo */
function risolvi(base, rel){
  rel = rel.replace(/^\.\//, '');
  var parti = (/^(chat|agenda|\.regia)\//.test(rel) || rel.charAt(0) === '/' ? rel.replace(/^\//, '') : base + '/' + rel).split('/');
  var out = [];
  parti.forEach(function(p){ if(p === '..') out.pop(); else if(p && p !== '.') out.push(p); });
  return out.join('/');
}

/* le foto grandi si rimpiccioliscono: 2000 px bastano per farle leggere a Claude */
function preparaAllegato(f){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('Non riesco a leggere ' + f.name)); };
    fr.onload = function(){
      var b64 = String(fr.result).split(',')[1] || '';
      var nome = (f.name || 'immagine.png').replace(/[^\w.\- ]+/g, '_').replace(/\s+/g, '-').slice(-60) || 'file';
      if(!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 1.2 * 1024 * 1024){ res({ nome: nome, tipo: f.type, b64: b64 }); return; }
      var img = new Image();
      img.onload = function(){
        var lato = Math.max(img.width, img.height), k = Math.min(1, 2000 / lato);
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var out = cv.toDataURL('image/jpeg', 0.85).split(',')[1];
        res({ nome: nome.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', tipo: 'image/jpeg', b64: out });
      };
      img.onerror = function(){ res({ nome: nome, tipo: f.type, b64: b64 }); };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}

/* ============================================================
   Agenda: le modifiche si mettono in coda sul telefono e partono
   una alla volta. Ognuna dice solo cosa cambia (campo per campo),
   così se intanto Claude ha toccato la stessa voce non si perde niente.
   ============================================================ */

function agendaVista(){
  var d = clone(agenda.dati || agendaVuota());
  d.eventi = d.eventi || []; d.compiti = d.compiti || [];
  agq.forEach(function(op){ applicaOp(d, op); });
  return d;
}

/* gli eventi di Google Calendar (agenda/google.json, li copia il workflow):
   si vedono insieme agli altri ma non si toccano da qui. Id «g-…». */
function eventiGoogle(){
  if(!google) return [];
  return google.eventi.filter(function(e){ return e && typeof e.id === 'string' && e.id.indexOf('g-') === 0 && dataOk(e.data) && e.titolo; })
    .map(function(e){ return Object.assign({}, e, { fonte: 'google' }); });
}
function daGoogle(v){ return !!v && v.fonte === 'google' && typeof v.id === 'string' && v.id.indexOf('g-') === 0; }
/* l'agenda da mostrare: quella di Regia (con le modifiche in coda) più Google */
function agendaConGoogle(){
  var d = agendaVista();
  d.eventi = d.eventi.concat(eventiGoogle());
  return d;
}

function applicaOp(d, op){
  if(op.op === 'salva'){
    var lista = d[op.lista], i = -1;
    lista.forEach(function(x, j){ if(x.id === op.dopo.id) i = j; });
    if(i < 0){ lista.push(clone(op.dopo)); return; }
    var t = lista[i], prima = op.prima || {};
    Object.keys(Object.assign({}, prima, op.dopo)).forEach(function(k){
      if(uguali(prima[k], op.dopo[k])) return;
      if(vuoto(op.dopo[k])) delete t[k]; else t[k] = clone(op.dopo[k]);
    });
  } else if(op.op === 'elimina'){
    d.eventi = d.eventi.filter(function(x){ return x.id !== op.id; });
    d.compiti = d.compiti.filter(function(x){ return x.id !== op.id; });
  } else if(op.op === 'salta'){
    d.eventi.forEach(function(e){
      if(e.id !== op.id || !e.ripeti) return;
      var s = (e.ripeti.salta || []).slice();
      if(s.indexOf(op.data) < 0) s.push(op.data);
      e.ripeti.salta = s.sort(); e.modificato = op.quando;
    });
  } else if(op.op === 'fatto'){
    d.compiti.forEach(function(c){
      if(c.id !== op.id) return;
      c.fatto = op.fatto; c.fatto_il = op.fatto ? op.data : null; c.modificato = op.quando;
    });
  }
}

function accodaAgenda(op, descr){
  op.descr = descr; op.quando = adessoLocale();
  agq.push(op); lsSet(K.agq, agq);

  sync();
}

var salvandoAgenda = null;
function salvaAgendaCoda(tentativo){
  if(salvandoAgenda && !tentativo) return salvandoAgenda;
  if(!agq.length) return Promise.resolve();
  tentativo = tentativo || 0;
  var ops = agq.slice();
  var p = getContent(AGENDA).then(function(d){ return d; }, function(e){ if(e.status === 404) return null; throw e; })
    .then(function(d){
      var dati;
      try{ dati = d ? JSON.parse(b64decodeText(d.content)) : agendaVuota(); }
      catch(e){ throw new Error('agenda.json su GitHub non è JSON valido: la sistemo da GitHub o chiedo a Claude.'); }
      dati.eventi = dati.eventi || []; dati.compiti = dati.compiti || [];
      ops.forEach(function(op){ applicaOp(dati, op); });
      var testo = serializzaAgenda(dati);
      var descr = ops.map(function(o){ return o.descr; }).filter(Boolean);
      var msg = 'agenda da app: ' + (descr.length > 3 ? descr.slice(0, 3).join('; ') + ' e altro' : descr.join('; '));
      return putFile(AGENDA, b64encode(testo), d && d.sha, msg).then(function(r){
        testi[r.content.sha] = testo;
        agenda.dati = JSON.parse(testo); agenda.sha = r.content.sha;
        agq = agq.filter(function(o){ return ops.indexOf(o) < 0; }); lsSet(K.agq, agq);
        idx.commit = null;
      });
    })
    .catch(function(e){
      if((e.status === 409 || e.status === 422) && tentativo < 3) return salvaAgendaCoda(tentativo + 1);
      throw e;
    });
  if(!tentativo){ salvandoAgenda = p.then(function(){ salvandoAgenda = null; }, function(e){ salvandoAgenda = null; throw e; }); return salvandoAgenda; }
  return p;
}

/* il colore del tipo d'evento: solo i tipi noti, perché finisce in un attributo style */
function tipoColore(v){
  if(daGoogle(v)) return 'var(--t-google)';
  return 'var(--t-' + (TIPI.some(function(t){ return t[0] === v.tipo; }) ? v.tipo : 'appuntamento') + ')';

function rigaEvento(x, giorno){
  var v = x.ev, b = document.createElement('button');
  b.className = 'ev';
  b.style.setProperty('--tcol', tipoColore(v));
  // a sinistra l'ora d'inizio e, sotto, la fine (o «tutto il giorno», o «giorno 2/5» per i viaggi)
  var su, giu;
  if(x.dur){ su = x.k === 0 && v.ora ? v.ora : ''; giu = 'giorno ' + (x.k + 1) + '/' + (x.dur + 1); }
  else if(v.ora){ su = v.ora; giu = v.ora_fine || ''; }
  else { su = ''; giu = 'tutto il giorno'; }
  var pezzi = [];
  if(v.tipo && v.tipo !== 'appuntamento') pezzi.push(TIPI.filter(function(t){ return t[0] === v.tipo; }).concat([[0, v.tipo]])[0][1]);
  if(v.luogo) pezzi.push(v.luogo);
  if(v.ripeti) pezzi.push(descriviRipeti(v.ripeti));
  var ch = v.chat && chats[v.chat] ? '<span class="tag">' + escapeHtml(titoloChat(chats[v.chat])) + '</span>' : '';
  if(daGoogle(v)) ch = '<span class="tag google">Google</span>' + ch;
  b.innerHTML = '<div class="eo">' + escapeHtml(su) + '<small>' + escapeHtml(giu) + '</small></div>' +
    '<div class="eb"></div><div class="ei"><div class="et"></div><div class="es">' + ch + '<span></span></div></div>';
  b.querySelector('.et').textContent = v.titolo;
  // l'ultimo span: prima ci possono essere le etichette (area, Google)
  b.querySelector('.es > span:last-child').textContent = pezzi.join(' · ');
  if(!ch && !pezzi.length) b.querySelector('.es').remove();
  var o = oggi(), finita = v.ora_fine || v.ora;
  if(giorno < o || (giorno === o && !x.dur && finita && finita < oraDi(new Date()))) b.classList.add('passato');
  b.onclick = function(){ formEvento(v, x.ini); };
  return b;
}

function rigaCompito(c){
  var b = document.createElement('div');
  b.className = 'todo' + (c.fatto ? ' fatto' : '') + (c.priorita === 'alta' ? ' alta' : '');
  var o = oggi(), info = [];
  if(c.scadenza){
    var n = dDiff(c.scadenza, o);
    var cls = !c.fatto && n < 0 ? 'rosso' : !c.fatto && n <= 1 ? 'ambra' : '';
    info.push('<span class="tag ' + cls + '">' + (n < 0 && !c.fatto ? 'scaduto ' : 'entro ') + escapeHtml(relativo(c.scadenza)) + '</span>');
  }
  if(c.chat && chats[c.chat]) info.push('<span class="tag">' + escapeHtml(titoloChat(chats[c.chat])) + '</span>');
  if(c.fatto && c.fatto_il) info.push('fatto ' + escapeHtml(relativo(c.fatto_il)));
  b.innerHTML = '<button class="check" aria-label="Fatto"><svg class="i"><use href="#i-check"/></svg></button>' +
    '<button class="ti" style="text-align:left"><div class="tt"></div><div class="ts">' + info.join(' ') + '</div></button>';
  b.querySelector('.tt').textContent = c.titolo;
  if(!info.length) b.querySelector('.ts').remove();
  b.querySelector('.check').onclick = function(){
    var fatto = !c.fatto;
    b.classList.toggle('fatto', fatto);
    accodaAgenda({ op: 'fatto', id: c.id, fatto: fatto, data: oggi() }, (fatto ? 'fatto ' : 'da rifare ') + '«' + c.titolo + '»');
  };
  b.querySelector('.ti').onclick = function(){ formCompito(c); };
  return b;
}

function blocco(titolo, nodi, extra){
  var w = document.createElement('div'); w.className = 'day';
  if(titolo){ var h = document.createElement('div'); h.className = 'day-h'; h.innerHTML = titolo; w.appendChild(h); }
  var l = document.createElement('div'); l.className = 'evlist';
  if(!nodi.length){ l.innerHTML = '<div class="nulla">' + (extra || 'Niente in programma') + '</div>'; }
  nodi.forEach(function(n){ l.appendChild(n); });
  w.appendChild(l);
  return w;
}

function disegnaProssimi(){
  var host = $('abody'), d = agendaConGoogle(), o = oggi(), fine = dAdd(o, 44);
  host.innerHTML = '';
  var urgenti = d.compiti.filter(function(c){ return !c.fatto && c.scadenza && c.scadenza <= o; });
  if(urgenti.length){
    host.appendChild(blocco('<span class="dn">Da fare entro oggi</span><span class="dd">' + urgenti.length + '</span>', urgenti.map(rigaCompito)));
  }
  var per = eventiNelPeriodo(d, o, fine), quanti = 0;
  for(var k = 0; k <= 44; k++){
    var g = dAdd(o, k), voci = per[g] || [];
    var scad = d.compiti.filter(function(c){ return !c.fatto && c.scadenza === g && g > o; });
    if(!voci.length && !scad.length && k > 1) continue;
    quanti += voci.length + scad.length;
    var nome = k === 0 ? 'Oggi' : k === 1 ? 'Domani' : GIORNI[dow(g)].charAt(0).toUpperCase() + GIORNI[dow(g)].slice(1);
    var t = '<span class="dn">' + nome + '</span><span class="dd">' + escapeHtml(k < 2 ? dataLunga(g) : dataBreve(g).replace(/^\w+ /, '')) + '</span>';
    var nodi = voci.map(function(x){ return rigaEvento(x, g); }).concat(scad.map(rigaCompito));
    var bl = blocco(t, nodi);
    if(k === 0) bl.querySelector('.day-h').classList.add('oggi');
    host.appendChild(bl);
  }
  if(!quanti && !urgenti.length){
    var e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = 'Nelle prossime sei settimane non c\'è niente.<br>Aggiungi un evento col tasto qui sotto, o scrivi a Claude in Generale («ricordami il dentista martedì alle 15»).';
    host.appendChild(e);
  }
}

function disegnaMese(){
  var host = $('abody'), d = agendaConGoogle(), o = oggi();

  if(!ui.giorno || ui.giorno.slice(0, 7) !== ui.mese) ui.giorno = ui.mese === o.slice(0, 7) ? o : ui.mese + '-01';

  host.innerHTML = '<div class="mese-h"><span class="mn">' + MESI[m - 1] + ' ' + y + '</span>' +

      var pts = voci.slice(0, 4).map(function(x){ return '<i style="--tcol:' + tipoColore(x.ev) + '"></i>'; }).join('') +
        (scad.length ? '<i style="--tcol:var(--muted)"></i>' : '');
      c.innerHTML = '<span class="n">' + (+g.slice(8)) + '</span><span class="pts">' + pts + '</span>' +
        (voci.length > 4 ? '<span class="piu">+' + (voci.length - 4) + '</span>' : '');
      c.onclick = function(){ ui.giorno = g; if(g.slice(0, 7) !== ui.mese) ui.mese = g.slice(0, 7); salvaUi(); disegnaMese(); };
      gr.appendChild(c);
    })(g);
  }

  var scad = d.compiti.filter(function(x){ return x.scadenza === sel; });
  var h = '<span class="dn">' + escapeHtml(dataLunga(sel).charAt(0).toUpperCase() + dataLunga(sel).slice(1)) + '</span>' +
    '<span class="dd">' + escapeHtml(relativo(sel) === dataBreve(sel) ? '' : relativo(sel)) + '</span>';

}
function spostaMese(n){
  var y = +ui.mese.slice(0, 4), m = +ui.mese.slice(5, 7) - 1 + n;
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  ui.mese = y + '-' + pad(m + 1); ui.giorno = null; salvaUi(); disegnaMese();
}

var mostraFatti = false;
function disegnaDaFare(){
  var host = $('abody'), d = agendaVista(), o = oggi(), sett = dAdd(o, 7);
  host.innerHTML = '';
  var qa = document.createElement('div'); qa.className = 'quickadd';
  qa.innerHTML = '<input id="_qa" placeholder="Aggiungi una cosa da fare…" enterkeyhint="done" autocomplete="off">';
  host.appendChild(qa);
  $('_qa').addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var t = this.value.trim(); if(!t) return;
    this.value = '';
    var c = { id: nuovoId('c'), titolo: t, creato_da: 'andrea', creato: adessoLocale() };
    accodaAgenda({ op: 'salva', lista: 'compiti', prima: null, dopo: normalizza(c, ORD_CO) }, 'nuovo compito «' + t + '»');
    setTimeout(function(){ var i = $('_qa'); if(i) i.focus(); }, 30);
  });
  var aperti = d.compiti.filter(function(c){ return !c.fatto; });
  var gruppi = [
    ['In ritardo', aperti.filter(function(c){ return c.scadenza && c.scadenza < o; })],
    ['Oggi', aperti.filter(function(c){ return c.scadenza === o; })],
    ['Prossimi 7 giorni', aperti.filter(function(c){ return c.scadenza > o && c.scadenza <= sett; })],
    ['Più avanti', aperti.filter(function(c){ return c.scadenza > sett; })],
    ['Senza scadenza', aperti.filter(function(c){ return !c.scadenza; })]
  ];
  var pr = { alta: 0, normale: 1, bassa: 2 };
  gruppi.forEach(function(gp){
    if(!gp[1].length) return;
    gp[1].sort(function(a, b){ return cmpTuple([a.scadenza || '', pr[a.priorita || 'normale'], a.creato || ''], [b.scadenza || '', pr[b.priorita || 'normale'], b.creato || '']); });
    var h = document.createElement('div'); h.className = 'sec-h'; h.textContent = gp[0] + ' · ' + gp[1].length;
    host.appendChild(h);
    host.appendChild(blocco('', gp[1].map(rigaCompito)));
  });
  if(!aperti.length){
    var e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = 'Niente da fare. 🎉<br>Scrivi qui sopra, oppure chiedi a Claude («ricordami di…»).';
    host.appendChild(e);
  }
  var fatti = d.compiti.filter(function(c){ return c.fatto; }).sort(function(a, b){ return cmp(b.fatto_il || '', a.fatto_il || ''); });
  if(fatti.length){
    var hf = document.createElement('div'); hf.className = 'sec-h';
    hf.innerHTML = 'Fatti · ' + fatti.length + '<button>' + (mostraFatti ? 'Nascondi' : 'Mostra') + '</button>';
    hf.querySelector('button').onclick = function(){ mostraFatti = !mostraFatti; disegnaDaFare(); };
    host.appendChild(hf);
    if(mostraFatti) host.appendChild(blocco('', fatti.slice(0, 40).map(rigaCompito)));
  }
}

function nuovoId(pref){
  var d = agendaVista(), usati = {};
  d.eventi.concat(d.compiti).forEach(function(x){ usati[x.id] = 1; });
  var id; do { id = pref + '-' + rand(8); } while(usati[id]);
  return id;
}

var GG_ICS = ['SU','MO','TU','WE','TH','FR','SA'];
function rrule(r){
  if(!r) return '';
  var s = 'FREQ=' + { giorno:'DAILY', settimana:'WEEKLY', mese:'MONTHLY', anno:'YEARLY' }[r.ogni];
  if(r.intervallo > 1) s += ';INTERVAL=' + r.intervallo;
  if(r.ogni === 'settimana' && r.giorni && r.giorni.length) s += ';BYDAY=' + r.giorni.map(function(g){ return GG_ICS[g % 7]; }).join(',');
  if(r.fino) s += ';UNTIL=' + r.fino.replace(/-/g, '') + 'T235959Z';
  return s;
}

function linkGoogle(v, occ){
  var ini = v.data, dates;
  if(v.ora){
    var fine = v.ora_fine || (function(){ var h = (+v.ora.slice(0, 2) + 1) % 24; return pad(h) + v.ora.slice(2); })();
    var gFine = v.data_fine || (v.ora_fine && v.ora_fine < v.ora ? dAdd(ini, 1) : (!v.ora_fine && v.ora >= '23:00' ? dAdd(ini, 1) : ini));
    dates = ini.replace(/-/g, '') + 'T' + v.ora.replace(':', '') + '00/' + gFine.replace(/-/g, '') + 'T' + fine.replace(':', '') + '00';
  } else {
    dates = ini.replace(/-/g, '') + '/' + dAdd(v.data_fine || ini, 1).replace(/-/g, '');
  }
  var u = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(v.titolo) +
    '&dates=' + dates + '&ctz=' + encodeURIComponent(fuso());
  if(v.note) u += '&details=' + encodeURIComponent(v.note);
  if(v.luogo) u += '&location=' + encodeURIComponent(v.luogo);
  if(v.ripeti) u += '&recur=' + encodeURIComponent('RRULE:' + rrule(v.ripeti));
  return u;
}

function esportaIcs(){
  var d = agendaVista();
  function esc(s){ return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
  function piega(l){ var out = []; while(l.length > 74){ out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); }
  var tz = fuso(), stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  var r = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Regia//Agenda//IT', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Regia'];
  if(tz === 'Europe/Rome'){
    r.push('BEGIN:VTIMEZONE', 'TZID:Europe/Rome',
      'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST', 'DTSTART:19700329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
      'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
      'END:VTIMEZONE');
  }
  d.eventi.forEach(function(v){
    r.push('BEGIN:VEVENT', 'UID:' + v.id + '@regia', 'DTSTAMP:' + stamp, 'SUMMARY:' + esc(v.titolo));
    if(v.ora){
      var fine = v.ora_fine || pad((+v.ora.slice(0, 2) + 1) % 24) + v.ora.slice(2);
      var gf = v.data_fine || (fine < v.ora ? dAdd(v.data, 1) : v.data);
      r.push('DTSTART;TZID=' + tz + ':' + v.data.replace(/-/g, '') + 'T' + v.ora.replace(':', '') + '00');
      r.push('DTEND;TZID=' + tz + ':' + gf.replace(/-/g, '') + 'T' + fine.replace(':', '') + '00');
    } else {
      r.push('DTSTART;VALUE=DATE:' + v.data.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + dAdd(v.data_fine || v.data, 1).replace(/-/g, ''));
    }
    if(v.ripeti){
      r.push('RRULE:' + rrule(v.ripeti));
      (v.ripeti.salta || []).forEach(function(s){
        r.push(v.ora ? 'EXDATE;TZID=' + tz + ':' + s.replace(/-/g, '') + 'T' + v.ora.replace(':', '') + '00' : 'EXDATE;VALUE=DATE:' + s.replace(/-/g, ''));
      });
    }
    if(v.luogo) r.push('LOCATION:' + esc(v.luogo));
    if(v.note) r.push('DESCRIPTION:' + esc(v.note));
    r.push('END:VEVENT');
  });
  r.push('END:VCALENDAR');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([r.map(piega).join('\r\n') + '\r\n'], { type: 'text/calendar' }));
  a.download = 'regia-agenda.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}

function salvaImpostazioni(campi, cosa, ok){
  var path = IMPOSTAZIONI;
  return getContent(path).then(function(f){ return f; }, function(e){ if(e.status === 404) return null; throw e; }).then(function(f){
    var remoto = {};
    try{ remoto = f ? JSON.parse(b64decodeText(f.content)) || {} : {}; }catch(e){ remoto = {}; }
    var d = Object.assign({ fuso: 'Europe/Rome', briefing_mattino: true, modello: '' }, remoto, campi);
    var testo = JSON.stringify(d, null, 2) + '\n';
    return putFile(path, b64encode(testo), f && f.sha, 'impostazioni da app: ' + cosa).then(function(r){
      testi[r.content.sha] = testo; impostazioni = d; idx.commit = null;
      toast(escapeHtml(ok || 'Salvato'));
      kh.disegnaModello(); kc.disegnaModello();
    });
  }).catch(function(e){ toast(escapeHtml(e.message), 5000); });
}

          mostra();

   di partenza si alza sopra la tastiera, così resta in vista anche su iPhone
   (dove la tastiera non accorcia la pagina) */
function adattaSchermo(){
  var vv = window.visualViewport; if(!vv) return;
  document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--kb', (kb > 60 ? kb : 0) + 'px');
  document.querySelectorAll('.layer').forEach(function(l){ l.style.top = vv.offsetTop + 'px'; });
  if(aperta){ var box = $('cmsgs'); if(document.activeElement === $('cInput')) box.scrollTop = box.scrollHeight; }
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', adattaSchermo);
  window.visualViewport.addEventListener('scroll', adattaSchermo);
}

/* la pagina lascia sotto lo spazio della casella, che cresce col testo */
if(window.ResizeObserver){
  new ResizeObserver(function(){
    document.documentElement.style.setProperty('--dock', $('dock').offsetHeight + 'px');
  }).observe($('dock'));
}

/* tirare giù la pagina di partenza la aggiorna */
(function(){
  var y0 = null, dy = 0, ptr = $('ptr');
  function posa(){ ptr.style.transition = 'opacity .25s, transform .25s'; ptr.style.opacity = 0; ptr.style.transform = ''; ptr.classList.remove('gira'); }
  document.addEventListener('touchstart', function(e){
    var libero = !pila.length && cfg.token && window.scrollY <= 0 && e.touches.length === 1 && !e.target.closest('.dock');
    y0 = libero ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  document.addEventListener('touchmove', function(e){
    if(y0 == null) return;
    dy = e.touches[0].clientY - y0;
    var tira = Math.min(Math.max(0, dy) * 0.5, 80);
    ptr.style.transition = 'none';
    ptr.style.opacity = Math.min(1, tira / 50);
    ptr.style.transform = 'translateY(' + (tira - 20) + 'px) rotate(' + (tira * 4) + 'deg)';
  }, { passive: true });
  document.addEventListener('touchend', function(){
    if(y0 == null) return;
    y0 = null;
    if(dy * 0.5 < 55){ posa(); return; }
    ptr.classList.add('gira'); vibra();
    sync(true).then(posa, posa);
  });
})();

/* ---------- avvio ---------- */

document.querySelectorAll('#agSeg button').forEach(function(b){
  b.onclick = function(){ ui.agv = b.getAttribute('data-v'); salvaUi(); $('abody').scrollTop = 0; disegnaAgenda(); };
});

  else formEvento(ui.agv === 'mese' ? { data: ui.giorno || oggi() } : null);

['chatview', 'agendaview', 'viewer'].forEach(function(id){ gestoIndietro($(id)); });

function riapri(){
  if(ui.agenda) apriAgenda();
  if(ui.chat && chats[ui.chat]) apriChat(ui.chat);
}
function avvio(){
  disegna();
  if(cfg.token && idx){
    caricaModello().then(function(){
      Object.keys(chats).forEach(function(sl){ visti[sl] = chats[sl].msgs.map(function(m){ return m.nome; }); });
      primaVolta = false;
      disegna();
      riapri();
      sync();
    }).catch(function(){ sync(true); });
  } else if(cfg.token){
    sync(true).then(riapri);
  }
}

/* Se il telefono ha ricaricato l'app mentre c'era aperto qualcosa, la
   pagina nuova si ritrova sopra voci di cronologia che non hanno più un
   livello: il tasto indietro sembrerebbe bloccato. Si torna giù alla
   prima voce (con un popstate, o con un caricamento nuovo: vanno bene
   tutti e due) e poi si riparte, riaprendo la chat in cui si era. */
var profondita = history.state && history.state.regia;
if(profondita > 0){
  var ripartito = false;
  var riparti = function(){
    if(ripartito) return;
    ripartito = true; window.removeEventListener('popstate', riparti);
    avvio();
  };
  window.addEventListener('popstate', riparti);
  history.go(-profondita);
  setTimeout(riparti, 700);
} else {
  avvio();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

})();
