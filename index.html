<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Regia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#123a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Regia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ==========================================================
   Regia — foglio di stile. Nessuna dipendenza esterna:
   solo variabili CSS e i font di sistema.
   ========================================================== */
:root{
  /* superfici */
  --bg:#f3f6f5; --panel:#ffffff; --panel-2:#f8faf9;
  --text:#13211f; --muted:#62726e;
  --line:#dfe6e4; --line-soft:#ebf0ee;
  /* marchio: petrolio per la regia, terracotta per Claude */
  --deep:#123a3d; --deep-2:#1a4b4f;
  --accent:#d0673d; --accent-2:#e9875c; --accent-soft:rgba(208,103,61,.13);
  --me:#dcefea; --me-ink:#10302e;
  --danger:#c0392b; --ok:#2e7d52;
  --warn-bg:#fdf1d8; --warn-ink:#6b4b12;
  --err-bg:#fbe3e0; --err-ink:#7d2a20;
  /* tipi d'agenda */
  --t-appuntamento:#3b78d0; --t-promemoria:#cf8d1f; --t-scadenza:#cf3f39; --t-blocco:#2a9575;
  /* forma */
  --tap:44px; --r-s:8px; --r-m:12px; --r-l:16px;
  --sh-1:0 1px 2px rgba(16,32,30,.05), 0 2px 8px rgba(16,32,30,.05);
  --sh-2:0 10px 26px rgba(16,32,30,.2);
  --ring:0 0 0 3px rgba(208,103,61,.4);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tabbar:60px;
  --vvh:100%;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1413; --panel:#151e1d; --panel-2:#1a2524;
    --text:#e4edeb; --muted:#93a39f;
    --line:#26322f; --line-soft:#1d2826;
    --deep:#132b2c; --deep-2:#1b3739;
    --accent:#e57f52; --accent-2:#f0996f; --accent-soft:rgba(229,127,82,.16);
    --me:#1e3b39; --me-ink:#e0f0ec;
    --danger:#e8705f; --ok:#5cbb8b;
    --warn-bg:#3a2f16; --warn-ink:#f3d9a4;
    --err-bg:#3c1f1b; --err-ink:#f5c2ba;
    --t-appuntamento:#6fa0ea; --t-promemoria:#e5ad4a; --t-scadenza:#ec6d66; --t-blocco:#4fbf9a;
    --sh-1:0 1px 2px rgba(0,0,0,.4);
    --sh-2:0 12px 30px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 var(--sans);
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--accent)}
.hide{display:none!important}
::selection{background:rgba(208,103,61,.28)}
:focus-visible{outline:none;box-shadow:var(--ring)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- barra in alto ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg,var(--deep-2),var(--deep));
  padding-top:env(safe-area-inset-top); color:#fff;
  box-shadow:0 6px 18px -14px rgba(6,20,20,.9);
}
header{display:flex;align-items:center;gap:2px;padding:8px 6px 8px 16px;min-height:56px}
header h1{font-size:19px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
header h1 .dot{color:var(--accent-2)}
header .sub{font-size:12px;color:rgba(255,255,255,.62);font-weight:400;margin-left:8px;letter-spacing:0}
.iconbtn{
  min-width:var(--tap); height:var(--tap); border-radius:var(--r-m); color:inherit;
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.iconbtn:active{background:rgba(255,255,255,.16)}
.iconbtn.spin svg{animation:sp .9s linear infinite}
.subnav{display:flex;gap:6px;padding:0 12px 10px}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:var(--r-m);padding:3px;gap:2px}
.seg button{
  color:rgba(255,255,255,.74); font-size:14px; padding:7px 13px; border-radius:9px;
  transition:background .15s,color .15s; white-space:nowrap;
}
.seg button.on{background:#fff;color:var(--deep);font-weight:600;box-shadow:var(--sh-1)}
.subnav .grow{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:7px 12px;
  background:rgba(255,255,255,.13);color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap;
}
.pill:active{background:rgba(255,255,255,.22)}
.pill svg.i{width:17px;height:17px}

/* ---------- avvisi ---------- */
.banner{padding:10px 14px;font-size:13.5px;line-height:1.5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.err{background:var(--err-bg);color:var(--err-ink)}
.banner button{text-decoration:underline;text-underline-offset:2px;font-size:13.5px;font-weight:600;padding:4px 0}

/* ---------- contenuto principale e barra delle schede ---------- */
main{padding:10px 12px calc(env(safe-area-inset-bottom) + var(--tabbar) + 90px)}
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:25;
  display:flex; background:var(--panel); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1; height:var(--tabbar); display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; font-size:11.5px; font-weight:600; color:var(--muted); position:relative;
}
.tabbar button.on{color:var(--deep)}
@media (prefers-color-scheme:dark){ .tabbar button.on{color:var(--accent-2)} }
.tabbar .badge{position:absolute;top:7px;left:calc(50% + 6px)}
.badge{
  min-width:19px;height:19px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;
  font-size:11.5px;font-weight:700;line-height:19px;text-align:center;font-variant-numeric:tabular-nums;
}
.badge:empty{display:none}

.fab{
  position:fixed; right:14px; bottom:calc(env(safe-area-inset-bottom) + var(--tabbar) + 14px); z-index:15;
  background:var(--accent); color:#fff; border-radius:99px;
  height:52px; padding:0 20px 0 16px; box-shadow:var(--sh-2);
  font-size:15px; font-weight:700; letter-spacing:.2px;
  display:flex; align-items:center; gap:8px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.fab:active{transform:translateY(1px) scale(.98);box-shadow:var(--sh-1)}
.empty{color:var(--muted);padding:34px 18px;text-align:center;line-height:1.65}
.sec-h{
  font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin:18px 6px 8px;display:flex;align-items:center;gap:8px;
}
.sec-h button{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent);font-size:13px}

/* ---------- elenco delle chat ---------- */
.chatcard{
  display:flex; gap:12px; align-items:center; width:100%; text-align:left;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l);
  padding:12px 12px 12px 12px; margin:0 0 9px; box-shadow:var(--sh-1);
  transition:transform .1s ease;
}
.chatcard:active{transform:scale(.99)}
.chatcard.gen{border-color:color-mix(in srgb,var(--deep) 35%,var(--line))}
.av{
  width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:18px;letter-spacing:-.02em;
}
.av svg.i{width:23px;height:23px}
.cc-body{flex:1;min-width:0}
.cc-top{display:flex;align-items:baseline;gap:8px}
.cc-t{font-weight:650;font-size:16.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-time{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.cc-bot{display:flex;align-items:center;gap:8px;margin-top:2px}
.cc-prev{
  flex:1;min-width:0;font-size:14px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cc-prev b{color:var(--text);font-weight:600}
.st{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;
  padding:2px 8px;flex:none;white-space:nowrap;
}
.st.lavoro,.st.coda{background:var(--accent-soft);color:var(--accent)}
.st.errore{background:var(--err-bg);color:var(--err-ink)}
.st.invio{background:var(--line-soft);color:var(--muted)}
.st .dotp{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
.archived-toggle{width:100%;text-align:left}

/* ---------- vista chat ---------- */
.layer{
  position:fixed; left:0; right:0; top:0; height:var(--vvh); z-index:30; background:var(--bg);
  display:flex; flex-direction:column;
}
.lbar{
  background:linear-gradient(180deg,var(--deep-2),var(--deep)); color:#fff;
  display:flex; align-items:center; gap:4px; flex:none;
  padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;
}
.lbar .av{width:36px;height:36px;border-radius:11px;font-size:15px}
.ltitle{flex:1;min-width:0;line-height:1.25;padding-left:4px}
.ltitle .t{font-weight:650;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltitle .s{font-size:12.5px;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cmsgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 16px;overscroll-behavior:contain}
.daysep{text-align:center;margin:14px 0 8px}
.daysep span{
  font-size:12px;font-weight:600;color:var(--muted);background:var(--line-soft);
  padding:3px 10px;border-radius:99px;
}
.msg{display:flex;flex-direction:column;margin:3px 0 8px;max-width:100%}
.msg.andrea{align-items:flex-end}
.msg.claude,.msg.sistema{align-items:flex-start}
.bubble{
  max-width:min(86%,40rem); padding:9px 13px; border-radius:18px; font-size:15.5px; line-height:1.5;
  overflow-wrap:anywhere; position:relative;
}
.msg.andrea .bubble{background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
.msg.claude .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--sh-1)}
.msg.sistema .bubble{background:var(--warn-bg);color:var(--warn-ink);border-bottom-left-radius:6px}
.msg.briefing .bubble{border-left:3px solid var(--accent)}
.msg .who{font-size:11.5px;font-weight:700;color:var(--accent);margin:0 0 2px 4px;letter-spacing:.02em}
.msg.sistema .who{color:var(--warn-ink)}
.msg .meta{font-size:11.5px;color:var(--muted);margin:3px 6px 0;display:flex;gap:8px;align-items:center}
.msg .meta button{color:var(--accent);font-weight:650;font-size:12.5px;padding:4px 0}
.msg.out .bubble{opacity:.75}
.msg.fail .bubble{box-shadow:0 0 0 1.5px var(--danger)}
.typing .bubble{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.3s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
.loadmore{display:block;margin:4px auto 10px;color:var(--accent);font-weight:600;font-size:14px;padding:8px 14px}

/* markdown dentro le bolle e nel lettore */
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .6em}
.md h1,.md h2,.md h3,.md h4{line-height:1.25;margin:.9em 0 .35em;letter-spacing:-.01em}
.md h1{font-size:1.22em}.md h2{font-size:1.12em}.md h3,.md h4{font-size:1.02em}
.md ul,.md ol{padding-left:1.3em;margin:0 0 .6em}
.md li{margin:.18em 0}
.md blockquote{margin:0 0 .6em;padding:.1em 0 .1em .8em;border-left:3px solid var(--line);color:var(--muted)}
.md code{font-family:var(--mono);font-size:.88em;background:var(--line-soft);padding:.1em .35em;border-radius:5px}
.md pre{background:var(--line-soft);padding:10px 12px;border-radius:var(--r-s);overflow-x:auto;font-size:13px;line-height:1.45;margin:0 0 .6em}
.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:.92em;margin:0 0 .6em;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md th{background:var(--panel-2);font-weight:650}
.md img{max-width:100%;border-radius:var(--r-s);display:block;margin:.3em 0}
.md a.repo{font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--accent-soft)}
.msg.andrea .md code,.msg.andrea .md pre{background:rgba(0,0,0,.07)}

/* schede d'agenda e allegati sotto le bolle */
.cards{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-width:min(86%,40rem);width:100%}
.mini{
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:8px 11px;
  border-left:4px solid var(--tcol,var(--t-appuntamento));
}
.mini .mt{font-weight:600;font-size:14.5px}
.mini .ms{font-size:12.5px;color:var(--muted)}
.mini .mi{flex:1;min-width:0}
.mini.compito{border-left-color:var(--muted)}
.mini.compito.fatto .mt{text-decoration:line-through;color:var(--muted)}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;justify-content:flex-end;max-width:86%}
.att{
  border-radius:var(--r-m);overflow:hidden;background:var(--line-soft);border:1px solid var(--line);
  display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;max-width:100%;
}
.att.img{padding:0;width:120px;height:120px}
.att.img img{width:100%;height:100%;object-fit:cover;display:block}

/* scrittura */
.composer{
  flex:none;background:var(--panel);border-top:1px solid var(--line);
  padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);
}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;
  padding:6px 12px;font-size:13.5px;color:var(--text);white-space:nowrap;
}
.chip:active{background:var(--line-soft)}
.crow{display:flex;align-items:flex-end;gap:6px}
.crow textarea{
  flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:22px;
  padding:10px 15px;max-height:9.5em;min-height:44px;line-height:1.45;font-size:16px;outline:none;
}
.crow textarea:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.roundbtn{
  width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--muted);
}
.roundbtn:active{background:var(--line-soft)}
.roundbtn.send{background:var(--accent);color:#fff}
.roundbtn.send[disabled]{background:var(--line);color:var(--muted)}
.pending-atts{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 8px}
.patt{display:flex;align-items:center;gap:6px;background:var(--line-soft);border-radius:99px;padding:4px 6px 4px 10px;font-size:13px;max-width:100%}
.patt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.patt button{width:24px;height:24px;border-radius:50%;color:var(--muted)}

/* ---------- agenda ---------- */
.day{margin:0 0 14px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 6px 6px}
.day-h .dn{font-weight:700;font-size:15px}
.day-h .dd{font-size:13px;color:var(--muted)}
.day-h.oggi .dn{color:var(--accent)}
.evlist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--sh-1)}
.ev{
  display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;padding:10px 12px;
  border-bottom:1px solid var(--line-soft);
}
.ev:last-child{border-bottom:0}
.ev:active{background:var(--panel-2)}
.ev .eo{width:50px;flex:none;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;padding-top:1px}
.ev .eo small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ev .eb{width:4px;border-radius:2px;flex:none;background:var(--tcol,var(--t-appuntamento))}
.ev .ei{flex:1;min-width:0}
.ev .et{font-weight:600;font-size:15px}
.ev .es{font-size:12.5px;color:var(--muted);margin-top:1px}
.ev.passato{opacity:.55}
.nulla{padding:12px 14px;color:var(--muted);font-size:14px}
.tag{
  display:inline-block;font-size:11.5px;font-weight:650;border-radius:99px;padding:1px 7px;
  background:var(--line-soft);color:var(--muted);margin-right:4px;vertical-align:1px;
}
.tag.rosso{background:var(--err-bg);color:var(--err-ink)}
.tag.ambra{background:var(--warn-bg);color:var(--warn-ink)}

.mese-h{display:flex;align-items:center;gap:4px;margin:2px 0 8px}
.mese-h .mn{flex:1;font-weight:700;font-size:17px;text-transform:capitalize;padding-left:6px}
.mese-h button{min-width:40px;height:40px;border-radius:var(--r-m);color:var(--text);display:flex;align-items:center;justify-content:center}
.mese-h button:active{background:var(--line-soft)}
.mese-h .oggibtn{font-size:13.5px;font-weight:650;color:var(--accent);padding:0 10px}
.griglia{
  display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-l);padding:6px;box-shadow:var(--sh-1);
}
.griglia .wd{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cella{
  aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  padding-top:5px;font-size:14.5px;font-variant-numeric:tabular-nums;position:relative;min-width:0;
}
.cella.fuori{color:var(--muted);opacity:.45}
.cella.oggi .n{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cella .n{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cella.sel{background:var(--accent-soft)}
.cella .pts{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cella .pts i{width:6px;height:6px;border-radius:50%;background:var(--tcol,var(--t-appuntamento))}
.cella .piu{font-size:10px;color:var(--muted);line-height:1}

.todo{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 12px;
  border-bottom:1px solid var(--line-soft);
}
.todo:last-child{border-bottom:0}
.check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s,border-color .15s;
}
.check svg.i{width:15px;height:15px;stroke-width:3;opacity:0}
.todo.fatto .check{background:var(--ok);border-color:var(--ok)}
.todo.fatto .check svg.i{opacity:1}
.todo.fatto .tt{text-decoration:line-through;color:var(--muted)}
.todo .ti{flex:1;min-width:0}
.todo .tt{font-size:15px;font-weight:550}
.todo .ts{font-size:12.5px;color:var(--muted);margin-top:2px}
.todo.alta .tt::after{content:' ●';color:var(--danger);font-size:11px}
.quickadd{display:flex;gap:8px;margin:2px 0 4px}
.quickadd input{
  flex:1;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-m);padding:11px 13px;outline:none;
}
.quickadd input:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}

/* ---------- lettore / editor di file ---------- */
#viewer{z-index:40}
#vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#editor{
  width:100%; height:100%; border:0; outline:none; resize:none; display:block;
  background:var(--panel); caret-color:var(--accent);
  padding:18px max(16px,calc((100% - 46rem)/2)) calc(env(safe-area-inset-bottom) + 40px);
  font:15.5px/1.7 var(--mono);
}
#preview{
  padding:20px 18px calc(env(safe-area-inset-bottom) + 64px);
  max-width:42rem; margin:0 auto; font-size:16.5px; line-height:1.65;
}
#preview.pagina{max-width:none;padding:0;height:100%}
#preview.pagina iframe{display:block;width:100%;height:100%;min-height:420px;border:0;background:#fff}
#preview pre.raw{white-space:pre-wrap;font:13.5px/1.55 var(--mono)}
#preview img.solo{max-width:100%;display:block;margin:0 auto;border-radius:var(--r-s)}
.lbar .seg{margin-right:2px}
.savebtn{
  background:var(--accent); color:#fff; font-weight:700;
  border-radius:var(--r-m); padding:9px 14px; font-size:14px;
}
.savebtn[disabled]{background:transparent;color:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.26);cursor:default}

/* ---------- pannelli a scomparsa ---------- */
.sheet{
  position:fixed; inset:0; z-index:50; background:rgba(6,16,16,.5);
  display:flex; align-items:flex-end; justify-content:center; animation:fade .18s ease both;
}
.sheetbox{
  background:var(--panel); width:100%; max-width:560px; max-height:92vh; overflow:auto;
  border-radius:20px 20px 0 0; padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);
  animation:rise .22s cubic-bezier(.2,.8,.2,1) both; box-shadow:var(--sh-2);
}
.sheetbox::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@media (min-width:700px){
  .sheet{align-items:center}
  .sheetbox{border-radius:20px;animation:pop .2s ease both}
}
.sheetbox h2{margin:0 0 6px;font-size:19px}
.help{color:var(--muted);font-size:14px;line-height:1.55;margin:4px 0 10px}
.sheetbox ol{padding-left:1.25em;margin:4px 0 8px;font-size:14px;line-height:1.6;color:var(--muted)}
.sheetbox ol b{color:var(--text)}
label.l{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:14px 0 5px}
.f{
  width:100%; border:1px solid var(--line); background:var(--bg); border-radius:var(--r-m);
  padding:11px 12px; outline:none; font-size:16px; min-height:44px;
}
.f:focus{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
textarea.f{resize:vertical;min-height:84px;line-height:1.5}
.frow{display:flex;gap:10px}
.frow>*{flex:1;min-width:0}
.segf{display:flex;gap:4px;background:var(--line-soft);border-radius:var(--r-m);padding:3px;flex-wrap:wrap}
.segf button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.segf button.on{background:var(--panel);color:var(--text);box-shadow:var(--sh-1)}
.days7{display:flex;gap:5px}
.days7 button{flex:1;height:38px;border-radius:10px;background:var(--line-soft);font-weight:650;font-size:13.5px;color:var(--muted)}
.days7 button.on{background:var(--accent);color:#fff}
.switch{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1; padding:13px; border-radius:var(--r-m); font-weight:650; font-size:15px;
  background:var(--line-soft); color:var(--text); text-align:center;
}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn:active{filter:brightness(.95)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links button,.links a{
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:99px;padding:7px 12px;text-decoration:none;
}
.links svg.i{width:16px;height:16px}
.menu{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-top:8px}
.menu button{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;
  border-bottom:1px solid var(--line-soft);font-size:15.5px;
}
.menu button:last-child{border-bottom:0}
.menu button:active{background:var(--panel-2)}
.menu button svg.i{color:var(--muted)}
.menu button small{margin-left:auto;color:var(--muted);font-size:13px}
.menu .danger{color:var(--danger)}
.tokact{display:flex;gap:8px;margin-top:6px}
.tokact button{font-size:13.5px;font-weight:600;color:var(--accent);padding:6px 2px}
.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px;line-height:1.45}
.checks li:last-child{border-bottom:0}
.checks .ck{flex:none;width:22px;text-align:center;font-weight:800}
.checks .ok .ck{color:var(--ok)}.checks .no .ck{color:var(--danger)}.checks .forse .ck{color:var(--t-promemoria)}
.checks small{display:block;color:var(--muted);font-size:13px}

.welcome{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:20px 18px;margin-top:8px;box-shadow:var(--sh-1)}
.welcome h2{margin:0 0 8px;font-size:21px}
.welcome p{margin:0 0 10px;color:var(--muted);line-height:1.6}
.welcome ol{padding-left:1.25em;line-height:1.65;margin:8px 0 14px}

#toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + var(--tabbar) + 80px);
  background:#0b1817; color:#fff; padding:11px 16px; border-radius:var(--r-m);
  font-size:14px; z-index:70; max-width:88%; text-align:center;
  box-shadow:var(--sh-2); transform:translateX(-50%); animation:toastin .2s ease both;
}
#toast button{color:var(--accent-2);font-weight:700;margin-left:8px}
.spin{
  display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px;
}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(18px)}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .spin,.iconbtn.spin svg{animation-duration:.8s!important}
}
</style>
</head>

<script>
(function(){
'use strict';

/* ============================================================
   Regia — chat con Claude divise per progetto, più l'agenda.
   I dati stanno nel repo privato (regia-dati): ogni messaggio è
   un file, ogni modifica un commit. Sul repo gira un workflow che
   fa rispondere Claude Code; l'app guarda i commit e mostra.
   ============================================================ */

var VERSIONE = '1.0';
var DEFAULTS = { owner:'andrisis2', repo:'regia-dati', branch:'main', token:'' };
var WORKFLOW = 'claude.yml';
var AGENDA = 'agenda/agenda.json';
var IMPOSTAZIONI = 'impostazioni.json';
var P = 'regia.';
var K = {
  cfg:P+'cfg', idx:P+'idx', outbox:P+'outbox', agq:P+'agq', letti:P+'letti', ui:P+'ui', runs:P+'runs',
  draft:function(s){ return P+'draft:'+s; }
};

function lsGet(k, fb){ try{ var v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); }catch(e){ return fb; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

var cfg = Object.assign({}, DEFAULTS, lsGet(K.cfg, {}));
var idx = lsGet(K.idx, null);          // ultimo albero letto: { commit, files: { percorso: sha } }
var outbox = lsGet(K.outbox, []);      // messaggi non ancora arrivati su GitHub
var agq = lsGet(K.agq, []);            // modifiche all'agenda non ancora salvate
var letti = lsGet(K.letti, {});        // per chat: nome dell'ultimo messaggio visto
var ui = Object.assign({ tab:'chat', chat:null, agv:'prossimi', mese:null, giorno:null }, lsGet(K.ui, {}));
var runs = lsGet(K.runs, null);        // ultimi turni del workflow, se il token li può vedere

var $ = function(id){ return document.getElementById(id); };
function salvaUi(){ lsSet(K.ui, ui); }

/* ---------- cache dei blob: un blob di git non cambia mai, quindi si tiene per sempre ---------- */

var DB = (function(){
  var aperto = null, mem = {};
  function apri(){
    if(aperto) return aperto;
    aperto = new Promise(function(res){
      try{
        var r = indexedDB.open('regia', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('blob'); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ res(null); };
      }catch(e){ res(null); }
    });
    return aperto;
  }
  function get(k){
    if(k in mem) return Promise.resolve(mem[k]);
    return apri().then(function(db){
      if(!db) return undefined;
      return new Promise(function(res){
        try{
          var q = db.transaction('blob').objectStore('blob').get(k);
          q.onsuccess = function(){ if(q.result !== undefined) mem[k] = q.result; res(q.result); };
          q.onerror = function(){ res(undefined); };
        }catch(e){ res(undefined); }
      });
    });
  }
  function put(k, v){
    mem[k] = v;
    return apri().then(function(db){
      if(!db) return;
      return new Promise(function(res){
        try{
          var tx = db.transaction('blob', 'readwrite');
          tx.objectStore('blob').put(v, k);
          tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
        }catch(e){ res(); }
      });
    });
  }
  function del(k){
    delete mem[k];
    return apri().then(function(db){
      if(!db) return;
      return new Promise(function(res){
        try{ var tx = db.transaction('blob', 'readwrite'); tx.objectStore('blob').delete(k); tx.oncomplete = res; tx.onerror = res; }
        catch(e){ res(); }
      });
    });
  }
  function svuota(){
    mem = {};
    return apri().then(function(db){
      if(!db) return;
      return new Promise(function(res){
        try{ var tx = db.transaction('blob', 'readwrite'); tx.objectStore('blob').clear(); tx.oncomplete = res; tx.onerror = res; }
        catch(e){ res(); }
      });
    });
  }
  return { get:get, put:put, del:del, svuota:svuota };
})();

/* ---------- utilità ---------- */

function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }

function b64encode(str){
  var bytes = new TextEncoder().encode(str), bin = '', CH = 0x8000;
  for(var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function b64bytes(b64){
  var bin = atob(String(b64).replace(/\s/g, '')), a = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function b64decodeText(b64){ return new TextDecoder('utf-8').decode(b64bytes(b64)); }

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function ext(p){ var m = /\.([a-z0-9]+)$/i.exec(p); return m ? m[1].toLowerCase() : ''; }
var TEXT_EXT = ['md','markdown','txt','json','csv','tsv','yml','yaml','html','htm','css','js','py','sh','tex','bib','xml','ini','toml','log','ics'];
var IMG_EXT = ['png','jpg','jpeg','gif','webp','svg','avif'];
function isText(p){ return TEXT_EXT.indexOf(ext(p)) >= 0 || p.split('/').pop().indexOf('.') < 0; }
function isImg(p){ return IMG_EXT.indexOf(ext(p)) >= 0; }
function isPagina(p){ var e = ext(p); return e === 'html' || e === 'htm'; }
function mimeDi(p){
  var e = ext(p);
  if(e === 'svg') return 'image/svg+xml';
  if(isImg(p)) return 'image/' + e.replace('jpg', 'jpeg');
  return { pdf:'application/pdf', txt:'text/plain', md:'text/markdown', csv:'text/csv', json:'application/json' }[e] || 'application/octet-stream';
}
function nomeFile(p){ return p.split('/').pop(); }
function dirname(p){ var i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }

function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'chat';
}
function rand(n){
  var s = '', a = 'abcdefghijklmnopqrstuvwxyz0123456789';
  var buf = new Uint8Array(n);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  for(var i = 0; i < n; i++) s += a[buf[i] % a.length];
  return s;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uguali(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

function toast(msg, ms, azione){
  var old = $('toast'); if(old) old.remove();
  var t = document.createElement('div'); t.id = 'toast'; t.innerHTML = msg;
  if(azione){
    var b = document.createElement('button'); b.textContent = azione.label;
    b.onclick = function(){ t.remove(); azione.fn(); };
    t.appendChild(b);
  }
  document.body.appendChild(t);
  if(ms !== 0) setTimeout(function(){ if(t.parentNode) t.remove(); }, ms || 2600);
  return t;
}

function copyText(txt, input){
  function fallback(){
    try{ input.type = 'text'; input.focus(); input.setSelectionRange(0, txt.length); return document.execCommand('copy'); }
    catch(e){ return false; }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(txt).then(function(){ return true; }, fallback);
  }
  return Promise.resolve(fallback());
}

/* coda: al massimo 6 richieste insieme, per non farsi bloccare da GitHub */
var coda = (function(){
  var attive = 0, attesa = [];
  function prossima(){
    if(attive >= 6 || !attesa.length) return;
    var j = attesa.shift(); attive++;
    j.fn().then(j.res, j.rej).then(function(){ attive--; prossima(); });
  }
  return function(fn){ return new Promise(function(res, rej){ attesa.push({ fn:fn, res:res, rej:rej }); prossima(); }); };
})();

/* ---------- livelli e tasto indietro ----------
   Ogni cosa che si apre sopra (chat, file, pannello) aggiunge una voce
   alla cronologia: così il tasto indietro del telefono la chiude invece
   di uscire dall'app. */

var pila = [], dopoIndietro = [];
function apriLivello(chiudi){
  pila.push(chiudi);
  history.pushState({ regia: pila.length }, '', '');
}
/* history.back() non è immediato: quello che va aperto dopo (un altro
   pannello, una chat) aspetta che il livello sia chiuso davvero, se no
   il «popstate» in ritardo chiuderebbe quello nuovo */
function chiudiLivello(poi){
  if(typeof poi !== 'function') poi = null;   // usato anche come onclick: arriva l'evento del clic
  if(poi) dopoIndietro.push(poi);
  if(pila.length) history.back();
  else { var f = dopoIndietro.splice(0); f.forEach(function(x){ x(); }); }
}
window.addEventListener('popstate', function(){
  var chiudi = pila.pop();
  if(chiudi) chiudi();
  var f = dopoIndietro.splice(0);
  f.forEach(function(x){ x(); });
});

/* ---------- pannelli a scomparsa (al posto di prompt/confirm) ---------- */

function sheet(html, opts){
  opts = opts || {};
  var wrap = document.createElement('div'); wrap.className = 'sheet';
  wrap.innerHTML = '<div class="sheetbox">' + html + '</div>';
  var chiuso = false;
  function togli(){ if(chiuso) return; chiuso = true; if(wrap.parentNode) wrap.remove(); if(opts.onClose) opts.onClose(); }
  wrap.addEventListener('click', function(e){ if(e.target === wrap) chiudiLivello(); });
  $('sheets').appendChild(wrap);
  apriLivello(togli);
  return { el: wrap, close: function(poi){
    if(typeof poi !== 'function') poi = null;
    if(!chiuso) chiudiLivello(poi); else if(poi) poi();
  }, q: function(s){ return wrap.querySelector(s); } };
}

function askConfirm(titolo, testo, okLabel, altro){
  return new Promise(function(resolve){
    var esito = false;
    var s = sheet('<h2>' + titolo + '</h2><p class="help">' + testo + '</p>' +
      '<div class="btnrow"><button class="btn" id="_no">Annulla</button>' +
      (altro ? '<button class="btn" id="_alt">' + altro + '</button>' : '') +
      '<button class="btn primary" id="_si">' + (okLabel || 'Conferma') + '</button></div>',
      { onClose: function(){ resolve(esito); } });
    s.q('#_no').onclick = function(){ esito = false; s.close(); };
    s.q('#_si').onclick = function(){ esito = true; s.close(); };
    if(altro) s.q('#_alt').onclick = function(){ esito = 'altro'; s.close(); };
  });
}

/* ---------- date e ore ----------
   I giorni sono stringhe AAAA-MM-GG e i conti si fanno in UTC: niente
   sorprese col cambio dell'ora. «Oggi» e «adesso» sono quelli del fuso
   dell'agenda (Europe/Rome). */

var GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
var GG = ['dom','lun','mar','mer','gio','ven','sab'];
var MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function pad(n){ return (n < 10 ? '0' : '') + n; }
function dParse(s){ return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
function dFmt(ms){ var d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function dAdd(s, n){ return dFmt(dParse(s) + n * 864e5); }
function dDiff(a, b){ return Math.round((dParse(a) - dParse(b)) / 864e5); }
function dow(s){ return new Date(dParse(s)).getUTCDay(); }
function isoDow(s){ var w = dow(s); return w === 0 ? 7 : w; }
function dataOk(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && dFmt(dParse(s)) === s; }
function fuso(){ return (agenda.dati && agenda.dati.fuso) || 'Europe/Rome'; }
function locale(d, opts){
  try{ return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: fuso() }, opts)).format(d); }
  catch(e){ return new Intl.DateTimeFormat('en-CA', opts).format(d); }
}
function giornoDi(d){ return locale(d, { year:'numeric', month:'2-digit', day:'2-digit' }); }
function oraDi(d){ return locale(d, { hour:'2-digit', minute:'2-digit', hour12:false }).replace(/^24/, '00'); }
function oggi(){ return giornoDi(new Date()); }
function adessoLocale(){ return oggi() + 'T' + oraDi(new Date()); }
function dataBreve(s){ var d = new Date(dParse(s)); return GG[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MESI[d.getUTCMonth()].slice(0, 3); }
function dataLunga(s){ var d = new Date(dParse(s)); return GIORNI[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MESI[d.getUTCMonth()]; }
function relativo(s){
  var n = dDiff(s, oggi());
  if(n === 0) return 'oggi';
  if(n === 1) return 'domani';
  if(n === -1) return 'ieri';
  if(n > 1 && n < 7) return GIORNI[dow(s)];
  return dataBreve(s);
}
function quandoMsg(d){
  var g = giornoDi(d), n = dDiff(g, oggi());
  return n === 0 ? oraDi(d) : n === -1 ? 'ieri' : n > -7 ? GG[dow(g)] : d.getDate() + '/' + (d.getMonth() + 1);
}

/* ---------- markdown minimale ----------
   Come nell'app Articoli, con due cose in più per le chat: un a capo
   singolo resta un a capo, e i link a file del repo si aprono dentro l'app.
   I link vanno a http(s), mailto, tel o a un percorso del repo: niente
   altri schemi (javascript: e simili), perché il token sta in questa pagina. */

function urlSicuro(u){
  if(/^(https?:|mailto:|tel:)/i.test(u)) return { url: u, esterno: true };
  if(/^[a-z][a-z0-9+.-]*:/i.test(u) || /^\/\//.test(u) || /^#/.test(u)) return null;
  return { url: u, esterno: false };
}

function mdInline(s){
  s = escapeHtml(s);
  var codici = [];
  s = s.replace(/`([^`]+)`/g, function(m, c){ codici.push(c); return '\u0000' + (codici.length - 1) + '\u0000'; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function(m, alt, u){
    var v = urlSicuro(u); if(!v) return alt;
    return v.esterno ? (/^https:/i.test(v.url) ? '<img alt="' + alt + '" src="' + v.url + '" referrerpolicy="no-referrer">' : alt)
                     : '<img alt="' + alt + '" data-repo="' + v.url + '">';
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, t, u){
    var v = urlSicuro(u); if(!v) return t;
    return v.esterno ? '<a href="' + v.url + '" target="_blank" rel="noopener">' + t + '</a>'
                     : '<a href="#" class="repo" data-repo="' + v.url + '">' + t + '</a>';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|\s)_([^_\n]+)_(?=\s|$|[.,;:!?])/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>"')\]]+)/g, function(m, pre, url){
    var coda = '', t = url.match(/[.,;:!?]+$/);
    if(t){ coda = t[0]; url = url.slice(0, -coda.length); }
    return pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url.replace(/^https?:\/\//, '') + '</a>' + coda;
  });
  return s.replace(/\u0000(\d+)\u0000/g, function(m, i){ return '<code>' + codici[+i] + '</code>'; });
}

function mdToHtml(src, chat){
  var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  var out = [], i = 0;

  while(i < lines.length){
    var l = lines[i];

    if(/^```/.test(l)){
      var buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if(/^#{1,6}\s/.test(l)){
      var n = Math.min(4, l.match(/^#+/)[0].length);
      out.push('<h' + n + '>' + mdInline(l.replace(/^#+\s*/, '')) + '</h' + n + '>'); i++; continue;
    }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^>\s?/.test(l)){
      var q = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + mdToHtml(q.join('\n'), chat) + '</blockquote>'); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
      var cells = function(r){ return r.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdInline(c.trim()); }); };
      var head = cells(l); i += 2;
      var rows = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<table><thead><tr>' + head.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table>');
      continue;
    }
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      var stack = [], depths = [];
      while(i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){
        var m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
        var d = Math.floor(m[1].length / 2), tag = /\d/.test(m[2]) ? 'ol' : 'ul';
        while(depths.length && depths[depths.length - 1] > d){ out.push('</' + stack.pop() + '>'); depths.pop(); }
        if(!depths.length || depths[depths.length - 1] < d){ out.push('<' + tag + '>'); stack.push(tag); depths.push(d); }
        var voce = m[3].replace(/^\[( |x)\]\s+/i, function(mm, x){ return x === ' ' ? '☐ ' : '☑ '; });
        out.push('<li>' + mdInline(voce) + '</li>');
        i++;
      }
      while(stack.length) out.push('</' + stack.pop() + '>');
      continue;
    }
    if(l.trim() === ''){ i++; continue; }

    var p = [];
    while(i < lines.length && lines[i].trim() !== '' &&
          !/^(#{1,6}\s|```|>|\s*([-*+]|\d+[.)])\s)/.test(lines[i])){ p.push(lines[i]); i++; }
    var html = mdInline(p.join('\n'));
    // in chat un a capo è un a capo; nei documenti vale la regola del markdown
    out.push('<p>' + (chat ? html.replace(/\n/g, '<br>') : html.replace(/ {2,}\n|\\\n/g, '<br>').replace(/\n/g, ' ')) + '</p>');
  }
  return out.join('\n');
}

function leggiFrontmatter(testo){
  var campi = {};
  testo = String(testo).replace(/\r\n?/g, '\n');
  if(testo.indexOf('---\n') !== 0) return { campi: campi, corpo: testo };
  var fine = testo.indexOf('\n---', 4);
  if(fine < 0) return { campi: campi, corpo: testo };
  testo.slice(4, fine).split('\n').forEach(function(r){
    var i = r.indexOf(':'); if(i < 0) return;
    var k = r.slice(0, i).trim(), v = r.slice(i + 1).trim();
    if(/^\[.*\]$/.test(v)) v = v.slice(1, -1).split(',').map(function(x){ return x.trim().replace(/^["']|["']$/g, ''); }).filter(Boolean);
    campi[k] = v;
  });
  var corpo = testo.slice(fine + 4);
  return { campi: campi, corpo: corpo.charAt(0) === '\n' ? corpo.slice(1) : corpo };
}

function testoPiano(md){
  return String(md).replace(/```[\s\S]*?```/g, ' ').replace(/!\[[^\]]*\]\([^)]*\)/g, '🖼 ')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[#>*_`|~]/g, '').replace(/\s+/g, ' ').trim();
}

/* ---------- GitHub ---------- */

function api(path, opts){
  opts = opts || {};
  var url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + path;
  var h = { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  if(cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
  if(opts.body) h['Content-Type'] = 'application/json';
  return fetch(url, { method: opts.method || 'GET', headers: h, body: opts.body, cache: 'no-store' })
    .catch(function(){
      var e = new Error('Sei offline, o GitHub non risponde.'); e.offline = true; throw e;
    })
    .then(function(r){
      if(r.ok) return r.status === 204 ? null : r.json();
      return r.json().catch(function(){ return {}; }).then(function(j){
        var m = j.message || '';
        var e = new Error(
          r.status === 401 ? 'Token non valido o scaduto: rifallo e incollalo nelle Impostazioni.' :
          r.status === 403 && /rate limit/i.test(m) ? 'GitHub chiede di rallentare (troppe richieste): riprovo fra poco.' :
          r.status === 403 ? 'Accesso negato (403): al token manca un permesso. ' + m :
          r.status === 404 ? 'Non trovato (404): controlla repo e ramo nelle Impostazioni. Per un repo privato il token deve poterlo leggere.' :
          r.status === 409 || r.status === 422 ? 'Il file è cambiato su GitHub nel frattempo.' :
          'Errore ' + r.status + ': ' + m);
        e.status = r.status; e.gh = m;
        throw e;
      });
    });
}

function getContent(path){
  return api('/contents/' + encPath(path) + '?ref=' + encodeURIComponent(cfg.branch)).then(function(d){
    if(d && d.content === '' && d.size > 0 && d.sha){
      return api('/git/blobs/' + d.sha).then(function(b){ d.content = b.content; return d; });
    }
    return d;
  });
}

function putFile(path, contentB64, sha, msg){
  var body = { message: msg || ('modifica da app: ' + path), content: contentB64, branch: cfg.branch };
  if(sha) body.sha = sha;
  return api('/contents/' + encPath(path), { method:'PUT', body: JSON.stringify(body) }).then(function(r){
    if(r && r.content && r.content.sha){
      DB.put(r.content.sha, contentB64);
      if(idx) idx.files[path] = r.content.sha;
    }
    return r;
  });
}

/* Più file in un commit solo (messaggio + allegati, una chat nuova): così il
   workflow parte una volta, e trova già tutto. files: [{path, text} | {path, b64}] */
function commitFiles(files, msg, tentativo){
  tentativo = tentativo || 0;
  var base;
  return api('/git/ref/heads/' + encodeURIComponent(cfg.branch)).then(function(r){
    base = r.object.sha;
    return api('/git/commits/' + base);
  }).then(function(c){
    return Promise.all(files.map(function(f){
      if(f.text != null) return { path: f.path, mode: '100644', type: 'blob', content: f.text };
      return api('/git/blobs', { method:'POST', body: JSON.stringify({ content: f.b64, encoding: 'base64' }) })
        .then(function(b){ return { path: f.path, mode: '100644', type: 'blob', sha: b.sha }; });
    })).then(function(tree){
      return api('/git/trees', { method:'POST', body: JSON.stringify({ base_tree: c.tree.sha, tree: tree }) });
    });
  }).then(function(t){
    return api('/git/commits', { method:'POST', body: JSON.stringify({ message: msg, tree: t.sha, parents: [base] }) });
  }).then(function(nc){
    return api('/git/refs/heads/' + encodeURIComponent(cfg.branch), { method:'PATCH', body: JSON.stringify({ sha: nc.sha, force: false }) })
      .then(function(){ if(idx) idx.commit = null; return nc; });
  }).catch(function(e){
    // qualcun altro (Claude) ha scritto nel frattempo: si rifà sopra il commit nuovo
    if((e.status === 422 || e.status === 409) && tentativo < 3) return commitFiles(files, msg, tentativo + 1);
    throw e;
  });
}

function blobB64(sha){
  return DB.get(sha).then(function(v){
    if(v != null) return v;
    return coda(function(){ return api('/git/blobs/' + sha); }).then(function(b){
      var c = String(b.content || '').replace(/\s/g, '');
      DB.put(sha, c);
      return c;
    });
  });
}
var testi = {};
function blobText(sha){
  if(testi[sha] != null) return Promise.resolve(testi[sha]);
  return blobB64(sha).then(function(b){ return (testi[sha] = b64decodeText(b)); });
}
function fileText(path){
  var sha = idx && idx.files[path];
  return sha ? blobText(sha) : Promise.resolve(null);
}
function fileJSON(path, fb){
  return fileText(path).then(function(t){
    if(t == null) return fb;
    try{ return JSON.parse(t); }catch(e){ return fb; }
  });
}

/* ---------- agenda: lo stesso formato di .regia/comune.py ----------
   Un evento o un compito per riga, campi vuoti tolti, chiavi sempre nello
   stesso ordine: così i commit dell'app e quelli di Claude si uniscono bene. */

var ORD_EV = ['id','titolo','tipo','data','ora','ora_fine','data_fine','luogo','note','chat','ripeti','creato_da','creato','modificato'];
var ORD_CO = ['id','titolo','scadenza','priorita','fatto','fatto_il','chat','note','creato_da','creato','modificato'];
var TIPI = [['appuntamento','Appuntamento'],['promemoria','Promemoria'],['scadenza','Scadenza'],['blocco','Blocco']];

function vuoto(v){
  return v == null || v === '' || v === false || (Array.isArray(v) && !v.length) ||
         (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
}
function normalizza(voce, ordine){
  var out = {};
  ordine.concat(Object.keys(voce).filter(function(k){ return ordine.indexOf(k) < 0; })).forEach(function(k){
    if(!(k in voce) || vuoto(voce[k])) return;
    var v = voce[k];
    if(v && typeof v === 'object' && !Array.isArray(v)){
      var w = {};
      Object.keys(v).forEach(function(kk){ if(!vuoto(v[kk])) w[kk] = v[kk]; });
      v = w;
    }
    out[k] = v;
  });
  return out;
}
function cmp(a, b){ return a < b ? -1 : a > b ? 1 : 0; }
function cmpTuple(a, b){ for(var i = 0; i < a.length; i++){ var c = cmp(a[i], b[i]); if(c) return c; } return 0; }
function ordinaAgenda(d){
  d.eventi = (d.eventi || []).map(function(e){ return normalizza(e, ORD_EV); }).sort(function(a, b){
    return cmpTuple([a.data || '', a.ora || '', a.titolo || '', a.id], [b.data || '', b.ora || '', b.titolo || '', b.id]);
  });
  d.compiti = (d.compiti || []).map(function(c){ return normalizza(c, ORD_CO); }).sort(function(a, b){
    return cmpTuple([a.scadenza || '9999-99-99', a.creato || '', a.id], [b.scadenza || '9999-99-99', b.creato || '', b.id]);
  });
  return d;
}
function serializzaAgenda(d){
  ordinaAgenda(d);
  var r = ['{'];
  Object.keys(d).forEach(function(k){
    if(k !== 'eventi' && k !== 'compiti') r.push('  ' + JSON.stringify(k) + ': ' + JSON.stringify(d[k]) + ',');
  });
  ['eventi', 'compiti'].forEach(function(k, i){
    var lista = d[k], v = i === 0 ? ',' : '';
    if(!lista.length){ r.push('  "' + k + '": []' + v); return; }
    r.push('  "' + k + '": [');
    lista.forEach(function(x, j){ r.push('    ' + JSON.stringify(x) + (j < lista.length - 1 ? ',' : '')); });
    r.push('  ]' + v);
  });
  r.push('}');
  return r.join('\n') + '\n';
}
function agendaVuota(){ return { versione: 1, fuso: 'Europe/Rome', eventi: [], compiti: [] }; }

/* le volte in cui un evento cade nell'intervallo [da, a]: gemella di occorrenze() in comune.py */
function occorrenze(ev, da, a){
  if(!dataOk(ev.data)) return [];
  var inizio = ev.data, durata = dataOk(ev.data_fine) ? Math.max(0, dDiff(ev.data_fine, ev.data)) : 0, r = ev.ripeti;
  var salta = r && r.salta ? r.salta : [];
  var fino = r && dataOk(r.fino) ? r.fino : a; if(fino > a) fino = a;
  var passo = (r && r.intervallo > 0) ? r.intervallo : 1, out = [];
  function tieni(d){ if(salta.indexOf(d) < 0 && d <= a && dAdd(d, durata) >= da) out.push(d); }
  if(!r) tieni(inizio);
  else if(r.ogni === 'giorno'){
    // si salta dritti vicino a «da»: un evento di tutti i giorni da anni non costa niente
    var d = inizio;
    if(dDiff(da, d) > durata + passo){ var k0 = Math.floor((dDiff(da, d) - durata) / passo); d = dAdd(d, k0 * passo); }
    for(; d <= fino; d = dAdd(d, passo)) tieni(d);
  } else if(r.ogni === 'settimana'){
    var giorni = (r.giorni && r.giorni.length ? r.giorni : [isoDow(inizio)]).slice().sort();
    var lun = dAdd(inizio, -(isoDow(inizio) - 1)), k = 0;
    while(lun <= fino){
      if(k % passo === 0) giorni.forEach(function(g){ var dd = dAdd(lun, g - 1); if(dd >= inizio && dd <= fino) tieni(dd); });
      lun = dAdd(lun, 7); k++;
    }
  } else if(r.ogni === 'mese' || r.ogni === 'anno'){
    var mesi = passo * (r.ogni === 'anno' ? 12 : 1), y = +inizio.slice(0, 4), m = +inizio.slice(5, 7) - 1, g = +inizio.slice(8, 10);
    for(var j = 0; j < 2400; j++){
      var mm = m + j * mesi, yy = y + Math.floor(mm / 12); mm = mm % 12;
      var dt = new Date(Date.UTC(yy, mm, g));
      if(dt.getUTCMonth() !== mm) continue;     // il 31 nei mesi corti, il 29 febbraio: si salta
      var s = dFmt(dt.getTime());
      if(s > fino) break;
      tieni(s);
    }
  }
  return out;
}

/* giorno → [{ev, k (giorno n di un evento lungo), dur}] */
function eventiNelPeriodo(dati, da, a){
  var per = {};
  (dati.eventi || []).forEach(function(ev){
    var dur = dataOk(ev.data_fine) ? Math.max(0, dDiff(ev.data_fine, ev.data)) : 0;
    occorrenze(ev, da, a).forEach(function(ini){
      for(var k = 0; k <= dur; k++){
        var g = dAdd(ini, k);
        if(g >= da && g <= a) (per[g] = per[g] || []).push({ ev: ev, k: k, dur: dur, ini: ini });
      }
    });
  });
  Object.keys(per).forEach(function(g){
    per[g].sort(function(x, y){ return cmp((x.k ? '' : x.ev.ora) || '', (y.k ? '' : y.ev.ora) || ''); });
  });
  return per;
}

function descriviRipeti(r){
  if(!r) return '';
  var n = r.intervallo || 1;
  var nomi = { giorno:['ogni giorno','ogni %d giorni'], settimana:['ogni settimana','ogni %d settimane'],
               mese:['ogni mese','ogni %d mesi'], anno:['ogni anno','ogni %d anni'] }[r.ogni] || ['', ''];
  var s = n === 1 ? nomi[0] : nomi[1].replace('%d', n);
  if(r.giorni && r.giorni.length && r.ogni === 'settimana') s += ' (' + r.giorni.map(function(g){ return GG[g % 7]; }).join(', ') + ')';
  if(r.fino) s += ' fino al ' + dataBreve(r.fino);
  return s;
}

/* ============================================================
   Modello: chat, messaggi, stato di Claude
   ============================================================ */

var NOME_MSG = /^(\d{8})-(\d{6})-(andrea|claude|sistema)-([a-z0-9]{4})\.md$/;
var chats = {};                 // slug → { slug, msgs:[info], altri:[], meta, stato }
var agenda = { dati: null, sha: null };
var impostazioni = null;
var visti = {};                 // per chat: nomi dei messaggi già conosciuti (per accorgersi delle risposte nuove)
var primaVolta = true;

function infoMsg(nome){
  var m = NOME_MSG.exec(nome);
  if(!m) return null;
  var s = m[1] + m[2];
  var q = new Date(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(8, 10), +s.slice(10, 12), +s.slice(12, 14)));
  return { nome: nome, autore: m[3], quando: q };
}
function stampa(d){
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + '-' +
         pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds());
}
function ultimoNome(slug){
  var c = chats[slug], u = c && c.msgs.length ? c.msgs[c.msgs.length - 1].nome : '';
  outbox.forEach(function(o){ if(o.chat === slug && o.nome > u) u = o.nome; });
  return u;
}
/* sempre dopo l'ultimo messaggio della chat, anche se l'orologio del telefono è indietro */
function nomeMessaggio(slug){
  var d = new Date(); d.setMilliseconds(0);
  var u = ultimoNome(slug), iu = u && infoMsg(u);
  if(iu && d <= iu.quando) d = new Date(iu.quando.getTime() + 1000);
  return stampa(d) + '-andrea-' + rand(4) + '.md';
}

function costruisciChats(){
  var out = {};
  if(!idx) return out;
  Object.keys(idx.files).forEach(function(p){
    var m = /^chat\/([^\/]+)\/(.+)$/.exec(p); if(!m) return;
    var c = out[m[1]] || (out[m[1]] = { slug: m[1], msgs: [], altri: [], meta: null, stato: null });
    var resto = m[2];
    if(resto.indexOf('messaggi/') === 0 && resto.indexOf('/', 9) < 0){
      var info = infoMsg(resto.slice(9));
      if(info){ info.path = p; info.sha = idx.files[p]; c.msgs.push(info); }
    } else if(resto !== 'chat.json' && resto !== 'stato.json'){
      c.altri.push(resto);
    }
  });
  Object.keys(out).forEach(function(s){
    if(!idx.files['chat/' + s + '/chat.json']) delete out[s];
    else out[s].msgs.sort(function(a, b){ return cmp(a.nome, b.nome); });
  });
  return out;
}

/* legge dalla cache (o da GitHub) quello che serve per disegnare: metadati,
   stato, l'ultimo messaggio di ogni chat, l'agenda, le impostazioni */
function caricaModello(){
  var nuovo = costruisciChats();
  var lavori = Object.keys(nuovo).map(function(s){
    var c = nuovo[s];
    var ultimo = c.msgs[c.msgs.length - 1];
    return Promise.all([
      fileJSON('chat/' + s + '/chat.json', {}),
      fileJSON('chat/' + s + '/stato.json', {}),
      ultimo ? blobText(ultimo.sha).catch(function(){ return ''; }) : null
    ]).then(function(r){ c.meta = r[0] || {}; c.stato = r[1] || {}; });
  });
  lavori.push(fileJSON(AGENDA, null).then(function(d){
    agenda.dati = d && typeof d === 'object' ? d : agendaVuota();
    agenda.dati.eventi = agenda.dati.eventi || []; agenda.dati.compiti = agenda.dati.compiti || [];
    agenda.sha = idx.files[AGENDA] || null;
  }));
  lavori.push(fileJSON(IMPOSTAZIONI, {}).then(function(d){ impostazioni = d || {}; }));
  return Promise.all(lavori).then(function(){ chats = nuovo; });
}

function titoloChat(c){ return (c.meta && c.meta.titolo) || c.slug; }

var COLORI = ['#2f7f86','#c0603a','#6a5acd','#3a78c9','#b2457a','#4f8a3a','#a0782a','#5a6fa5','#8a5a3a','#2a8f6a'];
function coloreChat(slug){
  if(slug === 'generale') return 'var(--deep-2)';
  var h = 0; for(var i = 0; i < slug.length; i++) h = (h * 31 + slug.charCodeAt(i)) >>> 0;
  return COLORI[h % COLORI.length];
}
function avatarHtml(c){
  if(c.slug === 'generale') return '<svg class="i"><use href="#i-spark"/></svg>';
  var t = titoloChat(c).trim();
  return escapeHtml((t.charAt(0) || '?').toUpperCase());
}

function runAttivo(){
  if(!runs || !runs.ok) return null;
  var r = runs.lista.filter(function(x){ return x.status !== 'completed'; });
  return r.length ? r[0] : null;
}
function runFallitoDopo(quando){
  if(!runs || !runs.ok) return null;
  var r = runs.lista.filter(function(x){ return x.status === 'completed'; })[0];
  if(r && r.conclusion !== 'success' && r.conclusion !== 'skipped' && new Date(r.created_at) >= new Date(quando.getTime() - 60000)) return r;
  return null;
}

/* a che punto è Claude con questa chat */
function statoChat(c){
  var fino = (c.stato && c.stato.risposto_fino_a) || '';
  var attesa = c.msgs.filter(function(m){ return m.autore === 'andrea' && m.nome > fino; });
  var uscita = outbox.filter(function(o){ return o.chat === c.slug; });
  var r = { tipo: 'ok', attesa: attesa, uscita: uscita, run: null };
  if(uscita.some(function(o){ return o.errore; })) r.tipo = 'nonInviato';
  else if(uscita.length) r.tipo = 'invio';
  else if(attesa.length){
    var ultimo = c.msgs[c.msgs.length - 1];
    var run = runAttivo();
    if(ultimo.autore === 'sistema' && ultimo.nome > attesa[attesa.length - 1].nome) r.tipo = 'errore';
    else if(run){ r.tipo = run.status === 'in_progress' ? 'lavoro' : 'coda'; r.run = run; }
    else if((r.run = runFallitoDopo(attesa[attesa.length - 1].quando))) r.tipo = 'runFallito';
    else r.tipo = 'attesa';
  }
  return r;
}
var ETICHETTE = {
  invio: 'invio…', nonInviato: 'non inviato', lavoro: 'Claude sta lavorando', coda: 'in coda',
  attesa: 'in attesa di Claude', errore: 'Claude non ha risposto', runFallito: 'turno interrotto'
};
function nonLetti(c){
  var l = letti[c.slug] || '';
  return c.msgs.filter(function(m){ return m.autore !== 'andrea' && m.nome > l; }).length;
}
function inAttesaGenerale(){
  return Object.keys(chats).some(function(s){ var t = statoChat(chats[s]).tipo; return t !== 'ok'; }) || agq.length || outbox.length;
}

/* ============================================================
   Sincronizzazione
   ============================================================ */

var sincro = null, timer = null, ancora = false;

function setGBanner(html, kind){
  $('gbanner').innerHTML = html ? '<div class="banner ' + (kind || 'warn') + '">' + html + '</div>' : '';
}

function sync(forza){
  if(!cfg.token) return Promise.resolve();
  // chiesta mentre ne gira già una (un messaggio appena scritto): si rifà subito dopo
  if(sincro){ ancora = true; return sincro; }
  $('btnRefresh').classList.add('spin');
  sincro = inviaOutbox()
    .then(salvaAgendaCoda)
    .then(function(){ return api('/git/ref/heads/' + encodeURIComponent(cfg.branch)); })
    .then(function(ref){
      var sha = ref.object.sha;
      if(!forza && idx && idx.commit === sha) return;
      return api('/git/trees/' + sha + '?recursive=1').catch(function(e){
        if(e.status === 404 || e.status === 422) return api('/git/trees/' + encodeURIComponent(cfg.branch) + '?recursive=1');
        throw e;
      }).then(function(t){
        var files = {};
        (t.tree || []).forEach(function(i){ if(i.type === 'blob') files[i.path] = i.sha; });
        idx = { commit: sha, files: files, at: Date.now() };
        lsSet(K.idx, idx);
      });
    })
    .then(caricaModello)
    .then(aggiornaRuns)
    .then(function(){
      setGBanner('');
      notaRisposteNuove();
      disegna();
    })
    .catch(function(err){
      if(err.offline) setGBanner('Offline: vedi l\'ultima copia. Quello che scrivi parte appena torna la rete.', 'warn');
      else if(err.status === 401) setGBanner(escapeHtml(err.message) + ' <button id="_gb">Impostazioni</button>', 'err');
      else setGBanner(escapeHtml(err.message), 'err');
      var b = $('_gb'); if(b) b.onclick = apriImpostazioni;
      disegna();
    })
    .then(function(){
      sincro = null;
      $('btnRefresh').classList.remove('spin');
      if(ancora){ ancora = false; sync(); } else programma();
    });
  return sincro;
}

/* quando Claude è al lavoro si guarda spesso; se no, ogni tanto. In
   background mai: si riprende appena l'app torna davanti. */
function programma(){
  clearTimeout(timer);
  if(document.hidden || !cfg.token) return;
  var svelto = inAttesaGenerale() || runAttivo();
  timer = setTimeout(function(){ sync(); }, svelto ? 7000 : aperta ? 20000 : 45000);
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ clearTimeout(timer); return; }
  sync();
});
window.addEventListener('online', function(){ sync(); });

function aggiornaRuns(){
  var serve = inAttesaGenerale() || runAttivo() || !runs || (Date.now() - (runs.at || 0)) > 120000;
  if(!serve) return Promise.resolve();
  return api('/actions/workflows/' + WORKFLOW + '/runs?per_page=6').then(function(d){
    runs = { at: Date.now(), ok: true, lista: (d.workflow_runs || []).map(function(r){
      return { id: r.id, status: r.status, conclusion: r.conclusion, url: r.html_url, created_at: r.created_at,
               run_started_at: r.run_started_at, event: r.event };
    }) };
    lsSet(K.runs, runs);
  }).catch(function(e){
    if(e.offline) throw e;
    runs = { at: Date.now(), ok: false, motivo: e.status === 404 ? 'manca' : 'permesso', lista: [] };
    lsSet(K.runs, runs);
  });
}

function notaRisposteNuove(){
  Object.keys(chats).forEach(function(s){
    var c = chats[s], prima = visti[s];
    var nomi = c.msgs.map(function(m){ return m.nome; });
    visti[s] = nomi;
    if(primaVolta || !prima) return;
    var nuove = c.msgs.filter(function(m){ return m.autore !== 'andrea' && prima.indexOf(m.nome) < 0; });
    if(!nuove.length) return;
    if(aperta && aperta.slug === s && !document.hidden){ segnaLetto(s); return; }
    toast((nuove[0].autore === 'sistema' ? 'Avviso in ' : 'Claude ha risposto in ') + '«' + escapeHtml(titoloChat(c)) + '»',
          5000, { label: 'Apri', fn: function(){ apriChat(s); } });
  });
  primaVolta = false;
}

function segnaLetto(slug){
  var c = chats[slug]; if(!c || !c.msgs.length) return;
  var u = c.msgs[c.msgs.length - 1].nome;
  if(letti[slug] !== u){ letti[slug] = u; lsSet(K.letti, letti); }
}

function aggiornaBadge(){
  var n = 0;
  Object.keys(chats).forEach(function(s){ if(!(chats[s].meta || {}).archiviata) n += nonLetti(chats[s]); });
  $('badgeChat').textContent = n ? String(n) : '';
  var d = agendaVista(), o = oggi();
  var scaduti = d.compiti.filter(function(c){ return !c.fatto && c.scadenza && c.scadenza <= o; }).length;
  $('badgeAgenda').textContent = scaduti ? String(scaduti) : '';
  try{
    if(navigator.setAppBadge){ if(n) navigator.setAppBadge(n); else navigator.clearAppBadge(); }
  }catch(e){}
}

/* ============================================================
   Messaggi in uscita: prima in coda sul telefono, poi su GitHub
   ============================================================ */

function salvaOutbox(){ lsSet(K.outbox, outbox.map(function(o){ var c = Object.assign({}, o); delete c.inVolo; return c; })); }

function accoda(slug, testo, allegati){
  var nome = nomeMessaggio(slug);
  var item = { nome: nome, chat: slug, testo: testo, allegati: [], errore: '' };
  var lavori = (allegati || []).map(function(a, i){
    var rel = 'allegati/' + nome.slice(0, 15) + '-' + a.nome;
    item.allegati.push({ rel: rel, nome: a.nome, tipo: a.tipo });
    return DB.put('out:' + nome + ':' + i, a.b64);
  });
  return Promise.all(lavori).then(function(){
    outbox.push(item); salvaOutbox();
    return item;
  });
}

function testoMessaggio(o){
  var t = o.testo.trim() + '\n';
  if(o.allegati.length) t = '---\nallegati: [' + o.allegati.map(function(a){ return a.rel; }).join(', ') + ']\n---\n' + t;
  return t;
}

var inviando = null;
function inviaOutbox(){
  if(inviando) return inviando;
  if(!outbox.length) return Promise.resolve();
  inviando = outbox.slice().reduce(function(catena, o){
    return catena.then(function(){
      if(outbox.indexOf(o) < 0) return;
      var path = 'chat/' + o.chat + '/messaggi/' + o.nome, testo = testoMessaggio(o);
      var msg = 'messaggio da app: chat/' + o.chat;
      var passo;
      if(!o.allegati.length){
        passo = putFile(path, b64encode(testo), null, msg).then(function(r){ testi[r.content.sha] = testo; });
      } else {
        passo = Promise.all(o.allegati.map(function(a, i){ return DB.get('out:' + o.nome + ':' + i); })).then(function(b64s){
          var files = o.allegati.map(function(a, i){ return { path: 'chat/' + o.chat + '/' + a.rel, b64: b64s[i] || '' }; });
          files.push({ path: path, text: testo });
          return commitFiles(files, msg);
        }).then(function(){ o.allegati.forEach(function(a, i){ DB.del('out:' + o.nome + ':' + i); }); });
      }
      return passo.then(function(){
        outbox = outbox.filter(function(x){ return x !== o; }); salvaOutbox();
      }).catch(function(e){
        // 422 su un file nuovo: c'è già, quindi era partito davvero (era andata persa solo la risposta)
        if(e.status === 422 && !o.allegati.length){ outbox = outbox.filter(function(x){ return x !== o; }); salvaOutbox(); return; }
        o.errore = e.message; salvaOutbox();
        if(e.offline || e.status === 401) throw e;
      });
    });
  }, Promise.resolve()).then(function(){ inviando = null; }, function(e){ inviando = null; throw e; });
  return inviando;
}

function riprovaRisposta(){
  var t = toast('<span class="spin"></span> chiedo a Claude di riprovare…', 0);
  return api('/actions/workflows/' + WORKFLOW + '/dispatches', { method:'POST',
      body: JSON.stringify({ ref: cfg.branch, inputs: { modo: 'risposte' } }) })
    .then(function(){
      t.remove(); toast('Fatto: Claude riparte tra qualche secondo.');
      if(runs) runs.at = 0;
      setTimeout(function(){ sync(); }, 4000);
    })
    .catch(function(e){
      t.remove();
      if(e.status === 403 || e.status === 404) toast('Il token non può far ripartire Claude: serve il permesso «Actions: Read and write». Intanto puoi riscrivere il messaggio.', 7000);
      else toast(escapeHtml(e.message), 5000);
    });
}

/* ============================================================
   Elenco delle chat
   ============================================================ */

var mostraArchiviate = false;

function chatOrdinate(){
  return Object.keys(chats).map(function(s){ return chats[s]; }).sort(function(a, b){
    if(a.slug === 'generale') return -1;
    if(b.slug === 'generale') return 1;
    var ua = ultimoNome(a.slug) || 'z' + (a.meta.creata || ''), ub = ultimoNome(b.slug) || 'z' + (b.meta.creata || '');
    return cmp(ub, ua);
  });
}

function anteprima(c){
  var o = outbox.filter(function(x){ return x.chat === c.slug; }).pop();
  if(o) return '<b>Tu:</b> ' + escapeHtml(testoPiano(o.testo).slice(0, 120));
  var u = c.msgs[c.msgs.length - 1];
  if(!u) return escapeHtml((c.meta && c.meta.descrizione) || 'Nessun messaggio ancora');
  var t = testi[u.sha];
  var corpo = t != null ? testoPiano(leggiFrontmatter(t).corpo).slice(0, 140) : '…';
  var chi = u.autore === 'andrea' ? '<b>Tu:</b> ' : '';
  return chi + escapeHtml(corpo);
}

function cardChat(c){
  var st = statoChat(c), n = nonLetti(c), u = c.msgs[c.msgs.length - 1];
  var stato = st.tipo === 'ok' ? '' :
    '<span class="st ' + (st.tipo === 'runFallito' || st.tipo === 'nonInviato' ? 'errore' : st.tipo) + '">' +
    (st.tipo === 'lavoro' || st.tipo === 'coda' || st.tipo === 'attesa' || st.tipo === 'invio' ? '<span class="dotp"></span>' : '') +
    ETICHETTE[st.tipo] + '</span>';
  var b = document.createElement('button');
  b.className = 'chatcard' + (c.slug === 'generale' ? ' gen' : '');
  b.innerHTML =
    '<div class="av" style="background:' + coloreChat(c.slug) + '">' + avatarHtml(c) + '</div>' +
    '<div class="cc-body"><div class="cc-top"><span class="cc-t">' + escapeHtml(titoloChat(c)) + '</span>' +
    '<span class="cc-time">' + (u ? quandoMsg(u.quando) : '') + '</span></div>' +
    '<div class="cc-bot"><span class="cc-prev">' + anteprima(c) + '</span>' + stato +
    (n ? '<span class="badge">' + n + '</span>' : '') + '</div></div>';
  b.onclick = function(){ apriChat(c.slug); };
  return b;
}

function disegnaChatList(){
  var host = $('main');
  host.innerHTML = '';
  var lista = chatOrdinate();
  if(!idx){ host.innerHTML = '<div class="empty"><span class="spin" style="border-color:var(--line);border-top-color:var(--accent)"></span><br>carico le chat…</div>'; return; }
  if(!lista.length){
    host.innerHTML = '<div class="empty">Nel repo <b>' + escapeHtml(cfg.owner + '/' + cfg.repo) + '</b> non c\'è ancora nessuna chat.<br>' +
      'Controlla nelle Impostazioni che sia quello giusto, o creane una col tasto qui sotto.</div>';
    return;
  }
  var attive = lista.filter(function(c){ return !c.meta.archiviata; }), arch = lista.filter(function(c){ return c.meta.archiviata; });
  attive.forEach(function(c){ host.appendChild(cardChat(c)); });
  if(arch.length){
    var h = document.createElement('div'); h.className = 'sec-h';
    h.innerHTML = 'Archiviate · ' + arch.length + '<button>' + (mostraArchiviate ? 'Nascondi' : 'Mostra') + '</button>';
    h.querySelector('button').onclick = function(){ mostraArchiviate = !mostraArchiviate; disegnaChatList(); };
    host.appendChild(h);
    if(mostraArchiviate) arch.forEach(function(c){ host.appendChild(cardChat(c)); });
  }
}

function nuovaChat(){
