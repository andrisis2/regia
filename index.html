<script>
(function(){
'use strict';

/* ============================================================
   Regia — chat con Claude divise per progetto, più l'agenda.
   I dati stanno nel repo privato (regia-dati): ogni messaggio è
   un file, ogni modifica un commit. Sul repo gira un workflow che
   fa rispondere Claude Code; l'app guarda i commit e mostra.
   ============================================================ */

var VERSIONE = '3.0';
var DEFAULTS = { owner:'andrisis2', repo:'regia-dati', branch:'main', token:'' };
var WORKFLOW = 'claude.yml';
var AGENDA = 'agenda/agenda.json';
var GOOGLE = 'agenda/google.json';          // Google Calendar, in sola lettura (lo scrive il workflow)
var USO = 'uso/uso.json';                   // quanto si usa Claude, turno per turno (idem)
var IMPOSTAZIONI = 'impostazioni.json';
var P = 'regia.';
var K = {
  cfg:P+'cfg', idx:P+'idx', outbox:P+'outbox', agq:P+'agq', letti:P+'letti', ui:P+'ui', runs:P+'runs', pref:P+'pref',
  draft:function(s){ return P+'draft:'+s; }
};

/* i modi in cui si può chiedere a Claude di lavorare su un messaggio: finiscono
   nel campo «modo» del frontmatter. Gemello di MODI in .regia/comune.py, dove
   c'è scritto cosa vogliono dire per Claude. */
var MODI = {
  ricerca: { nome: 'Ricerca approfondita', icona: 'globe', invito: 'Cosa cerco sul web, a fondo?' },
  pensa: { nome: 'Ragiona a fondo', icona: 'bulb', invito: 'Su cosa ragiono con calma?' }
};
/* le risposte rapide di Claude (campo «proposte», separate da « | »):
   gemello di leggi_proposte() in comune.py */
var MAX_PROPOSTE = 4;
/* il modo di un messaggio, solo se è uno di quelli veri (il valore arriva dal repo) */
function modoDi(k){ return typeof k === 'string' && Object.prototype.hasOwnProperty.call(MODI, k) ? MODI[k] : null; }

/* i modelli che si possono scegliere (campo «modello» del messaggio, o
   impostazioni.json per tutti): gemello di MODELLI in .regia/comune.py.
   '' = automatico, cioè quello delle Impostazioni o il predefinito.
   Il colore (per l'uso) segue il modello, mai la classifica. */
var MODELLI = [
  { id: '', nome: 'Automatico', breve: 'Auto', descr: 'Quello scelto nelle Impostazioni: va bene quasi sempre.' },
  { id: 'claude-fable-5-1', nome: 'Fable 5.1', breve: 'Fable', serie: 1, descr: 'Il più capace, per i lavori più difficili e lunghi. Consuma di più.' },
  { id: 'claude-opus-5-5', nome: 'Opus 5.5', breve: 'Opus', serie: 2, descr: 'Ragionamento profondo, codice, ricerche serie.' },
  { id: 'claude-sonnet-5-5', nome: 'Sonnet 5.5', breve: 'Sonnet', serie: 3, descr: 'Veloce e bravo: il giusto equilibrio per tutti i giorni.' },
  { id: 'claude-haiku-5-5', nome: 'Haiku 5.5', breve: 'Haiku', serie: 4, descr: 'Il più rapido e leggero, per le cose semplici. Consuma pochissimo.' }
];
function modelloDi(id){ return MODELLI.filter(function(m){ return m.id === id; })[0] || null; }
function nomeModello(id){ var m = modelloDi(id); return m ? m.nome : (id || 'predefinito'); }

/* le routine girano nei tre giri del workflow: il cron è in UTC (5, 11, 17),
   quindi l'ora che vede Andrea cambia con l'ora legale. Gemello di
   ORE_UTC in .regia/comune.py e del cron in claude.yml. */
var FASCE = [['mattina', 'Mattina', 5], ['pomeriggio', 'Pomeriggio', 11], ['sera', 'Sera', 17]];

function lsGet(k, fb){ try{ var v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); }catch(e){ return fb; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

var cfg = Object.assign({}, DEFAULTS, lsGet(K.cfg, {}));
var idx = lsGet(K.idx, null);          // ultimo albero letto: { commit, files: { percorso: sha } }
var outbox = lsGet(K.outbox, []);      // messaggi non ancora arrivati su GitHub
var agq = lsGet(K.agq, []);            // modifiche all'agenda non ancora salvate
var letti = lsGet(K.letti, {});        // per chat: nome dell'ultimo messaggio visto
var ui = Object.assign({ chat:null, agenda:false, agv:'prossimi', mese:null, giorno:null, dove:'generale' }, lsGet(K.ui, {}));
var runs = lsGet(K.runs, null);        // ultimi turni del workflow, se il token li può vedere
var pref = Object.assign({ tema:'auto', nome:'Andrea' }, lsGet(K.pref, {}));

var $ = function(id){ return document.getElementById(id); };
function salvaUi(){ lsSet(K.ui, ui); }

/* ---------- tema: quello del telefono, o scelto a mano ---------- */

var scuroDiSistema = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function temaScuro(){ return pref.tema === 'scuro' || (pref.tema !== 'chiaro' && !!(scuroDiSistema && scuroDiSistema.matches)); }
function applicaTema(){
  if(pref.tema === 'auto') document.documentElement.removeAttribute('data-tema');
  else document.documentElement.setAttribute('data-tema', pref.tema);
  // la barra di stato del telefono prende il colore del fondo: con un tema
  // scelto a mano i due <meta> con la media query non bastano più
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){
    var scuro = pref.tema === 'auto' ? /dark/.test(m.getAttribute('media') || '') : temaScuro();
    m.setAttribute('content', scuro ? '#09090b' : '#f7f7f5');
  });
}
applicaTema();
if(scuroDiSistema && scuroDiSistema.addEventListener) scuroDiSistema.addEventListener('change', applicaTema);

/* ---------- cache dei blob: un blob di git non cambia mai, quindi si tiene per sempre ---------- */

var DB = (function(){
  var aperto = null, mem = {};
  function apri(){
    if(aperto) return aperto;
    aperto = new Promise(function(res){
      try{
        var r = indexedDB.open('regia', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('blob'); };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ res(null); };
      }catch(e){ res(null); }
    });
    return aperto;
  }
  function get(k){
    if(k in mem) return Promise.resolve(mem[k]);
    return apri().then(function(db){
      if(!db) return undefined;
      return new Promise(function(res){
        try{
          var q = db.transaction('blob').objectStore('blob').get(k);
          q.onsuccess = function(){ if(q.result !== undefined) mem[k] = q.result; res(q.result); };
          q.onerror = function(){ res(undefined); };
        }catch(e){ res(undefined); }
      });
    });
  }
  function put(k, v){
    mem[k] = v;
    return apri().then(function(db){
      if(!db) return;
      return new Promise(function(res){
        try{
          var tx = db.transaction('blob', 'readwrite');
          tx.objectStore('blob').put(v, k);
          tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
        }catch(e){ res(); }
      });
    });
  }
  function del(k){
    delete mem[k];
    return apri().then(function(db){
      if(!db) return;
      return new Promise(function(res){
        try{ var tx = db.transaction('blob', 'readwrite'); tx.objectStore('blob').delete(k); tx.oncomplete = res; tx.onerror = res; }
        catch(e){ res(); }
      });
    });
  }
  function svuota(){
    mem = {};
    return apri().then(function(db){
      if(!db) return;
      return new Promise(function(res){
        try{ var tx = db.transaction('blob', 'readwrite'); tx.objectStore('blob').clear(); tx.oncomplete = res; tx.onerror = res; }
        catch(e){ res(); }
      });
    });
  }
  return { get:get, put:put, del:del, svuota:svuota };
})();

/* ---------- utilità ---------- */

function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }

function b64encode(str){
  var bytes = new TextEncoder().encode(str), bin = '', CH = 0x8000;
  for(var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function b64bytes(b64){
  var bin = atob(String(b64).replace(/\s/g, '')), a = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function b64decodeText(b64){ return new TextDecoder('utf-8').decode(b64bytes(b64)); }

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function ext(p){ var m = /\.([a-z0-9]+)$/i.exec(p); return m ? m[1].toLowerCase() : ''; }
var TEXT_EXT = ['md','markdown','txt','json','csv','tsv','yml','yaml','html','htm','css','js','py','sh','tex','bib','xml','ini','toml','log','ics'];
var IMG_EXT = ['png','jpg','jpeg','gif','webp','svg','avif'];
function isText(p){ return TEXT_EXT.indexOf(ext(p)) >= 0 || p.split('/').pop().indexOf('.') < 0; }
function isImg(p){ return IMG_EXT.indexOf(ext(p)) >= 0; }
function isPagina(p){ var e = ext(p); return e === 'html' || e === 'htm'; }
function mimeDi(p){
  var e = ext(p);
  if(e === 'svg') return 'image/svg+xml';
  if(isImg(p)) return 'image/' + e.replace('jpg', 'jpeg');
  return { pdf:'application/pdf', txt:'text/plain', md:'text/markdown', csv:'text/csv', json:'application/json' }[e] || 'application/octet-stream';
}
function nomeFile(p){ return p.split('/').pop(); }
function dirname(p){ var i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }

function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'chat';
}
function rand(n){
  var s = '', a = 'abcdefghijklmnopqrstuvwxyz0123456789';
  var buf = new Uint8Array(n);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  for(var i = 0; i < n; i++) s += a[buf[i] % a.length];
  return s;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uguali(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

function toast(msg, ms, azione){
  var old = $('toast'); if(old) old.remove();
  var t = document.createElement('div'); t.id = 'toast'; t.innerHTML = msg;
  if(azione){
    var b = document.createElement('button'); b.textContent = azione.label;
    b.onclick = function(){ t.remove(); azione.fn(); };
    t.appendChild(b);
  }
  document.body.appendChild(t);
  if(ms !== 0) setTimeout(function(){ if(t.parentNode) t.remove(); }, ms || 2600);
  return t;
}

/* input: il campo da cui si copia, se c'è; se no se ne fa uno al volo (serve
   solo dove manca navigator.clipboard, cioè fuori da https o su browser vecchi) */
function copyText(txt, input){
  function fallback(){
    var tmp = null;
    try{
      if(!input){ tmp = input = document.createElement('textarea'); tmp.value = txt; tmp.style.cssText = 'position:fixed;top:-100px;opacity:0'; document.body.appendChild(tmp); }
      else input.type = 'text';
      input.focus(); input.setSelectionRange(0, txt.length);
      return document.execCommand('copy');
    }
    catch(e){ return false; }
    finally{ if(tmp) tmp.remove(); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(txt).then(function(){ return true; }, fallback);
  }
  return Promise.resolve(fallback());
}
function copia(txt, cosa){
  copyText(txt).then(function(ok){ toast(ok ? (cosa || 'Copiato') : 'Copia non riuscita'); });
}
function condividi(txt){
  if(navigator.share) navigator.share({ text: txt }).catch(function(){});
  else copia(txt, 'Copiato: incollalo dove vuoi');
}
/* un tocco leggero sotto le dita (solo dove c'è: Android) */
function vibra(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }

/* leggere ad alta voce una risposta: la voce italiana del telefono */
var voce = { bottone: null };
function parla(testo, bottone){
  var ss = window.speechSynthesis;
  if(!ss || !window.SpeechSynthesisUtterance){ toast('Questo browser non sa leggere ad alta voce'); return; }
  var stessa = voce.bottone === bottone;
  zitto();
  if(stessa) return;
  var u = new SpeechSynthesisUtterance(testo);
  u.lang = 'it-IT';
  var it = ss.getVoices().filter(function(v){ return /^it/i.test(v.lang); });
  if(it.length) u.voice = it[0];
  u.onend = u.onerror = function(){ if(voce.bottone === bottone) zitto(); };
  voce.bottone = bottone;
  if(bottone){ bottone.classList.add('on'); bottone.querySelector('use').setAttribute('href', '#i-stop'); }
  ss.speak(u);
}
function zitto(){
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  var b = voce.bottone; voce.bottone = null;
  if(b){ b.classList.remove('on'); b.querySelector('use').setAttribute('href', '#i-volume'); }
}

/* per cercare senza badare a maiuscole e accenti: un carattere per
   carattere, così le posizioni restano quelle del testo originale */
function piega(s){
  var out = '';
  for(var i = 0; i < s.length; i++){
    var c = s.charAt(i), n = c.normalize ? c.normalize('NFD').charAt(0).toLowerCase().charAt(0) : c.toLowerCase();
    out += n || c;
  }
  return out;
}
/* testo con le parole cercate evidenziate; tutto passa da escapeHtml */
function evidenzia(testo, parole){
  var p = piega(testo), segni = [];
  parole.forEach(function(w){
    if(!w) return;
    for(var i = p.indexOf(w); i >= 0; i = p.indexOf(w, i + w.length)) segni.push([i, i + w.length]);
  });
  segni.sort(function(a, b){ return a[0] - b[0]; });
  var out = '', da = 0;
  segni.forEach(function(s){
    if(s[0] < da) return;
    out += escapeHtml(testo.slice(da, s[0])) + '<mark>' + escapeHtml(testo.slice(s[0], s[1])) + '</mark>';
    da = s[1];
  });
  return out + escapeHtml(testo.slice(da));
}

/* coda: al massimo 6 richieste insieme, per non farsi bloccare da GitHub */
var coda = (function(){
  var attive = 0, attesa = [];
  function prossima(){
    if(attive >= 6 || !attesa.length) return;
    var j = attesa.shift(); attive++;
    j.fn().then(j.res, j.rej).then(function(){ attive--; prossima(); });
  }
  return function(fn){ return new Promise(function(res, rej){ attesa.push({ fn:fn, res:res, rej:rej }); prossima(); }); };
})();

/* ---------- livelli e tasto indietro ----------
   Ogni cosa che si apre sopra (chat, file, pannello) aggiunge una voce
   alla cronologia: così il tasto indietro del telefono la chiude invece
   di uscire dall'app. */

var pila = [], dopoIndietro = [];
function apriLivello(chiudi){
  pila.push(chiudi);
  history.pushState({ regia: pila.length }, '', '');
}
/* history.back() non è immediato: quello che va aperto dopo (un altro
   pannello, una chat) aspetta che il livello sia chiuso davvero, se no
   il «popstate» in ritardo chiuderebbe quello nuovo */
function chiudiLivello(poi){
  if(typeof poi !== 'function') poi = null;   // usato anche come onclick: arriva l'evento del clic
  if(poi) dopoIndietro.push(poi);
  if(pila.length) history.back();
  else { var f = dopoIndietro.splice(0); f.forEach(function(x){ x(); }); }
}
window.addEventListener('popstate', function(){
  var chiudi = pila.pop();
  if(chiudi) chiudi();
  var f = dopoIndietro.splice(0);
  f.forEach(function(x){ x(); });
});

/* I livelli a schermo intero entrano scivolando da destra ed escono al
   contrario. Lo stato (chat aperta o no) cambia subito: l'animazione è
   solo l'aspetto, e se il livello si riapre mentre esce resta aperto. */
function mostraEl(el){
  el.classList.remove('hide', 'esce');
  el.style.transform = ''; el.style.transition = ''; delete el.dataset.svelto;
  el.classList.remove('entra'); void el.offsetWidth; el.classList.add('entra');
}
function nascondiEl(el){
  el.classList.remove('entra');
  var svelto = el.dataset.svelto;   // chiuso col dito: è già uscito di lato
  if(!svelto) el.classList.add('esce');
  var fatto = false;
  function fine(e){
    if(fatto || (e && e.target !== el)) return;   // le animazioni dei figli arrivano fin qui
    fatto = true;
    el.removeEventListener('animationend', fine);
    if(svelto ? el.dataset.svelto : el.classList.contains('esce')){
      el.classList.remove('esce'); el.classList.add('hide');
      el.style.transform = ''; el.style.transition = ''; delete el.dataset.svelto;
    }
  }
  el.addEventListener('animationend', fine);
  // riserva: con la scheda in background l'animazione può non finire mai
  setTimeout(fine, 240);
}

/* dal bordo sinistro, col dito verso destra: indietro (su iPhone, nelle app
   installate, non c'è il gesto del sistema) */
function gestoIndietro(el){
  var x0 = null, y0 = 0, dx = 0, via = false;
  el.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    x0 = e.touches.length === 1 && t.clientX < 26 ? t.clientX : null; y0 = t.clientY; dx = 0; via = false;
  }, { passive: true });
  el.addEventListener('touchmove', function(e){
    if(x0 == null) return;
    var t = e.touches[0]; dx = t.clientX - x0;
    if(!via && Math.abs(t.clientY - y0) > 30 && Math.abs(t.clientY - y0) > dx){ x0 = null; el.style.transform = ''; return; }
    if(dx > 8){ via = true; el.style.transition = 'none'; el.style.transform = 'translateX(' + dx + 'px)'; }
  }, { passive: true });
  el.addEventListener('touchend', function(){
    if(x0 == null || !via){ x0 = null; return; }
    x0 = null;
    el.style.transition = 'transform .2s ease-out';
    if(dx > Math.min(110, window.innerWidth * 0.28)){
      el.style.transform = 'translateX(100%)'; el.dataset.svelto = '1';
      chiudiLivello();
    } else el.style.transform = '';
  });
}

/* ---------- pannelli a scomparsa (al posto di prompt/confirm) ---------- */

function sheet(html, opts){
  opts = opts || {};
  var wrap = document.createElement('div'); wrap.className = 'sheet' + (opts.drawer ? ' drawer' : '');
  wrap.innerHTML = '<div class="sheetbox">' + html + '</div>';
  var chiuso = false;
  function togli(){
    if(chiuso) return; chiuso = true;
    // esce con un'animazione breve; intanto perde gli id, così chi cerca
    // «#_t» o «#_si» trova solo quelli del pannello aperto dopo
    wrap.querySelectorAll('[id]').forEach(function(e){ e.removeAttribute('id'); });
    wrap.classList.add('esce');
    setTimeout(function(){ if(wrap.parentNode) wrap.remove(); }, 190);
    if(opts.onClose) opts.onClose();
  }
  wrap.addEventListener('click', function(e){ if(e.target === wrap) chiudiLivello(); });
  $('sheets').appendChild(wrap);
  apriLivello(togli);
  return { el: wrap, close: function(poi){
    if(typeof poi !== 'function') poi = null;
    if(!chiuso) chiudiLivello(poi); else if(poi) poi();
  }, q: function(s){ return wrap.querySelector(s); } };
}

function askConfirm(titolo, testo, okLabel, altro){
  return new Promise(function(resolve){
    var esito = false;
    var s = sheet('<h2>' + titolo + '</h2><p class="help">' + testo + '</p>' +
      '<div class="btnrow"><button class="btn" id="_no">Annulla</button>' +
      (altro ? '<button class="btn" id="_alt">' + altro + '</button>' : '') +
      '<button class="btn primary" id="_si">' + (okLabel || 'Conferma') + '</button></div>',
      { onClose: function(){ resolve(esito); } });
    s.q('#_no').onclick = function(){ esito = false; s.close(); };
    s.q('#_si').onclick = function(){ esito = true; s.close(); };
    if(altro) s.q('#_alt').onclick = function(){ esito = 'altro'; s.close(); };
  });
}

/* ---------- date e ore ----------
   I giorni sono stringhe AAAA-MM-GG e i conti si fanno in UTC: niente
   sorprese col cambio dell'ora. «Oggi» e «adesso» sono quelli del fuso
   dell'agenda (Europe/Rome). */

var GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
var GG = ['dom','lun','mar','mer','gio','ven','sab'];
var MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function pad(n){ return (n < 10 ? '0' : '') + n; }
function dParse(s){ return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
function dFmt(ms){ var d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function dAdd(s, n){ return dFmt(dParse(s) + n * 864e5); }
function dDiff(a, b){ return Math.round((dParse(a) - dParse(b)) / 864e5); }
function dow(s){ return new Date(dParse(s)).getUTCDay(); }
function isoDow(s){ var w = dow(s); return w === 0 ? 7 : w; }
function dataOk(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && dFmt(dParse(s)) === s; }
function fuso(){ return (agenda.dati && agenda.dati.fuso) || 'Europe/Rome'; }
function locale(d, opts){
  try{ return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: fuso() }, opts)).format(d); }
  catch(e){ return new Intl.DateTimeFormat('en-CA', opts).format(d); }
}
function giornoDi(d){ return locale(d, { year:'numeric', month:'2-digit', day:'2-digit' }); }
function oraDi(d){ return locale(d, { hour:'2-digit', minute:'2-digit', hour12:false }).replace(/^24/, '00'); }
function oggi(){ return giornoDi(new Date()); }
function adessoLocale(){ return oggi() + 'T' + oraDi(new Date()); }
function dataBreve(s){ var d = new Date(dParse(s)); return GG[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MESI[d.getUTCMonth()].slice(0, 3); }
function dataLunga(s){ var d = new Date(dParse(s)); return GIORNI[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MESI[d.getUTCMonth()]; }
function relativo(s){
  var n = dDiff(s, oggi());
  if(n === 0) return 'oggi';
  if(n === 1) return 'domani';
  if(n === -1) return 'ieri';
  if(n > 1 && n < 7) return GIORNI[dow(s)];
  return dataBreve(s);
}
function quandoMsg(d){
  var g = giornoDi(d), n = dDiff(g, oggi());
  return n === 0 ? oraDi(d) : n === -1 ? 'ieri' : n > -7 ? GG[dow(g)] : d.getDate() + '/' + (d.getMonth() + 1);
}

/* ---------- markdown minimale ----------
   Come nell'app Articoli, con due cose in più per le chat: un a capo
   singolo resta un a capo, e i link a file del repo si aprono dentro l'app.
   I link vanno a http(s), mailto, tel o a un percorso del repo: niente
   altri schemi (javascript: e simili), perché il token sta in questa pagina. */

function urlSicuro(u){
  if(/^(https?:|mailto:|tel:)/i.test(u)) return { url: u, esterno: true };
  if(/^[a-z][a-z0-9+.-]*:/i.test(u) || /^\/\//.test(u) || /^#/.test(u)) return null;
  return { url: u, esterno: false };
}

function mdInline(s){
  s = escapeHtml(s);
  var codici = [];
  s = s.replace(/`([^`]+)`/g, function(m, c){ codici.push(c); return '\u0000' + (codici.length - 1) + '\u0000'; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function(m, alt, u){
    var v = urlSicuro(u); if(!v) return alt;
    return v.esterno ? (/^https:/i.test(v.url) ? '<img alt="' + alt + '" src="' + v.url + '" referrerpolicy="no-referrer">' : alt)
                     : '<img alt="' + alt + '" data-repo="' + v.url + '">';
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, t, u){
    var v = urlSicuro(u); if(!v) return t;
    return v.esterno ? '<a href="' + v.url + '" target="_blank" rel="noopener">' + t + '</a>'
                     : '<a href="#" class="repo" data-repo="' + v.url + '">' + t + '</a>';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|\s)_([^_\n]+)_(?=\s|$|[.,;:!?])/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<>"')\]]+)/g, function(m, pre, url){
    var coda = '', t = url.match(/[.,;:!?]+$/);
    if(t){ coda = t[0]; url = url.slice(0, -coda.length); }
    return pre + '<a href="' + url + '" target="_blank" rel="noopener">' + url.replace(/^https?:\/\//, '') + '</a>' + coda;
  });
  return s.replace(/\u0000(\d+)\u0000/g, function(m, i){ return '<code>' + codici[+i] + '</code>'; });
}

function mdToHtml(src, chat){
  var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  var out = [], i = 0;

  while(i < lines.length){
    var l = lines[i];

    if(/^```/.test(l)){
      var lingua = l.replace(/^```+/, '').trim().split(/\s/)[0].slice(0, 20);
      var buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      // il bottone «Copia» lo collega collegaCodice(), dopo il disegno
      out.push('<div class="code"><div class="code-h"><span>' + escapeHtml(lingua || 'testo') + '</span>' +
        '<button type="button" class="cpy"><svg class="i"><use href="#i-copy"/></svg>Copia</button></div>' +
        '<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre></div>');
      continue;
    }
    if(/^#{1,6}\s/.test(l)){
      var n = Math.min(4, l.match(/^#+/)[0].length);
      out.push('<h' + n + '>' + mdInline(l.replace(/^#+\s*/, '')) + '</h' + n + '>'); i++; continue;
    }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^>\s?/.test(l)){
      var q = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + mdToHtml(q.join('\n'), chat) + '</blockquote>'); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
      var cells = function(r){ return r.trim().replace(/^\||\|$/g, '').split('|').map(function(c){ return mdInline(c.trim()); }); };
      var head = cells(l); i += 2;
      var rows = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<table><thead><tr>' + head.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table>');
      continue;
    }
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      var stack = [], depths = [];
      while(i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){
        var m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
        var d = Math.floor(m[1].length / 2), tag = /\d/.test(m[2]) ? 'ol' : 'ul';
        while(depths.length && depths[depths.length - 1] > d){ out.push('</' + stack.pop() + '>'); depths.pop(); }
        if(!depths.length || depths[depths.length - 1] < d){ out.push('<' + tag + '>'); stack.push(tag); depths.push(d); }
        var voce = m[3].replace(/^\[( |x)\]\s+/i, function(mm, x){ return x === ' ' ? '☐ ' : '☑ '; });
        out.push('<li>' + mdInline(voce) + '</li>');
        i++;
      }
      while(stack.length) out.push('</' + stack.pop() + '>');
      continue;
    }
    if(l.trim() === ''){ i++; continue; }

    var p = [];
    while(i < lines.length && lines[i].trim() !== '' &&
          !/^(#{1,6}\s|```|>|\s*([-*+]|\d+[.)])\s)/.test(lines[i])){ p.push(lines[i]); i++; }
    var html = mdInline(p.join('\n'));
    // in chat un a capo è un a capo; nei documenti vale la regola del markdown
    out.push('<p>' + (chat ? html.replace(/\n/g, '<br>') : html.replace(/ {2,}\n|\\\n/g, '<br>').replace(/\n/g, ' ')) + '</p>');
  }
  return out.join('\n');
}

function collegaCodice(el){
  el.querySelectorAll('.code .cpy').forEach(function(b){
    b.onclick = function(){ copia(b.parentNode.nextElementSibling.textContent, 'Codice copiato'); };
  });
}

function leggiFrontmatter(testo){
  var campi = {};
  testo = String(testo).replace(/\r\n?/g, '\n');
  if(testo.indexOf('---\n') !== 0) return { campi: campi, corpo: testo };
  var fine = testo.indexOf('\n---', 4);
  if(fine < 0) return { campi: campi, corpo: testo };
  testo.slice(4, fine).split('\n').forEach(function(r){
    var i = r.indexOf(':'); if(i < 0) return;
    var k = r.slice(0, i).trim(), v = r.slice(i + 1).trim();
    if(/^\[.*\]$/.test(v)) v = v.slice(1, -1).split(',').map(function(x){ return x.trim().replace(/^["']|["']$/g, ''); }).filter(Boolean);
    campi[k] = v;
  });
  var corpo = testo.slice(fine + 4);
  return { campi: campi, corpo: corpo.charAt(0) === '\n' ? corpo.slice(1) : corpo };
}

/* «Sì, mettilo | No, grazie» → ['Sì, mettilo', 'No, grazie']: gemello di
   leggi_proposte() in comune.py, che controlla anche quante e quanto lunghe */
function leggiProposte(v){
  if(Array.isArray(v)) v = v.join(', ');
  return String(v || '').split('|').map(function(x){ return x.replace(/\s+/g, ' ').trim(); })
    .filter(Boolean).slice(0, MAX_PROPOSTE);
}

function testoPiano(md){
  return String(md).replace(/```[\s\S]*?```/g, ' ').replace(/!\[[^\]]*\]\([^)]*\)/g, '🖼 ')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[#>*_`|~]/g, '').replace(/\s+/g, ' ').trim();
}

/* ---------- GitHub ---------- */

function api(path, opts){
  opts = opts || {};
  var url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + path;
  var h = { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  if(cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
  if(opts.body) h['Content-Type'] = 'application/json';
  return fetch(url, { method: opts.method || 'GET', headers: h, body: opts.body, cache: 'no-store' })
    .catch(function(){
      var e = new Error('Sei offline, o GitHub non risponde.'); e.offline = true; throw e;
    })
    .then(function(r){
      if(r.ok) return r.status === 204 ? null : r.json();
      return r.json().catch(function(){ return {}; }).then(function(j){
        var m = j.message || '';
        var e = new Error(
          r.status === 401 ? 'Token non valido o scaduto: rifallo e incollalo nelle Impostazioni.' :
          r.status === 403 && /rate limit/i.test(m) ? 'GitHub chiede di rallentare (troppe richieste): riprovo fra poco.' :
          r.status === 403 ? 'Accesso negato (403): al token manca un permesso. ' + m :
          r.status === 404 ? 'Non trovato (404): controlla repo e ramo nelle Impostazioni. Per un repo privato il token deve poterlo leggere.' :
          r.status === 409 || r.status === 422 ? 'Il file è cambiato su GitHub nel frattempo.' :
          'Errore ' + r.status + ': ' + m);
        e.status = r.status; e.gh = m;
        throw e;
      });
    });
}

function getContent(path){
  return api('/contents/' + encPath(path) + '?ref=' + encodeURIComponent(cfg.branch)).then(function(d){
    if(d && d.content === '' && d.size > 0 && d.sha){
      return api('/git/blobs/' + d.sha).then(function(b){ d.content = b.content; return d; });
    }
    return d;
  });
}

function putFile(path, contentB64, sha, msg){
  var body = { message: msg || ('modifica da app: ' + path), content: contentB64, branch: cfg.branch };
  if(sha) body.sha = sha;
  return api('/contents/' + encPath(path), { method:'PUT', body: JSON.stringify(body) }).then(function(r){
    if(r && r.content && r.content.sha){
      DB.put(r.content.sha, contentB64);
      if(idx) idx.files[path] = r.content.sha;
    }
    return r;
  });
}

/* Più file in un commit solo (messaggio + allegati, una chat nuova): così il
   workflow parte una volta, e trova già tutto. files: [{path, text} | {path, b64}] */
function commitFiles(files, msg, tentativo){
  tentativo = tentativo || 0;
  var base;
  return api('/git/ref/heads/' + encodeURIComponent(cfg.branch)).then(function(r){
    base = r.object.sha;
    return api('/git/commits/' + base);
  }).then(function(c){
    return Promise.all(files.map(function(f){
      if(f.text != null) return { path: f.path, mode: '100644', type: 'blob', content: f.text };
      return api('/git/blobs', { method:'POST', body: JSON.stringify({ content: f.b64, encoding: 'base64' }) })
        .then(function(b){ return { path: f.path, mode: '100644', type: 'blob', sha: b.sha }; });
    })).then(function(tree){
      return api('/git/trees', { method:'POST', body: JSON.stringify({ base_tree: c.tree.sha, tree: tree }) });
    });
  }).then(function(t){
    return api('/git/commits', { method:'POST', body: JSON.stringify({ message: msg, tree: t.sha, parents: [base] }) });
  }).then(function(nc){
    return api('/git/refs/heads/' + encodeURIComponent(cfg.branch), { method:'PATCH', body: JSON.stringify({ sha: nc.sha, force: false }) })
      .then(function(){ if(idx) idx.commit = null; return nc; });
  }).catch(function(e){
    // qualcun altro (Claude) ha scritto nel frattempo: si rifà sopra il commit nuovo
    if((e.status === 422 || e.status === 409) && tentativo < 3) return commitFiles(files, msg, tentativo + 1);
    throw e;
  });
}

function blobB64(sha){
  return DB.get(sha).then(function(v){
    if(v != null) return v;
    return coda(function(){ return api('/git/blobs/' + sha); }).then(function(b){
      var c = String(b.content || '').replace(/\s/g, '');
      DB.put(sha, c);
      return c;
    });
  });
}
var testi = {};
function blobText(sha){
  if(testi[sha] != null) return Promise.resolve(testi[sha]);
  return blobB64(sha).then(function(b){ return (testi[sha] = b64decodeText(b)); });
}
function fileText(path){
  var sha = idx && idx.files[path];
  return sha ? blobText(sha) : Promise.resolve(null);
}
function fileJSON(path, fb){
  return fileText(path).then(function(t){
    if(t == null) return fb;
    try{ return JSON.parse(t); }catch(e){ return fb; }
  });
}

/* ---------- agenda: lo stesso formato di .regia/comune.py ----------
   Un evento o un compito per riga, campi vuoti tolti, chiavi sempre nello
   stesso ordine: così i commit dell'app e quelli di Claude si uniscono bene. */

var ORD_EV = ['id','titolo','tipo','data','ora','ora_fine','data_fine','luogo','note','chat','ripeti','creato_da','creato','modificato'];
var ORD_CO = ['id','titolo','scadenza','priorita','fatto','fatto_il','chat','note','creato_da','creato','modificato'];
var TIPI = [['appuntamento','Appuntamento'],['promemoria','Promemoria'],['scadenza','Scadenza'],['blocco','Blocco']];

function vuoto(v){
  return v == null || v === '' || v === false || (Array.isArray(v) && !v.length) ||
         (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length);
}
function normalizza(voce, ordine){
  var out = {};
  ordine.concat(Object.keys(voce).filter(function(k){ return ordine.indexOf(k) < 0; })).forEach(function(k){
    if(!(k in voce) || vuoto(voce[k])) return;
    var v = voce[k];
    if(v && typeof v === 'object' && !Array.isArray(v)){
      var w = {};
      Object.keys(v).forEach(function(kk){ if(!vuoto(v[kk])) w[kk] = v[kk]; });
      v = w;
    }
    out[k] = v;
  });
  return out;
}
function cmp(a, b){ return a < b ? -1 : a > b ? 1 : 0; }
function cmpTuple(a, b){ for(var i = 0; i < a.length; i++){ var c = cmp(a[i], b[i]); if(c) return c; } return 0; }
function ordinaAgenda(d){
  d.eventi = (d.eventi || []).map(function(e){ return normalizza(e, ORD_EV); }).sort(function(a, b){
    return cmpTuple([a.data || '', a.ora || '', a.titolo || '', a.id], [b.data || '', b.ora || '', b.titolo || '', b.id]);
  });
  d.compiti = (d.compiti || []).map(function(c){ return normalizza(c, ORD_CO); }).sort(function(a, b){
    return cmpTuple([a.scadenza || '9999-99-99', a.creato || '', a.id], [b.scadenza || '9999-99-99', b.creato || '', b.id]);
  });
  return d;
}
function serializzaAgenda(d){
  ordinaAgenda(d);
  var r = ['{'];
  Object.keys(d).forEach(function(k){
    if(k !== 'eventi' && k !== 'compiti') r.push('  ' + JSON.stringify(k) + ': ' + JSON.stringify(d[k]) + ',');
  });
  ['eventi', 'compiti'].forEach(function(k, i){
    var lista = d[k], v = i === 0 ? ',' : '';
    if(!lista.length){ r.push('  "' + k + '": []' + v); return; }
    r.push('  "' + k + '": [');
    lista.forEach(function(x, j){ r.push('    ' + JSON.stringify(x) + (j < lista.length - 1 ? ',' : '')); });
    r.push('  ]' + v);
  });
  r.push('}');
  return r.join('\n') + '\n';
}
function agendaVuota(){ return { versione: 1, fuso: 'Europe/Rome', eventi: [], compiti: [] }; }

/* le volte in cui un evento cade nell'intervallo [da, a]: gemella di occorrenze() in comune.py */
function occorrenze(ev, da, a){
  if(!dataOk(ev.data)) return [];
  var inizio = ev.data, durata = dataOk(ev.data_fine) ? Math.max(0, dDiff(ev.data_fine, ev.data)) : 0, r = ev.ripeti;
  var salta = r && r.salta ? r.salta : [];
  var fino = r && dataOk(r.fino) ? r.fino : a; if(fino > a) fino = a;
  var passo = (r && r.intervallo > 0) ? r.intervallo : 1, out = [];
  function tieni(d){ if(salta.indexOf(d) < 0 && d <= a && dAdd(d, durata) >= da) out.push(d); }
  if(!r) tieni(inizio);
  else if(r.ogni === 'giorno'){
    // si salta dritti vicino a «da»: un evento di tutti i giorni da anni non costa niente
    var d = inizio;
    if(dDiff(da, d) > durata + passo){ var k0 = Math.floor((dDiff(da, d) - durata) / passo); d = dAdd(d, k0 * passo); }
    for(; d <= fino; d = dAdd(d, passo)) tieni(d);
  } else if(r.ogni === 'settimana'){
    var giorni = (r.giorni && r.giorni.length ? r.giorni : [isoDow(inizio)]).slice().sort();
    var lun = dAdd(inizio, -(isoDow(inizio) - 1)), k = 0;
    while(lun <= fino){
      if(k % passo === 0) giorni.forEach(function(g){ var dd = dAdd(lun, g - 1); if(dd >= inizio && dd <= fino) tieni(dd); });
      lun = dAdd(lun, 7); k++;
    }
  } else if(r.ogni === 'mese' || r.ogni === 'anno'){
    var mesi = passo * (r.ogni === 'anno' ? 12 : 1), y = +inizio.slice(0, 4), m = +inizio.slice(5, 7) - 1, g = +inizio.slice(8, 10);
    for(var j = 0; j < 2400; j++){
      var mm = m + j * mesi, yy = y + Math.floor(mm / 12); mm = mm % 12;
      var dt = new Date(Date.UTC(yy, mm, g));
      if(dt.getUTCMonth() !== mm) continue;     // il 31 nei mesi corti, il 29 febbraio: si salta
      var s = dFmt(dt.getTime());
      if(s > fino) break;
      tieni(s);
    }
  }
  return out;
}

/* giorno → [{ev, k (giorno n di un evento lungo), dur}] */
function eventiNelPeriodo(dati, da, a){
  var per = {};
  (dati.eventi || []).forEach(function(ev){
    var dur = dataOk(ev.data_fine) ? Math.max(0, dDiff(ev.data_fine, ev.data)) : 0;
    occorrenze(ev, da, a).forEach(function(ini){
      for(var k = 0; k <= dur; k++){
        var g = dAdd(ini, k);
        if(g >= da && g <= a) (per[g] = per[g] || []).push({ ev: ev, k: k, dur: dur, ini: ini });
      }
    });
  });
  Object.keys(per).forEach(function(g){
    per[g].sort(function(x, y){ return cmp((x.k ? '' : x.ev.ora) || '', (y.k ? '' : y.ev.ora) || ''); });
  });
  return per;
}

function descriviRipeti(r){
  if(!r) return '';
  var n = r.intervallo || 1;
  var nomi = { giorno:['ogni giorno','ogni %d giorni'], settimana:['ogni settimana','ogni %d settimane'],
               mese:['ogni mese','ogni %d mesi'], anno:['ogni anno','ogni %d anni'] }[r.ogni] || ['', ''];
  var s = n === 1 ? nomi[0] : nomi[1].replace('%d', n);
  if(r.giorni && r.giorni.length && r.ogni === 'settimana') s += ' (' + r.giorni.map(function(g){ return GG[g % 7]; }).join(', ') + ')';
  if(r.fino) s += ' fino al ' + dataBreve(r.fino);
  return s;
}

/* ============================================================
   Modello: chat, messaggi, stato di Claude
   ============================================================ */

var NOME_MSG = /^(\d{8})-(\d{6})-(andrea|claude|sistema)-([a-z0-9]{4})\.md$/;
var chats = {};                 // slug → { slug, msgs:[info], altri:[], meta, stato }
var agenda = { dati: null, sha: null };
var google = null;              // { eventi, calendari, aggiornato }: Google Calendar, sola lettura
var uso = null;                 // uso/uso.json: { limiti, turni }
var impostazioni = null;
var visti = {};                 // per chat: nomi dei messaggi già conosciuti (per accorgersi delle risposte nuove)
var primaVolta = true;

function infoMsg(nome){
  var m = NOME_MSG.exec(nome);
  if(!m) return null;
  var s = m[1] + m[2];
  var q = new Date(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(8, 10), +s.slice(10, 12), +s.slice(12, 14)));
  return { nome: nome, autore: m[3], quando: q };
}
function stampa(d){
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + '-' +
         pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds());
}
function ultimoNome(slug){
  var c = chats[slug], u = c && c.msgs.length ? c.msgs[c.msgs.length - 1].nome : '';
  outbox.forEach(function(o){ if(o.chat === slug && o.nome > u) u = o.nome; });
  return u;
}
/* sempre dopo l'ultimo messaggio della chat, anche se l'orologio del telefono è indietro */
function nomeMessaggio(slug){
  var d = new Date(); d.setMilliseconds(0);
  var u = ultimoNome(slug), iu = u && infoMsg(u);
  if(iu && d <= iu.quando) d = new Date(iu.quando.getTime() + 1000);
  return stampa(d) + '-andrea-' + rand(4) + '.md';
}

function costruisciChats(){
  var out = {};
  if(!idx) return out;
  Object.keys(idx.files).forEach(function(p){
    var m = /^chat\/([^\/]+)\/(.+)$/.exec(p); if(!m) return;
    var c = out[m[1]] || (out[m[1]] = { slug: m[1], msgs: [], altri: [], meta: null, stato: null });
    var resto = m[2];
    if(resto.indexOf('messaggi/') === 0 && resto.indexOf('/', 9) < 0){
      var info = infoMsg(resto.slice(9));
      if(info){ info.path = p; info.sha = idx.files[p]; c.msgs.push(info); }
    } else if(resto !== 'chat.json' && resto !== 'stato.json'){
      c.altri.push(resto);
    }
  });
  Object.keys(out).forEach(function(s){
    if(!idx.files['chat/' + s + '/chat.json']) delete out[s];
    else out[s].msgs.sort(function(a, b){ return cmp(a.nome, b.nome); });
  });
  return out;
}

/* legge dalla cache (o da GitHub) quello che serve per disegnare: metadati,
   stato, l'ultimo messaggio di ogni chat, l'agenda, le impostazioni */
function caricaModello(){
  var nuovo = costruisciChats();
  var lavori = Object.keys(nuovo).map(function(s){
    var c = nuovo[s];
    var ultimo = c.msgs[c.msgs.length - 1];
    return Promise.all([
      fileJSON('chat/' + s + '/chat.json', {}),
      fileJSON('chat/' + s + '/stato.json', {}),
      ultimo ? blobText(ultimo.sha).catch(function(){ return ''; }) : null
    ]).then(function(r){ c.meta = r[0] || {}; c.stato = r[1] || {}; });
  });
  lavori.push(fileJSON(AGENDA, null).then(function(d){
    agenda.dati = d && typeof d === 'object' ? d : agendaVuota();
    agenda.dati.eventi = agenda.dati.eventi || []; agenda.dati.compiti = agenda.dati.compiti || [];
    agenda.sha = idx.files[AGENDA] || null;
  }));
  lavori.push(fileJSON(IMPOSTAZIONI, {}).then(function(d){ impostazioni = d || {}; }));
  lavori.push(fileJSON(GOOGLE, null).then(function(d){
    google = d && Array.isArray(d.eventi) ? { eventi: d.eventi, calendari: Array.isArray(d.calendari) ? d.calendari.map(String) : [], aggiornato: d.aggiornato || '' } : null;
  }));
  lavori.push(fileJSON(USO, null).then(function(d){ uso = d && Array.isArray(d.turni) ? d : null; }));
  return Promise.all(lavori).then(function(){
    chats = nuovo;
    return cercaBriefing();
  });
}

/* il briefing di stamattina, se c'è: la pagina di partenza lo mette in vista.
   Si leggono solo i messaggi di Claude di oggi in Generale (di solito pochi). */
var briefing = null;
function cercaBriefing(){
  var g = chats.generale, o = oggi();
  if(!g) { briefing = null; return; }
  var oggiDiClaude = g.msgs.filter(function(m){ return m.autore === 'claude' && giornoDi(m.quando) === o; });
  return Promise.all(oggiDiClaude.map(function(m){ return blobText(m.sha).catch(function(){ return ''; }); })).then(function(t){
    briefing = null;
    t.forEach(function(x, i){
      var fm = leggiFrontmatter(x);
      if(fm.campi.tipo === 'briefing') briefing = { nome: oggiDiClaude[i].nome, testo: fm.corpo };
    });
  });
}

function titoloChat(c){ return (c.meta && c.meta.titolo) || c.slug; }

var COLORI = ['#2f7f86','#c0603a','#6a5acd','#3a78c9','#b2457a','#4f8a3a','#a0782a','#5a6fa5','#8a5a3a','#2a8f6a'];
function coloreChat(slug){
  var h = 0; for(var i = 0; i < slug.length; i++) h = (h * 31 + slug.charCodeAt(i)) >>> 0;
  return COLORI[h % COLORI.length];
}
/* l'avatar: il colore si dà come background-color, così resta la lucentezza
   disegnata in .av; Generale ha la scintilla di Claude sul suo gradiente */
function iconaChat(c){
  // un'emoji (o due caratteri al massimo): un'icona, non un titolo
  var i = String((c.meta && c.meta.icona) || '').trim();
  return Array.from ? Array.from(i).slice(0, 4).join('') : i.slice(0, 4);
}
function avatarHtml(c){
  if(c.slug === 'generale') return '<svg class="i"><use href="#i-spark"/></svg>';
  var ic = iconaChat(c);
  if(ic) return '<span class="emo">' + escapeHtml(ic) + '</span>';
  var t = titoloChat(c).trim();
  return escapeHtml((t.charAt(0) || '?').toUpperCase());
}
function avatar(c, cls){
  return '<span class="av' + (c.slug === 'generale' ? ' gen' : '') + (cls ? ' ' + cls : '') + '"' +
    (c.slug === 'generale' ? '' : ' style="background-color:' + coloreChat(c.slug) + '"') + '>' + avatarHtml(c) + '</span>';
}
function mettiAvatar(el, c){
  el.className = 'av' + (c.slug === 'generale' ? ' gen' : '');
  el.style.backgroundColor = c.slug === 'generale' ? '' : coloreChat(c.slug);
  el.innerHTML = avatarHtml(c);
}

function runAttivo(){
  if(!runs || !runs.ok) return null;
  var r = runs.lista.filter(function(x){ return x.status !== 'completed'; });
  return r.length ? r[0] : null;
}
function runFallitoDopo(quando){
  if(!runs || !runs.ok) return null;
  var r = runs.lista.filter(function(x){ return x.status === 'completed'; })[0];
  if(r && r.conclusion !== 'success' && r.conclusion !== 'skipped' && new Date(r.created_at) >= new Date(quando.getTime() - 60000)) return r;
  return null;
}

/* a che punto è Claude con questa chat */
function statoChat(c){
  var fino = (c.stato && c.stato.risposto_fino_a) || '';
  var attesa = c.msgs.filter(function(m){ return m.autore === 'andrea' && m.nome > fino; });
  var uscita = outbox.filter(function(o){ return o.chat === c.slug; });
  var r = { tipo: 'ok', attesa: attesa, uscita: uscita, run: null };
  if(uscita.some(function(o){ return o.errore; })) r.tipo = 'nonInviato';
  else if(uscita.length) r.tipo = 'invio';
  else if(attesa.length){
    var ultimo = c.msgs[c.msgs.length - 1];
    var run = runAttivo();
    if(ultimo.autore === 'sistema' && ultimo.nome > attesa[attesa.length - 1].nome) r.tipo = 'errore';
    else if(run){ r.tipo = run.status === 'in_progress' ? 'lavoro' : 'coda'; r.run = run; }
    else if((r.run = runFallitoDopo(attesa[attesa.length - 1].quando))) r.tipo = 'runFallito';
    else r.tipo = 'attesa';
  }
  return r;
}
var ETICHETTE = {
  invio: 'invio…', nonInviato: 'non inviato', lavoro: 'Claude sta lavorando', coda: 'in coda',
  attesa: 'in attesa di Claude', errore: 'Claude non ha risposto', runFallito: 'turno interrotto'
};
function staLavorando(t){ return t === 'lavoro' || t === 'coda' || t === 'attesa' || t === 'invio'; }

/* ---------- routine (chat.json → "routine") ---------- */

function routineDi(c){ return (c.meta && Array.isArray(c.meta.routine) ? c.meta.routine : []).filter(function(r){ return r && r.id && r.quando; }); }
/* l'ora locale del giro di una fascia, quel giorno (il cron è in UTC) */
function oraFascia(quando, giorno){
  var f = FASCE.filter(function(x){ return x[0] === quando; })[0] || FASCE[0];
  var g = giorno || oggi();
  return oraDi(new Date(Date.UTC(+g.slice(0, 4), +g.slice(5, 7) - 1, +g.slice(8, 10), f[2], 0)));
}
var SIGLE = ['lun','mar','mer','gio','ven','sab','dom'];
function descriviGiorni(g){
  if(!g || !g.length || g.length === 7) return 'ogni giorno';
  if(g.join() === '1,2,3,4,5') return 'nei giorni feriali';
  if(g.join() === '6,7') return 'nel fine settimana';
  return g.map(function(x){ return SIGLE[x - 1]; }).join(', ');
}
/* la prossima volta che gira una routine (o null se è spenta) */
function prossimaVolta(c, r){
  if(r.attiva === false) return null;
  var fatte = (c.stato && c.stato.routine) || {}, o = oggi(), adesso = oraDi(new Date());
  for(var k = 0; k < 8; k++){
    var g = dAdd(o, k);
    if(r.giorni && r.giorni.length && r.giorni.indexOf(isoDow(g)) < 0) continue;
    var ora = oraFascia(r.quando, g);
    if(k === 0 && (fatte[r.id] === o || ora < adesso)) continue;
    return { giorno: g, ora: ora };
  }
  return null;
}
function quandoVolta(v){
  var n = dDiff(v.giorno, oggi());
  return (n === 0 ? 'oggi' : n === 1 ? 'domani' : GG[dow(v.giorno)]) + ' alle ' + v.ora.replace(/^0/, '');
}

/* Le fasi di un turno, dai passi del workflow (.github/workflows/claude.yml
   in regia-dati): se lì cambiano i nomi dei passi, vanno cambiati anche qui.
   0 in coda · 1 preparo · 2 Claude al lavoro · 3 salvo la risposta */
var FASI = ['In coda', 'Preparo', 'Al lavoro', 'Salvo'];
function faseDelPasso(nome){
  if(/Turno di Claude/i.test(nome)) return 2;
  if(/Chiudi il turno|Avvisa|Salva su GitHub|^Post |Complete job/i.test(nome)) return 3;
  return 1;
}
function faseRun(run){
  if(!run) return 0;
  if(run.status !== 'in_progress') return 0;
  var p = runs && runs.passi && runs.passi.run === run.id ? runs.passi : null;
  return p ? p.fase : 1;
}
function nonLetti(c){
  var l = letti[c.slug] || '';
  return c.msgs.filter(function(m){ return m.autore !== 'andrea' && m.nome > l; }).length;
}
function inAttesaGenerale(){
  return Object.keys(chats).some(function(s){ var t = statoChat(chats[s]).tipo; return t !== 'ok'; }) || agq.length || outbox.length;
}

/* ============================================================
   Sincronizzazione
   ============================================================ */

var sincro = null, timer = null, ancora = false;

/* lo stesso avviso (offline, token scaduto) in cima a ogni schermata */
function setGBanner(html, kind){
  document.querySelectorAll('.gbanner,.cbanner,.abanner').forEach(function(el){
    el.innerHTML = html ? '<div class="banner ' + (kind || 'warn') + '">' + html + '</div>' : '';
    el.querySelectorAll('._gb').forEach(function(b){ b.onclick = apriImpostazioni; });
  });
}

function sync(forza){
  if(!cfg.token) return Promise.resolve();
  // chiesta mentre ne gira già una (un messaggio appena scritto): si rifà subito dopo
  if(sincro){ ancora = true; return sincro; }
  $('btnRefresh').classList.add('spin');
  sincro = inviaOutbox()
    .then(salvaAgendaCoda)
    .then(function(){ return api('/git/ref/heads/' + encodeURIComponent(cfg.branch)); })
    .then(function(ref){
      var sha = ref.object.sha;
      if(!forza && idx && idx.commit === sha) return;
      return api('/git/trees/' + sha + '?recursive=1').catch(function(e){
        if(e.status === 404 || e.status === 422) return api('/git/trees/' + encodeURIComponent(cfg.branch) + '?recursive=1');
        throw e;
      }).then(function(t){
        var files = {};
        (t.tree || []).forEach(function(i){ if(i.type === 'blob') files[i.path] = i.sha; });
        idx = { commit: sha, files: files, at: Date.now() };
        lsSet(K.idx, idx);
      });
    })
    .then(caricaModello)
    .then(aggiornaRuns)
    .then(function(){
      setGBanner('');
      notaRisposteNuove();
      disegna();
    })
    .catch(function(err){
      if(err.offline) setGBanner('Offline: vedi l\'ultima copia. Quello che scrivi parte appena torna la rete.', 'warn');
      else if(err.status === 401) setGBanner(escapeHtml(err.message) + ' <button class="_gb">Impostazioni</button>', 'err');
      else setGBanner(escapeHtml(err.message), 'err');
      disegna();
    })
    .then(function(){
      sincro = null;
      $('btnRefresh').classList.remove('spin');
      if(ancora){ ancora = false; sync(); } else programma();
    });
  return sincro;
}

/* quando Claude è al lavoro si guarda spesso; se no, ogni tanto. In
   background mai: si riprende appena l'app torna davanti. */
function programma(){
  clearTimeout(timer);
  if(document.hidden || !cfg.token) return;
  var svelto = inAttesaGenerale() || runAttivo();
  timer = setTimeout(function(){ sync(); }, svelto ? 7000 : aperta ? 20000 : 45000);
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ clearTimeout(timer); return; }
  sync();
});
window.addEventListener('online', function(){ sync(); });

function aggiornaRuns(){
  var serve = inAttesaGenerale() || runAttivo() || !runs || (Date.now() - (runs.at || 0)) > 120000;
  if(!serve) return Promise.resolve();
  return api('/actions/workflows/' + WORKFLOW + '/runs?per_page=6').then(function(d){
    var passi = runs && runs.passi;
    runs = { at: Date.now(), ok: true, passi: passi, lista: (d.workflow_runs || []).map(function(r){
      return { id: r.id, status: r.status, conclusion: r.conclusion, url: r.html_url, created_at: r.created_at,
               run_started_at: r.run_started_at, event: r.event };
    }) };
    lsSet(K.runs, runs);
    return aggiornaPassi();
  }).catch(function(e){
    if(e.offline) throw e;
    runs = { at: Date.now(), ok: false, motivo: e.status === 404 ? 'manca' : 'permesso', lista: [] };
    lsSet(K.runs, runs);
  });
}

/* a che passo è il turno in corso: serve solo a mostrare le fasi mentre si
   aspetta («preparo», «al lavoro», «salvo»). Se non si riesce, pazienza. */
function aggiornaPassi(){
  var run = runAttivo();
  if(!run || run.status !== 'in_progress'){ runs.passi = null; return; }
  return api('/actions/runs/' + run.id + '/jobs').then(function(d){
    var passi = ((d.jobs || [])[0] || {}).steps || [];
    var ora = passi.filter(function(p){ return p.status === 'in_progress'; })[0] ||
              passi.filter(function(p){ return p.status === 'completed'; }).pop();
    runs.passi = { run: run.id, fase: ora ? faseDelPasso(ora.name) : 1 };
    lsSet(K.runs, runs);
  }).catch(function(e){ if(e.offline) throw e; });
}

function notaRisposteNuove(){

/* ============================================================
   L'uso di Claude: uso/uso.json, che il workflow aggiorna a ogni
   turno. L'anello in alto a destra c'è su tutte le schermate.
   ============================================================ */

var NOMI_LIMITI = { five_hour: 'Sessione di 5 ore', seven_day: 'Settimana', seven_day_opus: 'Settimana · Opus',
                    seven_day_sonnet: 'Settimana · Sonnet', attuale: 'Limite del piano' };

/* una data scritta dal workflow: se non si legge, meglio niente che un errore */
function dataDa(s){ var d = s ? new Date(s) : null; return d && !isNaN(d.getTime()) ? d : null; }
function numero(x){ x = +x; return isFinite(x) && x > 0 ? x : 0; }

/* i limiti del piano ancora validi (uno già azzerato non dice più niente) */
function limitiValidi(){
  var l = (uso && uso.limiti) || {}, adesso = Date.now(), out = [], ordine = ['five_hour', 'seven_day'];
  Object.keys(l).forEach(function(k){
    var x = l[k];
    if(!x || typeof x !== 'object') return;
    var az = dataDa(x.azzera);
    if(az && az.getTime() < adesso) return;
    out.push({ chiave: k, nome: NOMI_LIMITI[k] || k, pct: typeof x.percento === 'number' && isFinite(x.percento) ? x.percento : null,
               stato: String(x.stato || ''), azzera: az ? String(x.azzera) : '', visto: String(x.visto || '') });
  });
  out.sort(function(a, b){ return ((ordine.indexOf(a.chiave) + 1) || 9) - ((ordine.indexOf(b.chiave) + 1) || 9); });
  return out;
}
/* quanto è grave: sotto il 70% niente, poi attenzione, dal 90% (o a limite raggiunto) critico */
function gravita(l){
  if(l.stato === 'rejected' || (l.pct != null && l.pct >= 90)) return 'critico';
  if(l.stato === 'allowed_warning' || (l.pct != null && l.pct >= 70)) return 'attenzione';
  return '';
}
function peggiore(lim){
  var g = '';
  lim.forEach(function(l){ var x = gravita(l); if(x === 'critico' || (x && !g)) g = x; });
  return g;
}
function quandoAzzera(iso){
  var d = dataDa(iso);
  if(!d) return '';
  var g = giornoDi(d), n = dDiff(g, oggi());
  return (n === 0 ? 'alle ' : n === 1 ? 'domani alle ' : GG[dow(g)] + ' ' + (+g.slice(8)) + ' alle ') + oraDi(d);
}

function disegnaUso(){
  var b = $('uso'), arco = b.querySelector('.arco'), num = $('usoNum'), L = 97.4;
  b.classList.toggle('hide', !cfg.token || !idx);
  var lim = limitiValidi(), princ = lim.filter(function(l){ return l.pct != null; })[0] || null, g = peggiore(lim);
  var ga = princ ? gravita(princ) : g;
  b.classList.toggle('attenzione', ga === 'attenzione');
  b.classList.toggle('critico', ga === 'critico');
  b.classList.toggle('avviso', !!g);
  b.classList.toggle('avviso-critico', g === 'critico');
  if(princ){
    arco.setAttribute('stroke-dashoffset', String(L * (1 - Math.min(100, Math.max(0, princ.pct)) / 100)));
    num.textContent = String(Math.round(princ.pct));
    b.setAttribute('aria-label', 'Uso di Claude: ' + princ.nome + ' al ' + Math.round(princ.pct) + '%');
  } else {
    arco.setAttribute('stroke-dashoffset', g === 'critico' ? '0' : String(L));
    num.innerHTML = '<svg class="i"><use href="#i-gauge"/></svg>';
    b.setAttribute('aria-label', 'Uso di Claude');
  }
}

/* 1284 → «1,3k» · 2 400 000 → «2,4M» */
function compatto(n){
  n = Math.round(n || 0);
  if(n < 1000) return String(n);
  var v = n < 1e6 ? n / 1e3 : n / 1e6, s = v < 10 ? v.toFixed(1) : String(Math.round(v));
  return s.replace('.', ',').replace(/,0$/, '') + (n < 1e6 ? 'k' : 'M');
}
function euroDollari(v){ return (v < 10 ? v.toFixed(2) : String(Math.round(v))).replace('.', ',') + ' $'; }
function tokenTurno(t){ var k = t.token || {}; return numero(k.input) + numero(k.output) + numero(k.cache_letti) + numero(k.cache_scritti); }
/* i turni validi, ognuno col suo giorno (locale) già calcolato */
function turniUso(){
  return ((uso && uso.turni) || []).map(function(t){ var d = t && dataDa(t.quando); return d ? { t: t, g: giornoDi(d) } : null; }).filter(Boolean);
}
function turniDal(giorno){ return turniUso().filter(function(x){ return x.g >= giorno; }).map(function(x){ return x.t; }); }
function somma(turni){
  var s = { turni: turni.length, token: 0, secondi: 0, costo: 0 };
  turni.forEach(function(t){ s.token += tokenTurno(t); s.secondi += numero(t.secondi); s.costo += numero(t.costo_usd); });
  return s;
}

function apriUso(){
  var lim = limitiValidi();
  var misure = lim.length ? lim.map(function(l){
    var g = gravita(l), pct = l.pct != null ? Math.round(l.pct) : null;
    var stato = l.stato === 'rejected' ? 'Limite raggiunto: Claude riprende quando si azzera' :
      g === 'critico' ? 'Quasi al limite' : g === 'attenzione' ? 'Più di due terzi usati' : 'Tutto tranquillo';
    return '<div class="misura ' + g + '"><div class="riga"><b>' + escapeHtml(l.nome) + '</b>' +
      (pct != null ? '<span class="pct">' + pct + '%</span>' : '') + '</div>' +
      '<div class="barra" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + (pct || 0) + '" aria-label="' + escapeHtml(l.nome) + '"><i style="width:' + (pct != null ? Math.min(100, pct) : g === 'critico' ? 100 : 0) + '%"></i></div>' +
      '<small>' + (g ? '<svg class="i"><use href="#i-alert"/></svg>' : '') + escapeHtml(stato) +
      (l.azzera ? ' · si azzera ' + escapeHtml(quandoAzzera(l.azzera)) : '') + '</small></div>';
  }).join('') : '<p class="help">I limiti del tuo piano (la sessione di 5 ore e la settimana) compaiono qui dopo il prossimo turno di Claude, ' +
    'quando Claude Code li comunica. I numeri esatti sono sempre su claude.ai.</p>';
  var agg = uso && dataDa(uso.aggiornato) ? 'Aggiornato ' + quandoMsg(dataDa(uso.aggiornato)) + ' (dopo ogni turno di Claude).' : 'Ancora nessun turno registrato.';
  var s = sheet('<h2>Uso di Claude</h2><p class="help">' + escapeHtml(agg) + '</p>' +
    '<div class="misure">' + misure + '</div>' +
    '<div class="sec-h" style="margin-left:0">Quanto ha lavorato Claude</div>' +
    '<div class="segf" id="_per"><button data-g="0">Oggi</button><button data-g="6">7 giorni</button><button data-g="29">30 giorni</button></div>' +
    '<div class="tiles" id="_tiles" style="margin-top:10px"></div>' +
    '<div class="grafico" id="_graf"></div>' +
    '<div class="sec-h" style="margin-left:0">Per modello · 30 giorni</div><div id="_mod"></div>' +
    '<div class="sec-h" style="margin-left:0">Per area · 30 giorni</div><div id="_aree"></div>' +
    '<p class="help" style="margin-top:14px">Il «valore API» è quanto costerebbero questi turni pagando a consumo: con l\'abbonamento non si paga a parte, ma dice quanto pesa ogni richiesta.</p>' +
    '<div class="links"><a href="https://claude.ai/settings/usage" target="_blank" rel="noopener"><svg class="i"><use href="#i-ext"/></svg>Dettagli su claude.ai</a>' +
    '<button id="_mp"><svg class="i"><use href="#i-chip"/></svg>Modello predefinito</button></div>');
  var periodo = 0;
  function tiles(){
    s.el.querySelectorAll('#_per button').forEach(function(b){ b.classList.toggle('on', +b.getAttribute('data-g') === periodo); });
    var x = somma(turniDal(dAdd(oggi(), -periodo)));
    s.q('#_tiles').innerHTML = [
      ['Turni di Claude', String(x.turni), ''],
      ['Tempo di lavoro', x.secondi < 60 ? Math.round(x.secondi) + ' s' : Math.round(x.secondi / 60) + ' min', ''],
      ['Token', compatto(x.token), 'compresa la cache'],
      ['Valore API', euroDollari(x.costo), 'stimato da Claude Code']
    ].map(function(t){ return '<div class="tile"><div class="tl">' + t[0] + '</div><div class="tv">' + escapeHtml(t[1]) + '</div>' + (t[2] ? '<div class="ts">' + t[2] + '</div>' : '') + '</div>'; }).join('');
  }
  s.el.querySelectorAll('#_per button').forEach(function(b){ b.onclick = function(){ periodo = +b.getAttribute('data-g'); tiles(); }; });
  tiles();
  graficoGiorni(s.q('#_graf'));
  perModello(s.q('#_mod'));
  perArea(s.q('#_aree'), s);
  s.q('#_mp').onclick = function(){ s.close(sceltaModelloPredefinito); };
}

/* 14 giorni di token, una colonna al giorno: oggi nell'accento, gli altri giorni
   in tono minore; un tocco su una colonna dice i numeri di quel giorno */
function graficoGiorni(host){
  var o = oggi(), giorni = [];
  for(var k = 13; k >= 0; k--) giorni.push({ g: dAdd(o, -k), token: 0, turni: 0, costo: 0 });
  turniUso().forEach(function(x){
    var i = 13 - dDiff(o, x.g);
    if(i >= 0 && i < 14){ giorni[i].token += tokenTurno(x.t); giorni[i].turni++; giorni[i].costo += numero(x.t.costo_usd); }
  });
  var max = Math.max.apply(null, giorni.map(function(x){ return x.token; })) || 1;
  var W = 336, base = 92, alto = 70, slot = W / 14, lw = Math.min(16, slot - 6), iMax = 0;
  giorni.forEach(function(x, i){ if(x.token > giorni[iMax].token) iMax = i; });
  var svg = '<svg viewBox="0 0 ' + W + ' 116" role="img" aria-label="Token per giorno, ultime due settimane">' +
    '<line class="base" x1="0" x2="' + W + '" y1="' + (base + .5) + '" y2="' + (base + .5) + '"/>';
  giorni.forEach(function(x, i){
    var h = x.token ? Math.max(3, Math.round(alto * x.token / max)) : 0, xx = Math.round(i * slot + (slot - lw) / 2), y = base - h, r = Math.min(4, h);
    if(h) svg += '<path class="col' + (i === 13 ? ' oggi' : '') + '" data-i="' + i + '" d="M' + xx + ' ' + base + 'V' + (y + r) +
      'Q' + xx + ' ' + y + ' ' + (xx + r) + ' ' + y + 'H' + (xx + lw - r) + 'Q' + (xx + lw) + ' ' + y + ' ' + (xx + lw) + ' ' + (y + r) + 'V' + base + 'Z"/>';
    if(x.token && (i === 13 || i === iMax)) svg += '<text class="val" x="' + (xx + lw / 2) + '" y="' + (y - 5) + '" text-anchor="middle">' + compatto(x.token) + '</text>';
    svg += '<text x="' + (xx + lw / 2) + '" y="' + (base + 16) + '" text-anchor="middle"' + (i === 13 ? ' class="val"' : '') + '>' +
      ['D','L','M','M','G','V','S'][dow(x.g)] + '</text>';
    svg += '<rect class="hit" data-i="' + i + '" x="' + (i * slot) + '" y="0" width="' + slot + '" height="116"/>';
  });
  svg += '</svg>';
  var tot = giorni.reduce(function(a, x){ return a + x.token; }, 0);
  host.innerHTML = '<div class="gt">Token al giorno<small>' + (tot ? compatto(tot) + ' in 14 giorni' : 'ancora niente') + '</small></div>' + svg +
    '<div class="suggerimento" id="_sug">Tocca una colonna per i numeri di quel giorno</div>';
  host.querySelectorAll('.hit').forEach(function(r){
    function mostra(){
      var x = giorni[+r.getAttribute('data-i')];
      host.querySelectorAll('.col').forEach(function(c){ c.classList.toggle('su', c.getAttribute('data-i') !== r.getAttribute('data-i')); });
      host.querySelector('#_sug').textContent = dataBreve(x.g) + ' · ' + (x.turni ? compatto(x.token) + ' token · ' + x.turni + (x.turni === 1 ? ' turno' : ' turni') + ' · ' + euroDollari(x.costo) : 'nessun turno');
    }
    r.addEventListener('click', mostra);
    r.addEventListener('mouseenter', mostra);
  });
}

/* il peso di ogni modello (valore API, 30 giorni): il colore segue il modello */
function perModello(host){
  var per = {}, tot = 0;
  turniDal(dAdd(oggi(), -29)).forEach(function(t){
    var parti = t.modelli && Object.keys(t.modelli).length ? t.modelli : null;
    if(parti) Object.keys(parti).forEach(function(m){ per[m] = (per[m] || 0) + numero(parti[m] && parti[m].costo_usd); });
    else per[t.modello || ''] = (per[t.modello || ''] || 0) + numero(t.costo_usd);
  });
  Object.keys(per).forEach(function(m){ tot += per[m]; });
  if(!tot){ host.innerHTML = '<p class="help">Ancora niente da mostrare.</p>'; return; }
  var righe = Object.keys(per).sort(function(a, b){ return per[b] - per[a]; });
  function colore(id){ var m = modelloDi(id); return m && m.serie ? 'var(--m' + m.serie + ')' : 'var(--faint)'; }
  host.innerHTML = '<div class="stack" aria-hidden="true">' + righe.map(function(m){
      return '<i style="flex:' + per[m] + ';background:' + colore(m) + '"></i>'; }).join('') + '</div>' +
    '<div class="modelli-uso">' + righe.map(function(m){
      var pct = Math.round(100 * per[m] / tot);
      return '<div class="mu"><span class="sw" style="background:' + colore(m) + '"></span><span class="n">' + escapeHtml(nomeModello(m)) + '</span>' +
        '<span class="b"><i style="width:' + pct + '%;background:' + colore(m) + '"></i></span><span class="p">' + pct + '%</span></div>';
    }).join('') + '</div>';
}

function perArea(host, s){
  var per = {};
  turniDal(dAdd(oggi(), -29)).forEach(function(t){ (Array.isArray(t.chat) ? t.chat : []).forEach(function(c){ per[c] = (per[c] || 0) + 1; }); });
  var righe = Object.keys(per).filter(function(sl){ return chats[sl]; }).sort(function(a, b){ return per[b] - per[a]; }).slice(0, 6);
  if(!righe.length){ host.innerHTML = '<p class="help">Ancora niente da mostrare.</p>'; return; }
  host.innerHTML = '<div class="scelte"></div>';
  righe.forEach(function(sl){
    var b = document.createElement('button'); b.className = 'drchat';
    b.innerHTML = avatar(chats[sl]) + '<span class="n"></span><small style="color:var(--muted)">' + per[sl] + (per[sl] === 1 ? ' turno' : ' turni') + '</small>';
    b.querySelector('.n').textContent = titoloChat(chats[sl]);
    b.onclick = function(){ s.close(function(){ apriChat(sl); }); };
    host.firstChild.appendChild(b);
  });
}

/* ============================================================
   Messaggi in uscita: prima in coda sul telefono, poi su GitHub
   ============================================================ */

function salvaOutbox(){ lsSet(K.outbox, outbox.map(function(o){ var c = Object.assign({}, o); delete c.inVolo; return c; })); }

function accoda(slug, testo, allegati, modo, modello){
  var nome = nomeMessaggio(slug);
  var item = { nome: nome, chat: slug, testo: testo, allegati: [], errore: '' };
  if(modoDi(modo)) item.modo = modo;
  if(modello && modelloDi(modello)) item.modello = modello;
  var lavori = (allegati || []).map(function(a, i){
    var rel = 'allegati/' + nome.slice(0, 15) + '-' + a.nome;
    item.allegati.push({ rel: rel, nome: a.nome, tipo: a.tipo });
    return DB.put('out:' + nome + ':' + i, a.b64);
  });
  return Promise.all(lavori).then(function(){
    outbox.push(item); salvaOutbox();
    return item;
  });
}

/* il file del messaggio: frontmatter (allegati, modo, modello) solo se serve, poi il testo */
function testoMessaggio(o){
  var campi = [];
  if(o.allegati.length) campi.push('allegati: [' + o.allegati.map(function(a){ return a.rel; }).join(', ') + ']');
  if(o.modo) campi.push('modo: ' + o.modo);
  if(o.modello) campi.push('modello: ' + o.modello);
  var t = o.testo.trim() + '\n';
  return campi.length ? '---\n' + campi.join('\n') + '\n---\n' + t : t;
}

var inviando = null;
function inviaOutbox(){
  if(inviando) return inviando;
  if(!outbox.length) return Promise.resolve();
  inviando = outbox.slice().reduce(function(catena, o){
    return catena.then(function(){
      if(outbox.indexOf(o) < 0) return;
      var path = 'chat/' + o.chat + '/messaggi/' + o.nome, testo = testoMessaggio(o);
      var msg = 'messaggio da app: chat/' + o.chat;
      var passo;
      if(!o.allegati.length){
        passo = putFile(path, b64encode(testo), null, msg).then(function(r){ testi[r.content.sha] = testo; });
      } else {
        passo = Promise.all(o.allegati.map(function(a, i){ return DB.get('out:' + o.nome + ':' + i); })).then(function(b64s){
          var files = o.allegati.map(function(a, i){ return { path: 'chat/' + o.chat + '/' + a.rel, b64: b64s[i] || '' }; });
          files.push({ path: path, text: testo });
          return commitFiles(files, msg);
        }).then(function(){ o.allegati.forEach(function(a, i){ DB.del('out:' + o.nome + ':' + i); }); });
      }
      return passo.then(function(){
        outbox = outbox.filter(function(x){ return x !== o; }); salvaOutbox();
      }).catch(function(e){
        // 422 su un file nuovo: c'è già, quindi era partito davvero (era andata persa solo la risposta)
        if(e.status === 422 && !o.allegati.length){ outbox = outbox.filter(function(x){ return x !== o; }); salvaOutbox(); return; }
        o.errore = e.message; salvaOutbox();
        if(e.offline || e.status === 401) throw e;
      });
    });
  }, Promise.resolve()).then(function(){ inviando = null; }, function(e){ inviando = null; throw e; });
  return inviando;
}

function riprovaRisposta(){
  var t = toast('<span class="spin"></span> chiedo a Claude di riprovare…', 0);
  return api('/actions/workflows/' + WORKFLOW + '/dispatches', { method:'POST',
      body: JSON.stringify({ ref: cfg.branch, inputs: { modo: 'risposte' } }) })
    .then(function(){
      t.remove(); toast('Fatto: Claude riparte tra qualche secondo.');
      if(runs) runs.at = 0;

    })

function disegnaOggi(){
  var host = $('hOggi');

  if(!idx || !agenda.dati) return;
  var d = agendaConGoogle(), o = oggi(), adesso = oraDi(new Date()), giorno = o, nome = 'Oggi';
  var voci = eventiNelPeriodo(d, o, o)[o] || [];
  function finito(x){ return !x.dur && x.ev.ora && (x.ev.ora_fine || x.ev.ora) < adesso; }
  // la sera, se oggi non resta più niente, si guarda già a domani
  if(adesso >= '18:00' && !voci.some(function(x){ return !finito(x); })){
    giorno = dAdd(o, 1); nome = 'Domani';
    voci = eventiNelPeriodo(d, giorno, giorno)[giorno] || [];
  }
  var urgenti = d.compiti.filter(function(c){ return !c.fatto && c.scadenza && c.scadenza <= o; });

  h.querySelector('b').textContent = nome;
  h.querySelector('small').textContent = dataBreve(giorno).replace(/^\w+ /, '');
  h.onclick = function(){ apriAgenda('prossimi'); };
  card.appendChild(h);
  function riga(ora, colore, testo, fn, cls){
    var r = document.createElement('button'); r.className = 'origa' + (cls ? ' ' + cls : '');
    r.innerHTML = '<span class="o"></span><span class="b"></span><span class="t"></span>';
    r.querySelector('.o').textContent = ora;
    r.querySelector('.b').style.setProperty('--tcol', colore);
    r.querySelector('.t').textContent = testo;
    r.onclick = fn;
    card.appendChild(r);
  }
  if(briefing && giorno === o){
    riga('☀', 'var(--accent)', 'Il piano di oggi: ' + testoPiano(briefing.testo).slice(0, 90), function(){ apriChat('generale', { vai: briefing.nome }); });
  }
  voci.slice(0, 4).forEach(function(x){
    var v = x.ev, ora = x.dur ? 'g. ' + (x.k + 1) : v.ora || '—';
    riga(ora, tipoColore(v), v.titolo, function(){ formEvento(v, x.ini); }, giorno === o && finito(x) ? 'passato' : '');
  });
  if(voci.length > 4) riga('', 'transparent', 'e altri ' + (voci.length - 4) + '…', function(){ apriAgenda('prossimi'); });
  if(!voci.length) riga('', 'transparent', nome === 'Oggi' ? 'Niente in agenda: giornata libera' : 'Domani niente in agenda', function(){ apriAgenda('prossimi'); }, 'passato');
  if(urgenti.length){
    var ritardo = urgenti.some(function(c){ return c.scadenza < o; });

  }
  host.appendChild(card);
}

/* Cerca prima nei titoli delle chat, poi in tutti i messaggi. I messaggi si
   leggono dalla cache (i blob non cambiano mai): la prima volta si scaricano. */
function cercaNelMenu(s, testo){
  var ris = s.q('#_ris'), nav = s.q('#_nav');
  if(!ris) return;   // il menu si è chiuso intanto
  var parole = piega(testo.trim()).split(/\s+/).filter(Boolean);
  var giro = ++giroRicerca;
  if(!parole.length || testo.trim().length < 2){ ris.classList.add('hide'); nav.classList.remove('hide'); return; }
  ris.classList.remove('hide'); nav.classList.add('hide');
  ris.innerHTML = '';
  function trova(t){ var p = piega(t); return parole.every(function(w){ return p.indexOf(w) >= 0; }); }
  var lista = chatOrdinate().filter(function(c){ return trova(titoloChat(c) + ' ' + (c.meta.descrizione || '')); });
  if(lista.length){
    var h = document.createElement('div'); h.className = 'dr-sec'; h.textContent = 'Aree';
    ris.appendChild(h);
    lista.forEach(function(c){
      var b = document.createElement('button'); b.className = 'drchat';
      b.innerHTML = avatar(c) + '<span class="n">' + evidenzia(titoloChat(c), parole) + '</span>';
      b.onclick = function(){ s.close(function(){ apriChat(c.slug); }); };
      ris.appendChild(b);
    });
  }
  var hm = document.createElement('div'); hm.className = 'dr-sec'; hm.textContent = 'Messaggi';
  var nota = document.createElement('div'); nota.className = 'nota';
  var tutti = [];
  Object.keys(chats).forEach(function(sl){ chats[sl].msgs.forEach(function(m){ tutti.push({ c: chats[sl], m: m }); }); });
  nota.innerHTML = '<span class="spin"></span> cerco tra ' + tutti.length + ' messaggi…';
  ris.appendChild(hm); ris.appendChild(nota);
  Promise.all(tutti.map(function(x){
    return blobText(x.m.sha).then(function(t){ x.t = testoPiano(leggiFrontmatter(t).corpo); return x; }, function(){ return null; });
  })).then(function(trovati){
    if(giro !== giroRicerca || !nota.parentNode) return;
    trovati = trovati.filter(function(x){ return x && trova(x.t); })
      .sort(function(a, b){ return cmp(b.m.nome, a.m.nome); });
    nota.remove();
    if(!trovati.length){ var n = document.createElement('div'); n.className = 'nota'; n.textContent = 'Nessun messaggio con queste parole.'; ris.appendChild(n); return; }
    trovati.slice(0, 40).forEach(function(x){
      var i = Math.max(0, piega(x.t).indexOf(parole[0]) - 50);
      var pezzo = (i > 0 ? '…' : '') + x.t.slice(i, i + 170) + (x.t.length > i + 170 ? '…' : '');
      var b = document.createElement('button'); b.className = 'ris';
      b.innerHTML = '<div class="rt"><span></span><span>·</span><span>' + escapeHtml(quandoMsg(x.m.quando)) + '</span></div>' +
        '<div class="rs">' + (x.m.autore === 'andrea' ? '<b>Tu:</b> ' : '') + evidenzia(pezzo, parole) + '</div>';
      b.querySelector('.rt span').textContent = titoloChat(x.c);
      b.onclick = function(){ s.close(function(){ apriChat(x.c.slug, { vai: x.m.nome }); }); };
      ris.appendChild(b);
    });
    if(trovati.length > 40){ var piu = document.createElement('div'); piu.className = 'nota'; piu.textContent = 'e altri ' + (trovati.length - 40) + ': aggiungi una parola per restringere.'; ris.appendChild(piu); }
  });
}

    b.onclick = function(){ var nuovo = attuale === e ? '' : e; attuale = nuovo; fatto(nuovo); sceltaEmoji(host, nuovo, fatto); vibra(); };
    host.appendChild(b);
  });
}
