  s.q('#_si').onclick = function(){
    var titolo = s.q('#_t').value.trim(), descr = s.q('#_d').value.trim();
    var repo = s.q('#_r').value.split(/[\s,]+/).map(function(x){ return x.trim(); }).filter(function(x){ return /^[\w.-]+\/[\w.-]+$/.test(x); });
    if(!titolo){ s.q('#_t').focus(); return; }
    var slug = slugify(titolo), base = slug, n = 2;
    while(chats[slug]) slug = base + '-' + (n++);
    var meta = { titolo: titolo, descrizione: descr, repo: repo, creata: oggi() };
    var files = [
      { path: 'chat/' + slug + '/chat.json', text: JSON.stringify(meta, null, 2) + '\n' },
      { path: 'chat/' + slug + '/istruzioni.md', text:
        '# ' + titolo + ' — istruzioni per Claude\n\n' +
        '> Cosa riguarda questa chat e come Andrea vuole che si lavori qui.\n' +
        '> Andrea la può modificare dall\'app; Claude la tiene aggiornata quando\n' +
        '> Andrea esprime una preferenza. La versione di Andrea vince sempre.\n\n' +
        '## Di cosa si parla\n\n' + (descr || '*(da scrivere)*') + '\n\n## Preferenze\n\n*(ancora nessuna)*\n' },
      { path: 'chat/' + slug + '/memoria.md', text:
        '# ' + titolo + ' — memoria\n\n' +
        '> Appunti di Claude: decisioni prese, stato del lavoro, cose da non\n' +
        '> dimenticare. Si aggiorna a ogni risposta che porta qualcosa di nuovo.\n\n*(vuoto)*\n' }
    ];
    var t = toast('<span class="spin"></span> creo la chat…', 0);
    commitFiles(files, 'nuova chat da app: ' + titolo).then(function(){
      t.remove();
      s.close(function(){ sync(true).then(function(){ apriChat(slug); }); });
    }).catch(function(e){ t.remove(); toast(escapeHtml(e.message), 5000); });
  };
}

/* ============================================================
   Una chat aperta
   ============================================================ */

var aperta = null;          // { slug, quanti }
var daAllegare = [];        // allegati scelti e non ancora mandati
var chiaveChat = '';

var SUGGERIMENTI = {
  generale: ['Cosa ho in agenda questa settimana?', 'Organizzami la giornata di domani', 'Ricordami di '],
  _: ['A che punto siamo?', 'Qual è il prossimo passo?', 'Riassumimi la memoria del progetto']
};

function apriChat(slug, opts){
  opts = opts || {};
  if(!chats[slug]) return;
  var gia = !!aperta;
  aperta = { slug: slug, quanti: 60 };
  ui.chat = slug; salvaUi();
  chiaveChat = '';
  daAllegare = [];
  var c = chats[slug];
  $('cAv').style.background = coloreChat(slug);
  $('cAv').innerHTML = avatarHtml(c);
  $('cTitle').textContent = titoloChat(c);
  $('chatview').classList.remove('hide');
  document.body.style.overflow = 'hidden';
  if(!gia) apriLivello(chiudiChat);
  var bozza = opts.bozza != null ? opts.bozza : (lsGet(K.draft(slug), '') || '');
  $('cInput').value = bozza;
  adattaInput(); disegnaAllegati();
  disegnaChat(true);
  if(opts.bozza != null) setTimeout(function(){ var i = $('cInput'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 120);
  segnaLetto(slug); aggiornaBadge();
}

function chiudiChat(){
  aperta = null; ui.chat = null; salvaUi();
  $('chatview').classList.add('hide');
  document.body.style.overflow = '';
  disegna();
}

function giornoEtichetta(d){
  var g = giornoDi(d), n = dDiff(g, oggi());
  if(n === 0) return 'Oggi';
  if(n === -1) return 'Ieri';
  var s = dataLunga(g);
  return s.charAt(0).toUpperCase() + s.slice(1) + (g.slice(0, 4) !== oggi().slice(0, 4) ? ' ' + g.slice(0, 4) : '');
}

function disegnaChat(scrollaGiu){
  if(!aperta) return;
  var c = chats[aperta.slug];
  if(!c){ chiudiLivello(); return; }
  var st = statoChat(c);
  var sub = st.tipo === 'ok' ? ((c.meta.descrizione || '').slice(0, 80) || 'con Claude') : ETICHETTE[st.tipo];
  if(st.tipo === 'lavoro' && st.run && st.run.run_started_at){
    var sec = Math.max(0, Math.round((Date.now() - new Date(st.run.run_started_at)) / 1000));
    sub += ' · ' + (sec < 90 ? sec + ' s' : Math.round(sec / 60) + ' min');
  }
  $('cSub').textContent = sub;
  $('cTitle').textContent = titoloChat(c);

  var mostra = c.msgs.slice(-aperta.quanti);
  var uscita = outbox.filter(function(o){ return o.chat === c.slug; });
  var chiave = [mostra.map(function(m){ return m.nome; }).join(','), uscita.map(function(o){ return o.nome + o.errore; }).join(','),
                st.tipo, st.run && st.run.id, agenda.sha, agq.length, aperta.quanti].join('|');
  disegnaSuggerimenti(c);
  if(chiave === chiaveChat) return;

  Promise.all(mostra.map(function(m){ return blobText(m.sha).catch(function(){ return '*(messaggio non leggibile)*'; }); })).then(function(testiMsg){
    if(!aperta || aperta.slug !== c.slug) return;
    chiaveChat = chiave;
    var box = $('cmsgs');
    var vicinoAlFondo = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    var altezzaPrima = box.scrollHeight;
    box.innerHTML = '';
    if(c.msgs.length > mostra.length){
      var piu = document.createElement('button'); piu.className = 'loadmore';
      piu.textContent = 'Messaggi precedenti (' + (c.msgs.length - mostra.length) + ')';
      piu.onclick = function(){ aperta.quanti += 60; chiaveChat = ''; disegnaChat(false); };
      box.appendChild(piu);
    }
    if(!mostra.length && !uscita.length){
      var v = document.createElement('div'); v.className = 'empty';
      v.innerHTML = 'Scrivi qui a Claude: ' + (c.slug === 'generale' ? 'domande, commissioni, appuntamenti.' : 'tutto quello che riguarda «' + escapeHtml(titoloChat(c)) + '».') +
        '<br>Di solito risponde in un paio di minuti.';
      box.appendChild(v);
    }
    var giornoPrima = '';
    function separatore(d){
      var g = giornoDi(d);
      if(g === giornoPrima) return;
      giornoPrima = g;
      var s = document.createElement('div'); s.className = 'daysep';
      s.innerHTML = '<span>' + escapeHtml(giornoEtichetta(d)) + '</span>';
      box.appendChild(s);
    }
    mostra.forEach(function(m, i){
      separatore(m.quando);
      box.appendChild(bolla(c, m.autore, testiMsg[i], m.quando, { nome: m.nome, ultimo: i === mostra.length - 1, st: st }));
    });
    uscita.forEach(function(o){
      separatore(infoMsg(o.nome).quando);
      box.appendChild(bolla(c, 'andrea', testoMessaggio(o), infoMsg(o.nome).quando, { uscita: o }));
    });
    if(st.tipo === 'lavoro' || st.tipo === 'coda' || st.tipo === 'attesa'){
      var w = document.createElement('div'); w.className = 'msg claude typing';
      var etichetta = st.tipo === 'lavoro' ? 'Claude sta lavorando…' : st.tipo === 'coda' ? 'Claude sta per partire…' :
        runs && runs.ok ? 'In attesa che Claude parta…' : 'In attesa di Claude…';
      w.innerHTML = '<div class="bubble"><span class="dots"><i></i><i></i><i></i></span><span>' + etichetta + '</span></div>' +
        '<div class="meta">' + (st.run ? '<a href="' + escapeHtml(st.run.url) + '" target="_blank" rel="noopener">vedi il turno</a>' : '') +
        (st.tipo === 'attesa' && st.attesa.length && Date.now() - st.attesa[st.attesa.length - 1].quando > 240000 ? '<button class="_rip">Riprova</button>' : '') + '</div>';
      box.appendChild(w);
    }
    if(st.tipo === 'runFallito'){
      var f = document.createElement('div'); f.className = 'msg sistema';
      f.innerHTML = '<div class="who">Regia</div><div class="bubble">Il turno di Claude si è interrotto prima di rispondere.</div>' +
        '<div class="meta"><button class="_rip">Riprova</button><a href="' + escapeHtml(st.run.url) + '" target="_blank" rel="noopener">vedi il turno</a></div>';
      box.appendChild(f);
    }
    box.querySelectorAll('._rip').forEach(function(b){ b.onclick = riprovaRisposta; });
    if(scrollaGiu || vicinoAlFondo) box.scrollTop = box.scrollHeight;
    else if(!scrollaGiu && box.scrollHeight > altezzaPrima && box.scrollTop < 40) box.scrollTop = box.scrollHeight - altezzaPrima;
    if(!document.hidden) segnaLetto(c.slug);
    aggiornaBadge();
  });
}

function bolla(c, autore, testo, quando, o){
  var fm = leggiFrontmatter(testo || '');
  var el = document.createElement('div');
  el.className = 'msg ' + autore + (fm.campi.tipo === 'briefing' ? ' briefing' : '') +
    (o.uscita ? ' out' + (o.uscita.errore ? ' fail' : '') : '');
  var who = autore === 'claude' ? (fm.campi.tipo === 'briefing' ? 'Claude · briefing del mattino' : 'Claude') : autore === 'sistema' ? 'Regia' : '';
  var html = (who ? '<div class="who">' + who + '</div>' : '') +
    '<div class="bubble md">' + mdToHtml(fm.corpo.trim() || ' ', true) + '</div>';
  el.innerHTML = html;
  var base = 'chat/' + c.slug;
  collegaRepo(el.querySelector('.bubble'), base);

  // allegati di Andrea
  var all = o.uscita ? o.uscita.allegati.map(function(a){ return a.rel; }) : [].concat(fm.campi.allegati || []);
  if(all.length){
    var at = document.createElement('div'); at.className = 'atts';
    all.forEach(function(rel){
      var p = risolvi(base, rel), b = document.createElement('button');
      if(isImg(p)){
        b.className = 'att img'; b.innerHTML = '<img alt="">';
        if(idx && idx.files[p]) caricaImg(b.querySelector('img'), p);
      } else {
        b.className = 'att'; b.innerHTML = '<svg class="i"><use href="#i-file"/></svg><span></span>';
        b.querySelector('span').textContent = nomeFile(p).replace(/^\d{8}-\d{6}-/, '');
      }
      b.onclick = function(){ if(idx && idx.files[p]) apriFile(p); else toast('L\'allegato è ancora in viaggio verso GitHub'); };
      at.appendChild(b);
    });
    el.appendChild(at);
  }

  // le voci d'agenda toccate da Claude
  var ev = [].concat(fm.campi.eventi || []), co = [].concat(fm.campi.compiti || []);
  if(ev.length || co.length){
    var cards = document.createElement('div'); cards.className = 'cards';
    var d = agendaVista();
    ev.forEach(function(id){ cards.appendChild(schedaVoce(d.eventi.filter(function(e){ return e.id === id; })[0], 'evento', id)); });
    co.forEach(function(id){ cards.appendChild(schedaVoce(d.compiti.filter(function(x){ return x.id === id; })[0], 'compito', id)); });
    el.appendChild(cards);
  }

  var meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML = '<span>' + oraDi(quando) + '</span>';
  if(o.uscita){
    meta.innerHTML += o.uscita.errore ? '<span style="color:var(--danger)">non inviato</span><button class="_re">Riprova</button><button class="_del">Elimina</button>' : '<span>invio…</span>';
    if(o.uscita.errore){
      meta.querySelector('._re').onclick = function(){ o.uscita.errore = ''; salvaOutbox(); chiaveChat = ''; disegnaChat(false); sync(); };
      meta.querySelector('._del').onclick = function(){
        outbox = outbox.filter(function(x){ return x !== o.uscita; }); salvaOutbox();
        if(!$('cInput').value.trim()){ $('cInput').value = o.uscita.testo; adattaInput(); }
        chiaveChat = ''; disegnaChat(false); disegna();
      };
    }
  } else if(autore === 'sistema' && o.ultimo && (o.st.tipo === 'errore')){
    meta.innerHTML += '<button class="_rip">Riprova</button>';
  }
  el.appendChild(meta);
  return el;
}

function schedaVoce(v, tipo, id){
  var b = document.createElement('button');
  if(!v){
    b.className = 'mini compito';
    b.innerHTML = '<div class="mi"><div class="mt" style="color:var(--muted)">Non più in agenda</div><div class="ms">' + escapeHtml(id) + '</div></div>';
    b.disabled = true;
    return b;
  }
  if(tipo === 'evento'){
    b.className = 'mini';
    b.style.setProperty('--tcol', 'var(--t-' + (v.tipo || 'appuntamento') + ')');
    b.innerHTML = '<svg class="i" style="color:var(--tcol)"><use href="#i-cal"/></svg><div class="mi"><div class="mt"></div><div class="ms"></div></div>';
    b.querySelector('.mt').textContent = v.titolo;
    b.querySelector('.ms').textContent = descriviQuando(v);
    b.onclick = function(){ formEvento(v); };
  } else {
    b.className = 'mini compito' + (v.fatto ? ' fatto' : '');
    b.innerHTML = '<svg class="i" style="color:var(--muted)"><use href="#i-list"/></svg><div class="mi"><div class="mt"></div><div class="ms"></div></div>';
    b.querySelector('.mt').textContent = v.titolo;
    b.querySelector('.ms').textContent = (v.fatto ? 'fatto' : 'da fare') + (v.scadenza ? ' · entro ' + relativo(v.scadenza) : '');
    b.onclick = function(){ formCompito(v); };
  }
  return b;
}

function descriviQuando(v){
  var s = relativo(v.data);
  s = s.charAt(0).toUpperCase() + s.slice(1);
  if(v.data_fine) s += ' → ' + relativo(v.data_fine);
  if(v.ora) s += ' · ' + v.ora + (v.ora_fine ? '–' + v.ora_fine : '');
  if(v.ripeti) s += ' · ' + descriviRipeti(v.ripeti);
  if(v.luogo) s += ' · ' + v.luogo;
  return s;
}

/* i percorsi relativi nei messaggi partono dalla cartella della chat;
   quelli che cominciano con chat/ o agenda/ dalla radice del repo */
function risolvi(base, rel){
  rel = rel.replace(/^\.\//, '');
  var parti = (/^(chat|agenda|\.regia)\//.test(rel) || rel.charAt(0) === '/' ? rel.replace(/^\//, '') : base + '/' + rel).split('/');
  var out = [];
  parti.forEach(function(p){ if(p === '..') out.pop(); else if(p && p !== '.') out.push(p); });
  return out.join('/');
}
function collegaRepo(el, base){
  el.querySelectorAll('a[data-repo]').forEach(function(a){
    var p = risolvi(base, a.getAttribute('data-repo'));
    a.onclick = function(e){ e.preventDefault(); apriFile(p); };
  });
  el.querySelectorAll('img[data-repo]').forEach(function(img){
    var p = risolvi(base, img.getAttribute('data-repo'));
    if(idx && idx.files[p]) caricaImg(img, p);
    img.style.cursor = 'pointer';
    img.onclick = function(){ apriFile(p); };
  });
}
function caricaImg(img, path){
  blobB64(idx.files[path]).then(function(b){ img.src = 'data:' + mimeDi(path) + ';base64,' + b; }).catch(function(){});
}

function adattaInput(){

function disegnaAllegati(){

/* le foto grandi si rimpiccioliscono: 2000 px bastano per farle leggere a Claude */
function preparaAllegato(f){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('Non riesco a leggere ' + f.name)); };
    fr.onload = function(){
      var b64 = String(fr.result).split(',')[1] || '';
      var nome = f.name.replace(/[^\w.\- ]+/g, '_').replace(/\s+/g, '-').slice(-60) || 'file';
      if(!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 1.2 * 1024 * 1024){ res({ nome: nome, tipo: f.type, b64: b64 }); return; }
      var img = new Image();
      img.onload = function(){
        var lato = Math.max(img.width, img.height), k = Math.min(1, 2000 / lato);
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var out = cv.toDataURL('image/jpeg', 0.85).split(',')[1];
        res({ nome: nome.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', tipo: 'image/jpeg', b64: out });
      };
      img.onerror = function(){ res({ nome: nome, tipo: f.type, b64: b64 }); };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}

function elencoFile(c, prodotti){
  var base = 'chat/' + c.slug;
  var righe = prodotti.slice().sort().reverse().map(function(p){
    return '<button data-p="' + escapeHtml(p) + '"><svg class="i"><use href="#i-file"/></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(p) + '</span></button>';
  }).join('');
  var s = sheet('<h2>File della chat</h2><p class="help">Quello che Claude ha prodotto (<code>file/</code>) e quello che hai mandato tu (<code>allegati/</code>).</p>' +
    (righe ? '<div class="menu">' + righe + '</div>' : '<p class="help">Ancora nessun file.</p>'));
  s.el.querySelectorAll('[data-p]').forEach(function(b){
    b.onclick = function(){ var p = base + '/' + b.getAttribute('data-p'); s.close(function(){ apriFile(p); }); };
  });
}

/* ============================================================
   Lettore / editor di un file del repo
   ============================================================ */

var vcur = null;    // { path, sha, remoto, tipo }

function apriFile(path){
  var sha = idx && idx.files[path];
  vcur = { path: path, sha: sha || null, remoto: '', tipo: 'testo' };
  $('vTitle').textContent = nomeFile(path);
  $('vSub').textContent = dirname(path);
  $('preview').className = 'md'; $('preview').innerHTML = '<p style="color:var(--muted)">carico…</p>';
  $('editor').value = ''; $('vSave').disabled = true; $('vbanner').innerHTML = '';
  $('vSeg').classList.remove('hide'); $('vSave').classList.remove('hide');
  $('viewer').classList.remove('hide');
  document.body.style.overflow = 'hidden';
  apriLivello(chiudiFile);
  modoFile('leggi');
  if(!sha){
    if(/\.md$/.test(path)){ vcur.remoto = ''; $('editor').value = ''; $('preview').innerHTML = '<p style="color:var(--muted)">File vuoto: tocca «Modifica» per scriverlo.</p>'; return; }
    $('preview').innerHTML = '<p style="color:var(--danger)">File non trovato nel repo.</p>'; return;
  }
  blobB64(sha).then(function(b64){
    if(!vcur || vcur.path !== path) return;
    if(isImg(path)){
      vcur.tipo = 'img'; $('vSeg').classList.add('hide'); $('vSave').classList.add('hide');
      $('preview').innerHTML = '<img class="solo" alt="" src="data:' + mimeDi(path) + ';base64,' + b64 + '">';
      return;
    }
    if(!isText(path)){
      vcur.tipo = 'bin'; $('vSeg').classList.add('hide'); $('vSave').classList.add('hide');
      $('preview').innerHTML = '<p style="color:var(--muted)">Questo file non si legge qui dentro.</p><p><button class="btn primary" id="_scar">Scarica</button></p>';
      // un download, non una pagina: il file non gira dentro l'app e non vede il token
      $('_scar').onclick = function(){
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([b64bytes(b64)], { type: mimeDi(path) }));
        a.download = nomeFile(path); document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
      };
      return;
    }
    vcur.remoto = b64decodeText(b64);
    $('editor').value = vcur.remoto;
    disegnaFile();
  }).catch(function(e){ $('preview').innerHTML = '<p style="color:var(--danger)">' + escapeHtml(e.message) + '</p>'; });
}

function chiudiFile(){
  vcur = null;
  $('viewer').classList.add('hide');
  if(!aperta) document.body.style.overflow = '';
}

function modoFile(m){
  var leggi = m === 'leggi';
  $('vRead').classList.toggle('on', leggi); $('vEdit').classList.toggle('on', !leggi);
  $('preview').classList.toggle('hide', !leggi); $('editor').classList.toggle('hide', leggi);
  if(leggi && vcur && vcur.tipo === 'testo') disegnaFile();
  if(!leggi) setTimeout(function(){ $('editor').focus(); }, 50);
}

/* Le pagine HTML girano in un iframe in sandbox SENZA allow-same-origin:
   così non possono leggere il localStorage dell'app, dove sta il token.
   Le due cose non vanno mai rimesse insieme. (Come nell'app Articoli.) */
function disegnaFile(){
  var p = $('preview'), testo = $('editor').value, path = vcur.path;
  p.className = 'md' + (isPagina(path) ? ' pagina' : '');
  if(isPagina(path)){
    p.innerHTML = '';
    var f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.title = nomeFile(path);
    f.srcdoc = testo;
    p.appendChild(f);
    return;
  }
  if(/\.(md|markdown)$/i.test(path)){
    p.innerHTML = testo.trim() ? mdToHtml(testo, false) : '<p style="color:var(--muted)">File vuoto.</p>';
    collegaRepo(p, dirname(path));
  } else {
    p.innerHTML = '<pre class="raw"></pre>';
    p.firstChild.textContent = testo;
  }
}

function salvaFile(forza){
  if(!vcur || vcur.tipo !== 'testo') return;
  var testo = $('editor').value, path = vcur.path;
  var t = toast('<span class="spin"></span> salvo su GitHub…', 0);
  $('vSave').disabled = true;
  var passo = forza ? getContent(path).then(function(d){ return d.sha; }).catch(function(){ return null; }) : Promise.resolve(vcur.sha);
  passo.then(function(sha){ return putFile(path, b64encode(testo), sha, 'modifica da app: ' + path); }).then(function(r){
    testi[r.content.sha] = testo;
    vcur.sha = r.content.sha; vcur.remoto = testo; idx.commit = null;
    t.remove(); toast('Salvato'); $('vbanner').innerHTML = ''; modoFile('leggi');
  }).catch(function(e){
    t.remove(); $('vSave').disabled = false;
    if(e.status === 409 || e.status === 422){
      $('vbanner').innerHTML = '<div class="banner err">Il file è cambiato su GitHub dopo che l\'hai aperto (forse l\'ha aggiornato Claude). ' +
        '<button id="_over">Sovrascrivi con la mia versione</button> <button id="_rel">Ricarica quella su GitHub</button></div>';
      $('_over').onclick = function(){ salvaFile(true); };
      $('_rel').onclick = function(){ var p = vcur.path; chiudiLivello(function(){ sync(true).then(function(){ apriFile(p); }); }); };
    } else {
      $('vbanner').innerHTML = '<div class="banner err">' + escapeHtml(e.message) + '</div>';
    }
  });
}

/* ============================================================
   Agenda: le modifiche si mettono in coda sul telefono e partono
   una alla volta. Ognuna dice solo cosa cambia (campo per campo),
   così se intanto Claude ha toccato la stessa voce non si perde niente.
   ============================================================ */

function agendaVista(){
  var d = clone(agenda.dati || agendaVuota());
  d.eventi = d.eventi || []; d.compiti = d.compiti || [];
  agq.forEach(function(op){ applicaOp(d, op); });
  return d;
}

function applicaOp(d, op){
  if(op.op === 'salva'){
    var lista = d[op.lista], i = -1;
    lista.forEach(function(x, j){ if(x.id === op.dopo.id) i = j; });
    if(i < 0){ lista.push(clone(op.dopo)); return; }
    var t = lista[i], prima = op.prima || {};
    Object.keys(Object.assign({}, prima, op.dopo)).forEach(function(k){
      if(uguali(prima[k], op.dopo[k])) return;
      if(vuoto(op.dopo[k])) delete t[k]; else t[k] = clone(op.dopo[k]);
    });
  } else if(op.op === 'elimina'){
    d.eventi = d.eventi.filter(function(x){ return x.id !== op.id; });
    d.compiti = d.compiti.filter(function(x){ return x.id !== op.id; });
  } else if(op.op === 'salta'){
    d.eventi.forEach(function(e){
      if(e.id !== op.id || !e.ripeti) return;
      var s = (e.ripeti.salta || []).slice();
      if(s.indexOf(op.data) < 0) s.push(op.data);
      e.ripeti.salta = s.sort(); e.modificato = op.quando;
    });
  } else if(op.op === 'fatto'){
    d.compiti.forEach(function(c){
      if(c.id !== op.id) return;
      c.fatto = op.fatto; c.fatto_il = op.fatto ? op.data : null; c.modificato = op.quando;
    });
  }
}

function accodaAgenda(op, descr){
  op.descr = descr; op.quando = adessoLocale();
  agq.push(op); lsSet(K.agq, agq);
  disegna();
  if(aperta){ chiaveChat = ''; disegnaChat(false); }
  sync();
}

var salvandoAgenda = null;
function salvaAgendaCoda(tentativo){
  if(salvandoAgenda && !tentativo) return salvandoAgenda;
  if(!agq.length) return Promise.resolve();
  tentativo = tentativo || 0;
  var ops = agq.slice();
  var p = getContent(AGENDA).then(function(d){ return d; }, function(e){ if(e.status === 404) return null; throw e; })
    .then(function(d){
      var dati;
      try{ dati = d ? JSON.parse(b64decodeText(d.content)) : agendaVuota(); }
      catch(e){ throw new Error('agenda.json su GitHub non è JSON valido: la sistemo da GitHub o chiedo a Claude.'); }
      dati.eventi = dati.eventi || []; dati.compiti = dati.compiti || [];
      ops.forEach(function(op){ applicaOp(dati, op); });
      var testo = serializzaAgenda(dati);
      var descr = ops.map(function(o){ return o.descr; }).filter(Boolean);
      var msg = 'agenda da app: ' + (descr.length > 3 ? descr.slice(0, 3).join('; ') + ' e altro' : descr.join('; '));
      return putFile(AGENDA, b64encode(testo), d && d.sha, msg).then(function(r){
        testi[r.content.sha] = testo;
        agenda.dati = JSON.parse(testo); agenda.sha = r.content.sha;
        agq = agq.filter(function(o){ return ops.indexOf(o) < 0; }); lsSet(K.agq, agq);
        idx.commit = null;
      });
    })
    .catch(function(e){
      if((e.status === 409 || e.status === 422) && tentativo < 3) return salvaAgendaCoda(tentativo + 1);
      throw e;
    });
  if(!tentativo){ salvandoAgenda = p.then(function(){ salvandoAgenda = null; }, function(e){ salvandoAgenda = null; throw e; }); return salvandoAgenda; }
  return p;
}

/* ---------- viste ---------- */

function tipoColore(v){ return 'var(--t-' + (v.tipo || 'appuntamento') + ')'; }

function rigaEvento(x, giorno){
  var v = x.ev, b = document.createElement('button');
  b.className = 'ev';
  b.style.setProperty('--tcol', tipoColore(v));
  // a sinistra l'ora d'inizio e, sotto, la fine (o «tutto il giorno», o «giorno 2/5» per i viaggi)
  var su, giu;
  if(x.dur){ su = x.k === 0 && v.ora ? v.ora : ''; giu = 'giorno ' + (x.k + 1) + '/' + (x.dur + 1); }
  else if(v.ora){ su = v.ora; giu = v.ora_fine || ''; }
  else { su = ''; giu = 'tutto il giorno'; }
  var pezzi = [];
  if(v.tipo && v.tipo !== 'appuntamento') pezzi.push(TIPI.filter(function(t){ return t[0] === v.tipo; }).concat([[0, v.tipo]])[0][1]);
  if(v.luogo) pezzi.push(v.luogo);
  if(v.ripeti) pezzi.push(descriviRipeti(v.ripeti));
  var ch = v.chat && chats[v.chat] ? '<span class="tag">' + escapeHtml(titoloChat(chats[v.chat])) + '</span>' : '';
  b.innerHTML = '<div class="eo">' + escapeHtml(su) + '<small>' + escapeHtml(giu) + '</small></div>' +
    '<div class="eb"></div><div class="ei"><div class="et"></div><div class="es">' + ch + '<span></span></div></div>';
  b.querySelector('.et').textContent = v.titolo;
  b.querySelector('.es span').textContent = pezzi.join(' · ');
  if(!ch && !pezzi.length) b.querySelector('.es').remove();
  var o = oggi(), finita = v.ora_fine || v.ora;
  if(giorno < o || (giorno === o && !x.dur && finita && finita < oraDi(new Date()))) b.classList.add('passato');
  b.onclick = function(){ formEvento(v, x.ini); };
  return b;
}

function rigaCompito(c){
  var b = document.createElement('div');
  b.className = 'todo' + (c.fatto ? ' fatto' : '') + (c.priorita === 'alta' ? ' alta' : '');
  var o = oggi(), info = [];
  if(c.scadenza){
    var n = dDiff(c.scadenza, o);
    var cls = !c.fatto && n < 0 ? 'rosso' : !c.fatto && n <= 1 ? 'ambra' : '';
    info.push('<span class="tag ' + cls + '">' + (n < 0 && !c.fatto ? 'scaduto ' : 'entro ') + escapeHtml(relativo(c.scadenza)) + '</span>');
  }
  if(c.chat && chats[c.chat]) info.push('<span class="tag">' + escapeHtml(titoloChat(chats[c.chat])) + '</span>');
  if(c.fatto && c.fatto_il) info.push('fatto ' + escapeHtml(relativo(c.fatto_il)));
  b.innerHTML = '<button class="check" aria-label="Fatto"><svg class="i"><use href="#i-check"/></svg></button>' +
    '<button class="ti" style="text-align:left"><div class="tt"></div><div class="ts">' + info.join(' ') + '</div></button>';
  b.querySelector('.tt').textContent = c.titolo;
  if(!info.length) b.querySelector('.ts').remove();
  b.querySelector('.check').onclick = function(){
    var fatto = !c.fatto;
    b.classList.toggle('fatto', fatto);
    accodaAgenda({ op: 'fatto', id: c.id, fatto: fatto, data: oggi() }, (fatto ? 'fatto ' : 'da rifare ') + '«' + c.titolo + '»');
  };
  b.querySelector('.ti').onclick = function(){ formCompito(c); };
  return b;
}

function blocco(titolo, nodi, extra){
  var w = document.createElement('div'); w.className = 'day';
  if(titolo){ var h = document.createElement('div'); h.className = 'day-h'; h.innerHTML = titolo; w.appendChild(h); }
  var l = document.createElement('div'); l.className = 'evlist';
  if(!nodi.length){ l.innerHTML = '<div class="nulla">' + (extra || 'Niente in programma') + '</div>'; }
  nodi.forEach(function(n){ l.appendChild(n); });
  w.appendChild(l);
  return w;
}

function disegnaProssimi(){
  var host = $('main'), d = agendaVista(), o = oggi(), fine = dAdd(o, 44);
  host.innerHTML = '';
  var urgenti = d.compiti.filter(function(c){ return !c.fatto && c.scadenza && c.scadenza <= o; });
  if(urgenti.length){
    host.appendChild(blocco('<span class="dn">Da fare entro oggi</span><span class="dd">' + urgenti.length + '</span>', urgenti.map(rigaCompito)));
  }
  var per = eventiNelPeriodo(d, o, fine), quanti = 0;
  for(var k = 0; k <= 44; k++){
    var g = dAdd(o, k), voci = per[g] || [];
    var scad = d.compiti.filter(function(c){ return !c.fatto && c.scadenza === g && g > o; });
    if(!voci.length && !scad.length && k > 1) continue;
    quanti += voci.length;
    var nome = k === 0 ? 'Oggi' : k === 1 ? 'Domani' : GIORNI[dow(g)].charAt(0).toUpperCase() + GIORNI[dow(g)].slice(1);
    var t = '<span class="dn">' + nome + '</span><span class="dd">' + escapeHtml(k < 2 ? dataLunga(g) : dataBreve(g).replace(/^\w+ /, '')) + '</span>';
    var nodi = voci.map(function(x){ return rigaEvento(x, g); }).concat(scad.map(rigaCompito));
    var bl = blocco(t, nodi);
    if(k === 0) bl.querySelector('.day-h').classList.add('oggi');
    host.appendChild(bl);
  }
  if(!quanti){
    var e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = 'Nelle prossime sei settimane non c\'è niente.<br>Aggiungi un evento col tasto qui sotto, o scrivi a Claude in Generale («ricordami il dentista martedì alle 15»).';
    host.appendChild(e);
  }
}

function disegnaMese(){
  var host = $('main'), d = agendaVista(), o = oggi();
  if(!ui.mese) ui.mese = o.slice(0, 7);
  if(!ui.giorno || ui.giorno.slice(0, 7) !== ui.mese) ui.giorno = ui.mese === o.slice(0, 7) ? o : ui.mese + '-01';
  var primo = ui.mese + '-01', inizio = dAdd(primo, -(isoDow(primo) - 1));
  var y = +ui.mese.slice(0, 4), m = +ui.mese.slice(5, 7);
  var ultimo = dFmt(Date.UTC(y, m, 0)), fine = dAdd(ultimo, 7 - isoDow(ultimo));
  var per = eventiNelPeriodo(d, inizio, fine);
  host.innerHTML = '<div class="mese-h"><span class="mn">' + MESI[m - 1] + ' ' + y + '</span>' +
    (ui.mese !== o.slice(0, 7) ? '<button class="oggibtn" id="_mo">Oggi</button>' : '') +
    '<button id="_mp" aria-label="Mese prima"><svg class="i"><use href="#i-left"/></svg></button>' +
    '<button id="_ms" aria-label="Mese dopo"><svg class="i"><use href="#i-right"/></svg></button></div>';
  var gr = document.createElement('div'); gr.className = 'griglia';
  ['Lu','Ma','Me','Gi','Ve','Sa','Do'].forEach(function(w){ var c = document.createElement('div'); c.className = 'wd'; c.textContent = w; gr.appendChild(c); });
  for(var g = inizio; g <= fine; g = dAdd(g, 1)){
    (function(g){
      var c = document.createElement('button'), voci = per[g] || [];
      var scad = d.compiti.filter(function(x){ return !x.fatto && x.scadenza === g; });
      c.className = 'cella' + (g.slice(0, 7) !== ui.mese ? ' fuori' : '') + (g === o ? ' oggi' : '') + (g === ui.giorno ? ' sel' : '');
      var pts = voci.slice(0, 4).map(function(x){ return '<i style="--tcol:' + tipoColore(x.ev) + '"></i>'; }).join('') +
        (scad.length ? '<i style="--tcol:var(--muted)"></i>' : '');
      c.innerHTML = '<span class="n">' + (+g.slice(8)) + '</span><span class="pts">' + pts + '</span>' +
        (voci.length > 4 ? '<span class="piu">+' + (voci.length - 4) + '</span>' : '');
      c.onclick = function(){ ui.giorno = g; if(g.slice(0, 7) !== ui.mese) ui.mese = g.slice(0, 7); salvaUi(); disegnaMese(); };
      gr.appendChild(c);
    })(g);
  }
  host.appendChild(gr);
  var sel = ui.giorno, voci = eventiNelPeriodo(d, sel, sel)[sel] || [];
  var scad = d.compiti.filter(function(x){ return x.scadenza === sel; });
  var h = '<span class="dn">' + escapeHtml(dataLunga(sel).charAt(0).toUpperCase() + dataLunga(sel).slice(1)) + '</span>' +
    '<span class="dd">' + escapeHtml(relativo(sel) === dataBreve(sel) ? '' : relativo(sel)) + '</span>';
  var bl = blocco(h, voci.map(function(x){ return rigaEvento(x, sel); }).concat(scad.map(rigaCompito)));
  bl.style.marginTop = '14px';
  host.appendChild(bl);
  $('_mp').onclick = function(){ spostaMese(-1); };
  $('_ms').onclick = function(){ spostaMese(1); };
  if($('_mo')) $('_mo').onclick = function(){ ui.mese = o.slice(0, 7); ui.giorno = o; salvaUi(); disegnaMese(); };
}
function spostaMese(n){
  var y = +ui.mese.slice(0, 4), m = +ui.mese.slice(5, 7) - 1 + n;
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  ui.mese = y + '-' + pad(m + 1); ui.giorno = null; salvaUi(); disegnaMese();
}

var mostraFatti = false;
function disegnaDaFare(){
  var host = $('main'), d = agendaVista(), o = oggi(), sett = dAdd(o, 7);
  host.innerHTML = '';
  var qa = document.createElement('div'); qa.className = 'quickadd';
  qa.innerHTML = '<input id="_qa" placeholder="Aggiungi una cosa da fare…" enterkeyhint="done" autocomplete="off">';
  host.appendChild(qa);
  $('_qa').addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var t = this.value.trim(); if(!t) return;
    this.value = '';
    var c = { id: nuovoId('c'), titolo: t, creato_da: 'andrea', creato: adessoLocale() };
    accodaAgenda({ op: 'salva', lista: 'compiti', prima: null, dopo: normalizza(c, ORD_CO) }, 'nuovo compito «' + t + '»');
    setTimeout(function(){ var i = $('_qa'); if(i) i.focus(); }, 30);
  });
  var aperti = d.compiti.filter(function(c){ return !c.fatto; });
  var gruppi = [
    ['In ritardo', aperti.filter(function(c){ return c.scadenza && c.scadenza < o; })],
    ['Oggi', aperti.filter(function(c){ return c.scadenza === o; })],
    ['Prossimi 7 giorni', aperti.filter(function(c){ return c.scadenza > o && c.scadenza <= sett; })],
    ['Più avanti', aperti.filter(function(c){ return c.scadenza > sett; })],
    ['Senza scadenza', aperti.filter(function(c){ return !c.scadenza; })]
  ];
  var pr = { alta: 0, normale: 1, bassa: 2 };
  gruppi.forEach(function(gp){
    if(!gp[1].length) return;
    gp[1].sort(function(a, b){ return cmpTuple([a.scadenza || '', pr[a.priorita || 'normale'], a.creato || ''], [b.scadenza || '', pr[b.priorita || 'normale'], b.creato || '']); });
    var h = document.createElement('div'); h.className = 'sec-h'; h.textContent = gp[0] + ' · ' + gp[1].length;
    host.appendChild(h);
    host.appendChild(blocco('', gp[1].map(rigaCompito)));
  });
  if(!aperti.length){
    var e = document.createElement('div'); e.className = 'empty';
    e.innerHTML = 'Niente da fare. 🎉<br>Scrivi qui sopra, oppure chiedi a Claude («ricordami di…»).';
    host.appendChild(e);
  }
  var fatti = d.compiti.filter(function(c){ return c.fatto; }).sort(function(a, b){ return cmp(b.fatto_il || '', a.fatto_il || ''); });
  if(fatti.length){
    var hf = document.createElement('div'); hf.className = 'sec-h';
    hf.innerHTML = 'Fatti · ' + fatti.length + '<button>' + (mostraFatti ? 'Nascondi' : 'Mostra') + '</button>';
    hf.querySelector('button').onclick = function(){ mostraFatti = !mostraFatti; disegnaDaFare(); };
    host.appendChild(hf);
    if(mostraFatti) host.appendChild(blocco('', fatti.slice(0, 40).map(rigaCompito)));
  }
}

function nuovoId(pref){
  var d = agendaVista(), usati = {};
  d.eventi.concat(d.compiti).forEach(function(x){ usati[x.id] = 1; });
  var id; do { id = pref + '-' + rand(8); } while(usati[id]);
  return id;
}

/* ---------- moduli ---------- */

function opzioniChat(sel){
  return '<option value="">— nessuna —</option>' + chatOrdinate().filter(function(c){ return !c.meta.archiviata || c.slug === sel; }).map(function(c){
    return '<option value="' + escapeHtml(c.slug) + '"' + (c.slug === sel ? ' selected' : '') + '>' + escapeHtml(titoloChat(c)) + '</option>';
  }).join('');
}

function formEvento(v, occorrenza){
  var nuovo = !v || !v.id;
  var prima = nuovo ? null : clone(v);
  v = Object.assign({ tipo: 'appuntamento', data: (v && v.data) || ui.giorno || oggi() }, v || {});

/* ---------- verso altri calendari ---------- */

var GG_ICS = ['SU','MO','TU','WE','TH','FR','SA'];
function rrule(r){
  if(!r) return '';
  var s = 'FREQ=' + { giorno:'DAILY', settimana:'WEEKLY', mese:'MONTHLY', anno:'YEARLY' }[r.ogni];
  if(r.intervallo > 1) s += ';INTERVAL=' + r.intervallo;
  if(r.ogni === 'settimana' && r.giorni && r.giorni.length) s += ';BYDAY=' + r.giorni.map(function(g){ return GG_ICS[g % 7]; }).join(',');
  if(r.fino) s += ';UNTIL=' + r.fino.replace(/-/g, '') + 'T235959Z';
  return s;
}
function linkGoogle(v, occ){
  var ini = v.data, dates;
  if(v.ora){
    var fine = v.ora_fine || (function(){ var h = (+v.ora.slice(0, 2) + 1) % 24; return pad(h) + v.ora.slice(2); })();
    var gFine = v.data_fine || (v.ora_fine && v.ora_fine < v.ora ? dAdd(ini, 1) : (!v.ora_fine && v.ora >= '23:00' ? dAdd(ini, 1) : ini));
    dates = ini.replace(/-/g, '') + 'T' + v.ora.replace(':', '') + '00/' + gFine.replace(/-/g, '') + 'T' + fine.replace(':', '') + '00';
  } else {
    dates = ini.replace(/-/g, '') + '/' + dAdd(v.data_fine || ini, 1).replace(/-/g, '');
  }
  var u = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(v.titolo) +
    '&dates=' + dates + '&ctz=' + encodeURIComponent(fuso());
  if(v.note) u += '&details=' + encodeURIComponent(v.note);
  if(v.luogo) u += '&location=' + encodeURIComponent(v.luogo);
  if(v.ripeti) u += '&recur=' + encodeURIComponent('RRULE:' + rrule(v.ripeti));
  return u;
}

function esportaIcs(){
  var d = agendaVista();
  function esc(s){ return String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
  function piega(l){ var out = []; while(l.length > 74){ out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); }
  var tz = fuso(), stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  var r = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Regia//Agenda//IT', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Regia'];
  if(tz === 'Europe/Rome'){
    r.push('BEGIN:VTIMEZONE', 'TZID:Europe/Rome',
      'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST', 'DTSTART:19700329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
      'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
      'END:VTIMEZONE');
  }
  d.eventi.forEach(function(v){
    r.push('BEGIN:VEVENT', 'UID:' + v.id + '@regia', 'DTSTAMP:' + stamp, 'SUMMARY:' + esc(v.titolo));
    if(v.ora){
      var fine = v.ora_fine || pad((+v.ora.slice(0, 2) + 1) % 24) + v.ora.slice(2);
      var gf = v.data_fine || (fine < v.ora ? dAdd(v.data, 1) : v.data);
      r.push('DTSTART;TZID=' + tz + ':' + v.data.replace(/-/g, '') + 'T' + v.ora.replace(':', '') + '00');
      r.push('DTEND;TZID=' + tz + ':' + gf.replace(/-/g, '') + 'T' + fine.replace(':', '') + '00');
    } else {
      r.push('DTSTART;VALUE=DATE:' + v.data.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + dAdd(v.data_fine || v.data, 1).replace(/-/g, ''));
    }
    if(v.ripeti){
      r.push('RRULE:' + rrule(v.ripeti));
      (v.ripeti.salta || []).forEach(function(s){
        r.push(v.ora ? 'EXDATE;TZID=' + tz + ':' + s.replace(/-/g, '') + 'T' + v.ora.replace(':', '') + '00' : 'EXDATE;VALUE=DATE:' + s.replace(/-/g, ''));
      });
    }
    if(v.luogo) r.push('LOCATION:' + esc(v.luogo));
    if(v.note) r.push('DESCRIPTION:' + esc(v.note));
    r.push('END:VEVENT');
  });
  r.push('END:VCALENDAR');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([r.map(piega).join('\r\n') + '\r\n'], { type: 'text/calendar' }));
  a.download = 'regia-agenda.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}

function controllaConfigurazione(){

    '<div class="btnrow"><button class="btn" id="_ch">Chiudi</button></div>');

  var voci = [];
  function voce(stato, titolo, dett){ voci.push('<li class="' + stato + '"><span class="ck">' + (stato === 'ok' ? '✓' : stato === 'no' ? '✗' : '!') + '</span><div>' + titolo + (dett ? '<small>' + dett + '</small>' : '') + '</div></li>'); }
  function mostra(){ var ul = s.q('#_ck'); if(ul) ul.innerHTML = voci.join(''); }
  var repoUrl = 'https://github.com/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo);
  if(!cfg.token){ voce('no', 'Manca il token', 'Incollalo nelle Impostazioni.'); mostra(); return; }

  fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo, { headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, cache: 'no-store' })
    .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); })
    .then(function(r){
      if(!r.ok){ voce('no', 'Non vedo il repo ' + escapeHtml(cfg.owner + '/' + cfg.repo), r.status === 401 ? 'Il token non è valido.' : 'Controlla il nome e che il token abbia accesso a quel repo.'); mostra(); return; }
      if(r.j.private) voce('ok', 'Repo dei dati raggiungibile, ed è privato');
      else voce('no', 'Il repo dei dati è PUBBLICO', 'Le tue chat e l\'agenda sono visibili a tutti: rendilo privato da Settings → General → Danger zone.');
      return sync(true).then(function(){
        var f = idx ? idx.files : {};
        if(f['CLAUDE.md'] && f['.github/workflows/claude.yml'] && f['.regia/comune.py']) voce('ok', 'Workflow e script di Claude presenti');
        else voce('no', 'Nel repo mancano il workflow o gli script di Claude', 'Servono .github/workflows/claude.yml e la cartella .regia/.');
        if(runs && runs.ok) voce('ok', 'Il token vede i turni di Claude (Actions)');
        else voce('forse', 'Il token non vede i turni di Claude', 'Aggiungi il permesso «Actions: Read and write»: senza, l\'app non sa quando Claude lavora e «Riprova» non va.');
        var avvisi = [];
        Object.keys(chats).forEach(function(sl){
          var c = chats[sl], u = c.msgs[c.msgs.length - 1];
          if(u && u.autore === 'sistema') avvisi.push(u);
        });
        return Promise.all(avvisi.map(function(u){ return blobText(u.sha).catch(function(){ return ''; }); })).then(function(t){
          var manca = t.some(function(x){ return /CLAUDE_CODE_OAUTH_TOKEN/.test(x) && /manca/i.test(x); });
          var risposto = Object.keys(chats).some(function(sl){ return chats[sl].stato && chats[sl].stato.run; });
          var ultimo = runs && runs.ok && runs.lista.filter(function(x){ return x.status === 'completed'; })[0];
          if(manca) voce('no', 'Manca la chiave di Claude', 'Dal computer: <code>claude setup-token</code>, poi incollala come segreto <code>CLAUDE_CODE_OAUTH_TOKEN</code> qui: <a href="' + repoUrl + '/settings/secrets/actions/new" target="_blank" rel="noopener">segreti del repo</a>.');
          else if(risposto) voce('ok', 'Claude ha già risposto da qui: la chiave funziona');
          else voce('forse', 'Chiave di Claude: non ancora provata', 'Lo saprai al primo messaggio. Se manca, in chat arriva l\'avviso con le istruzioni.');
          if(ultimo && ultimo.conclusion && ultimo.conclusion !== 'success') voce('forse', 'L\'ultimo turno di Claude è finito male', '<a href="' + escapeHtml(ultimo.url) + '" target="_blank" rel="noopener">Vedi il turno su GitHub</a>.');
          voce('forse', 'Repo dei progetti (facoltativo)', 'Per far lavorare Claude su russo, prep e gli altri serve il segreto <code>REGIA_GH_TOKEN</code>: le istruzioni sono nel README di ' + escapeHtml(cfg.repo) + '.');
          mostra();
        });
      });
    })
    .catch(function(e){ voce('no', 'Non riesco a parlare con GitHub', escapeHtml(e.message)); mostra(); });
}

/* ============================================================
   Disegno generale e navigazione
   ============================================================ */

function disegna(){
  var tab = ui.tab;
  document.querySelectorAll('#tabbar button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
  $('agendaNav').classList.toggle('hide', tab !== 'agenda' || !cfg.token);
  document.querySelectorAll('#agSeg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === ui.agv); });
  var fab = $('fab');
  fab.classList.toggle('hide', !cfg.token || !idx);
  $('fabLabel').textContent = tab === 'chat' ? 'Chat' : ui.agv === 'dafare' ? 'Da fare' : 'Evento';
  if(!cfg.token){ disegnaBenvenuto(); aggiornaBadge(); return; }
  if(tab === 'chat') disegnaChatList();
  else if(!idx) $('main').innerHTML = '<div class="empty">carico l\'agenda…</div>';
  else if(ui.agv === 'mese') disegnaMese();
  else if(ui.agv === 'dafare') disegnaDaFare();
  else disegnaProssimi();
  aggiornaBadge();
  if(aperta) disegnaChat(false);
}

function vaiTab(t){
  if(ui.tab === t) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  ui.tab = t; salvaUi(); window.scrollTo(0, 0); disegna();
}

/* la tastiera del telefono rimpicciolisce lo schermo: i livelli a schermo
   intero (chat, file) seguono la parte visibile, così la casella di
   scrittura resta sopra la tastiera anche su iPhone */
function adattaSchermo(){
  var vv = window.visualViewport; if(!vv) return;
  document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  document.querySelectorAll('.layer').forEach(function(l){ l.style.top = vv.offsetTop + 'px'; });
  if(aperta){ var box = $('cmsgs'); if(document.activeElement === $('cInput')) box.scrollTop = box.scrollHeight; }
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', adattaSchermo);
  window.visualViewport.addEventListener('scroll', adattaSchermo);
}

/* ---------- avvio ---------- */

document.querySelectorAll('#tabbar button').forEach(function(b){ b.onclick = function(){ vaiTab(b.getAttribute('data-tab')); }; });
document.querySelectorAll('#agSeg button').forEach(function(b){
  b.onclick = function(){ ui.agv = b.getAttribute('data-v'); salvaUi(); window.scrollTo(0, 0); disegna(); };
});
$('btnRefresh').onclick = function(){ sync(true); };
$('btnSettings').onclick = apriImpostazioni;
$('btnOrganizza').onclick = function(){ apriChat('generale', { bozza: 'Organizzami la settimana: ' }); };
$('fab').onclick = function(){
  if(ui.tab === 'chat') nuovaChat();
  else if(ui.agv === 'dafare') formCompito(null);
  else formEvento(ui.agv === 'mese' ? { data: ui.giorno || oggi() } : null);
};
$('cBack').onclick = chiudiLivello;
$('cMenu').onclick = menuChat;
$('cSend').onclick = invia;
$('cInput').addEventListener('input', adattaInput);
$('cInput').addEventListener('keydown', function(e){
  // dal computer: Ctrl/Cmd+Invio manda; dal telefono Invio va a capo
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); invia(); }
});
$('cAttach').onclick = function(){ $('filePick').value = ''; $('filePick').click(); };
$('filePick').onchange = function(){
  var files = Array.prototype.slice.call(this.files || []);
  var troppo = files.filter(function(f){ return f.size > 20 * 1024 * 1024; });
  if(troppo.length) toast('Oltre 20 MB non si può: ' + escapeHtml(troppo[0].name), 4000);
  Promise.all(files.filter(function(f){ return f.size <= 20 * 1024 * 1024; }).map(preparaAllegato)).then(function(lista){
    daAllegare = daAllegare.concat(lista); disegnaAllegati(); adattaInput();
  }).catch(function(e){ toast(escapeHtml(e.message), 4000); });
};
$('vBack').onclick = chiudiLivello;
$('vRead').onclick = function(){ modoFile('leggi'); };
$('vEdit').onclick = function(){ modoFile('modifica'); };
$('vSave').onclick = function(){ salvaFile(false); };
$('editor').addEventListener('input', function(){ if(vcur) $('vSave').disabled = $('editor').value === vcur.remoto; });

function avvio(){
  disegna();
  if(cfg.token && idx){
    caricaModello().then(function(){
      Object.keys(chats).forEach(function(sl){ visti[sl] = chats[sl].msgs.map(function(m){ return m.nome; }); });
      primaVolta = false;
      disegna();
      if(ui.chat && chats[ui.chat]) apriChat(ui.chat);
      sync();
    }).catch(function(){ sync(true); });
  } else if(cfg.token){
    sync(true).then(function(){ if(ui.chat && chats[ui.chat]) apriChat(ui.chat); });
  }
}

/* Se il telefono ha ricaricato l'app mentre c'era aperto qualcosa, la
   pagina nuova si ritrova sopra voci di cronologia che non hanno più un
   livello: il tasto indietro sembrerebbe bloccato. Si torna giù alla
   prima voce (con un popstate, o con un caricamento nuovo: vanno bene
   tutti e due) e poi si riparte, riaprendo la chat in cui si era. */
var profondita = history.state && history.state.regia;
if(profondita > 0){
  var ripartito = false;
  var riparti = function(){
    if(ripartito) return;
    ripartito = true; window.removeEventListener('popstate', riparti);
    avvio();
  };
  window.addEventListener('popstate', riparti);
  history.go(-profondita);
  setTimeout(riparti, 700);
} else {
  avvio();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

})();
</script>
