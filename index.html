<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Regia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Regia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ==========================================================
   Regia — foglio di stile. Nessuna dipendenza esterna:
   solo variabili CSS e i font di sistema.
   L'aspetto è quello delle app di chat con un'IA (Grok, in
   primis): fondo quasi nero o quasi bianco, niente colore se
   non serve, la casella di scrittura al centro della scena e
   un solo accento caldo, la terracotta di Claude.
   ========================================================== */
:root{
  color-scheme:light;
  /* superfici */
  --bg:#f7f7f5; --bg-2:#efefec;
  --panel:#ffffff; --panel-2:#f3f3f0; --elev:#ffffff;
  --text:#141416; --muted:#68686f; --faint:#9c9ca3;
  --line:#e3e3de; --line-soft:#ededea;
  /* l'accento: la terracotta di Claude */
  --accent:#b9562f; --accent-2:#e0784f; --accent-soft:rgba(198,95,55,.12);
  --grad:linear-gradient(140deg,#f6b085 0%,#e47c50 46%,#b6452a 100%);
  /* i bottoni pieni sono neri sul chiaro e bianchi sullo scuro, come in Grok */
  --ink:#141416; --ink-on:#ffffff;
  --me:#ebebe6; --me-ink:#141416;
  --glass:rgba(247,247,245,.8); --scrim:rgba(12,12,14,.42);
  --danger:#c0392b; --ok:#2e7d52;
  --warn-bg:#fbf0d9; --warn-ink:#6b4b12;
  --err-bg:#fbe4e0; --err-ink:#7d2a20;
  /* tipi d'agenda */
  --t-appuntamento:#3b78d0; --t-promemoria:#cf8d1f; --t-scadenza:#cf3f39; --t-blocco:#2a9575; --t-google:#8a8aa0;
  /* forma */
  --tap:44px; --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(20,20,22,.05),0 2px 10px rgba(20,20,22,.04);
  --sh-2:0 22px 50px -14px rgba(20,20,22,.32);
  --ring:0 0 0 3px rgba(198,95,55,.35);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --vvh:100%; --kb:0px; --dock:170px;
}
/* tema scuro: quello del telefono, oppure scelto nelle Impostazioni
   (data-tema sull'html); i due blocchi devono restare uguali */
@media (prefers-color-scheme:dark){
  :root:not([data-tema="chiaro"]){
    color-scheme:dark;
    --bg:#09090b; --bg-2:#111114;
    --panel:#141417; --panel-2:#1c1c20; --elev:#18181b;
    --text:#f2f2f3; --muted:#a0a0a8; --faint:#66666e;
    --line:#27272c; --line-soft:#1d1d21;
    --accent:#ee8d61; --accent-2:#f5a47e; --accent-soft:rgba(238,141,97,.15);
    --ink:#f2f2f3; --ink-on:#09090b;
    --me:#222226; --me-ink:#f2f2f3;
    --glass:rgba(9,9,11,.76); --scrim:rgba(0,0,0,.62);
    --danger:#ef7462; --ok:#5cbb8b;
    --warn-bg:#33290f; --warn-ink:#f3d9a4;
    --err-bg:#3a1c18; --err-ink:#f5c2ba;
    --t-appuntamento:#6fa0ea; --t-promemoria:#e5ad4a; --t-scadenza:#ec6d66; --t-blocco:#4fbf9a;
    --sh-1:0 0 0 rgba(0,0,0,0);
    --sh-2:0 24px 60px -12px rgba(0,0,0,.75);
  }
}
:root[data-tema="scuro"]{
  color-scheme:dark;
  --bg:#09090b; --bg-2:#111114;
  --panel:#141417; --panel-2:#1c1c20; --elev:#18181b;
  --text:#f2f2f3; --muted:#a0a0a8; --faint:#66666e;
  --line:#27272c; --line-soft:#1d1d21;
  --accent:#ee8d61; --accent-2:#f5a47e; --accent-soft:rgba(238,141,97,.15);
  --ink:#f2f2f3; --ink-on:#09090b;
  --me:#222226; --me-ink:#f2f2f3;
  --glass:rgba(9,9,11,.76); --scrim:rgba(0,0,0,.62);
  --danger:#ef7462; --ok:#5cbb8b;
  --warn-bg:#33290f; --warn-ink:#f3d9a4;
  --err-bg:#3a1c18; --err-ink:#f5c2ba;
  --t-appuntamento:#6fa0ea; --t-promemoria:#e5ad4a; --t-scadenza:#ec6d66; --t-blocco:#4fbf9a;
  --sh-1:0 0 0 rgba(0,0,0,0);
  --sh-2:0 24px 60px -12px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  min-height:100vh; background:var(--bg); color:var(--text);
  font:16px/1.5 var(--sans);
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--accent)}
.hide{display:none!important}
::selection{background:rgba(224,122,82,.3)}
:focus-visible{outline:none;box-shadow:var(--ring)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.logo{width:22px;height:22px;flex:none;fill:url(#gSpark);stroke:none}
.grow{flex:1}

/* ---------- barra in alto: vetro sul fondo, come in Grok ---------- */
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:2px;
  padding:calc(env(safe-area-inset-top) + 4px) 6px 4px;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(1.6) blur(18px); backdrop-filter:saturate(1.6) blur(18px);
}
.brand{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px; height:var(--tap);
  font-weight:700; font-size:17px; letter-spacing:-.015em;
}
.brand.spin svg.logo{animation:gira 1s linear infinite}
.iconbtn{
  min-width:var(--tap); height:var(--tap); border-radius:var(--r-m); color:inherit; position:relative;
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.iconbtn:active{background:var(--line-soft)}
.iconbtn .badge{position:absolute;top:4px;right:2px}
.iconbtn .pt{position:absolute;top:10px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.badge{
  min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;
}
.badge:empty{display:none}
.seg{display:flex;background:var(--bg-2);border-radius:var(--r-m);padding:3px;gap:2px}
.seg button{
  flex:1; color:var(--muted); font-size:14px; font-weight:600; padding:7px 12px; border-radius:11px;
  transition:background .15s,color .15s; white-space:nowrap;
}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--sh-1)}
:root[data-tema="scuro"] .seg button.on{background:var(--line)}
@media (prefers-color-scheme:dark){ :root:not([data-tema="chiaro"]) .seg button.on{background:var(--line)} }
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:8px 13px;
  background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:650;white-space:nowrap;
}
.pill:active{filter:brightness(.95)}
.pill svg.i{width:17px;height:17px}

/* ---------- avvisi ---------- */
.banner{padding:10px 16px;font-size:13.5px;line-height:1.5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}
.banner.err{background:var(--err-bg);color:var(--err-ink)}
.banner button{text-decoration:underline;text-underline-offset:2px;font-size:13.5px;font-weight:650;padding:4px 0}

/* ---------- la pagina di partenza ---------- */
main{padding:0 14px calc(var(--dock) + 24px);max-width:46rem;margin:0 auto}
.ptr{
  position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 58px); z-index:19;
  width:38px; height:38px; margin-left:-19px; border-radius:50%; background:var(--panel); color:var(--accent);
  border:1px solid var(--line); box-shadow:var(--sh-2); display:flex; align-items:center; justify-content:center;
  opacity:0; transform:translateY(-20px) scale(.8); pointer-events:none;
}
.ptr svg.i{width:19px;height:19px}
.ptr.gira svg.i{animation:gira .8s linear infinite}
.hero{text-align:center;padding:26px 10px 20px}
.hero .logo{width:60px;height:60px;display:block;margin:0 auto 16px;animation:respira 6s ease-in-out infinite}
.hero h1{font-size:29px;line-height:1.15;letter-spacing:-.03em;margin:0;font-weight:700}
.hero p{margin:7px 0 0;color:var(--muted);font-size:15px}
.attivita{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 13px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:650;max-width:100%;
}
.attivita span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotp{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.2s ease-in-out infinite}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);overflow:hidden}
.oggi{margin:0 0 6px}
.oggi-h{display:flex;align-items:center;gap:8px;padding:13px 14px 5px;width:100%;text-align:left}
.oggi-h b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.oggi-h small{color:var(--muted);font-size:13px}
.oggi-h .vai{margin-left:auto;color:var(--muted);display:flex;align-items:center;font-size:13.5px;font-weight:600;gap:2px}
.oggi-h .vai svg.i{width:17px;height:17px}
.origa{display:flex;gap:11px;align-items:center;padding:8px 14px;width:100%;text-align:left}
.origa:last-child{padding-bottom:13px}
.origa:active{background:var(--panel-2)}
.origa .o{width:44px;flex:none;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:650;color:var(--muted)}
.origa .b{width:3px;height:20px;border-radius:2px;flex:none;background:var(--tcol,var(--t-appuntamento))}
.origa .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.origa.passato{opacity:.5}
.origa.allarme .o{color:var(--danger)}
.empty{color:var(--muted);padding:30px 18px;text-align:center;line-height:1.65}
.sec-h{
  font-size:13px;font-weight:650;color:var(--muted);
  margin:22px 4px 8px;display:flex;align-items:center;gap:8px;
}
.sec-h button{margin-left:auto;font-weight:650;color:var(--accent);font-size:13.5px;display:inline-flex;align-items:center;gap:4px;padding:4px 0}
.sec-h button svg.i{width:16px;height:16px}

/* ---------- elenco delle chat ---------- */
.lista{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--sh-1)}
.chatcard{
  display:flex; gap:12px; align-items:center; width:100%; text-align:left;
  padding:12px 14px; position:relative; transition:background .12s;
}
.chatcard + .chatcard::before{content:'';position:absolute;top:0;left:70px;right:0;border-top:1px solid var(--line-soft)}
.chatcard:active{background:var(--panel-2)}
.av{
  width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:18px;letter-spacing:-.02em;
  background-image:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);
}
.av.gen{background:var(--grad)}
.av svg.i{width:23px;height:23px}
.cc-body{flex:1;min-width:0}
.cc-top{display:flex;align-items:baseline;gap:8px}
.cc-t{font-weight:650;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.cc-time{font-size:12.5px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.cc-bot{display:flex;align-items:center;gap:8px;margin-top:1px}
.cc-prev{flex:1;min-width:0;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-prev b{color:var(--text);font-weight:600}
.st{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;
  padding:2px 8px;flex:none;white-space:nowrap;
}
.st.lavoro,.st.coda,.st.attesa{background:var(--accent-soft);color:var(--accent)}
.st.errore{background:var(--err-bg);color:var(--err-ink)}
.st.invio{background:var(--line-soft);color:var(--muted)}
.st .dotp{width:6px;height:6px}

/* ---------- la casella di scrittura (pagina di partenza e chat) ---------- */
.dock{
  position:fixed; left:0; right:0; bottom:var(--kb); z-index:18;
  padding:18px 10px calc(env(safe-area-inset-bottom) + 10px);
  background:linear-gradient(to top,var(--bg) 62%,transparent);
}
.dock-in{max-width:46rem;margin:0 auto}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 2px 9px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;
  padding:7px 13px;font-size:13.5px;color:var(--text);white-space:nowrap;
}
.chip:active{background:var(--panel-2)}
.cbox{
  background:var(--elev); border:1px solid var(--line); border-radius:var(--r-xl);
  box-shadow:var(--sh-1); padding:4px 6px 6px; transition:border-color .15s, box-shadow .15s;
}
.cbox:focus-within{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:0 0 0 4px var(--accent-soft)}
.cbox.trascina{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.cbox textarea{
  display:block; width:100%; border:0; background:none; resize:none; outline:none; box-shadow:none;
  padding:10px 10px 6px; font-size:16px; line-height:1.45; max-height:9.6em; min-height:44px;
}
.cbox textarea::placeholder{color:var(--faint)}
.ctools{display:flex;align-items:center;gap:5px}
.tb{
  width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid var(--line);transition:background .15s,color .15s;
}
.tb:active{background:var(--line-soft)}
.tb svg.i{width:20px;height:20px}
.modo,.dove{
  display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:99px;flex:none;
  border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);transition:background .15s,color .15s,border-color .15s;
}
.modo svg.i{width:17px;height:17px}
.modo.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.dove{padding:0 8px 0 5px;gap:5px;max-width:130px}
.dove .av{width:26px;height:26px;border-radius:9px;font-size:12px}
.dove .av svg.i{width:15px;height:15px}
.dove span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.dove svg.i.freccia{width:15px;height:15px}

.send{
  width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--ink-on);transition:opacity .15s, transform .12s;
}
.send svg.i{width:20px;height:20px;stroke-width:2.2}
.send:active{transform:scale(.94)}
.send[disabled]{opacity:.25;cursor:default}
.mic.ascolta{background:var(--accent);border-color:var(--accent);color:#fff;animation:onda 1.4s ease-out infinite}
.pending-atts{display:flex;gap:6px;flex-wrap:wrap;padding:6px 6px 0}
.pending-atts:empty{display:none}
.patt{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 10px;font-size:13px;max-width:100%}
.patt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.patt button{width:26px;height:26px;border-radius:50%;color:var(--muted)}

/* ---------- livelli a schermo intero (chat, agenda, file) ---------- */
.layer{
  position:fixed; left:0; right:0; top:0; height:var(--vvh); z-index:30; background:var(--bg);
  display:flex; flex-direction:column;
}
/* «backwards»: finita l'entrata l'animazione non resta applicata, se no
   coprirebbe il transform del gesto col dito (le animazioni vincono sugli stili in linea) */
.layer.entra{animation:dentro .3s cubic-bezier(.2,.85,.25,1) backwards;box-shadow:-12px 0 40px -18px rgba(0,0,0,.35)}
.layer.esce{animation:fuori .2s cubic-bezier(.4,0,1,1) both;pointer-events:none}
#agendaview{z-index:28}
.lbar{
  display:flex; align-items:center; gap:2px; flex:none; position:relative; z-index:2;
  padding:calc(env(safe-area-inset-top) + 4px) 6px 4px;
  background:var(--glass); border-bottom:1px solid transparent;
  -webkit-backdrop-filter:saturate(1.6) blur(18px); backdrop-filter:saturate(1.6) blur(18px);
}
.lbar.ombra{border-bottom-color:var(--line-soft)}
.lbar .av{width:34px;height:34px;border-radius:11px;font-size:14px}
.lbar .av svg.i{width:19px;height:19px}
.ltitle{flex:1;min-width:0;line-height:1.25;padding-left:2px;display:flex;align-items:center;gap:10px;text-align:left}
.ltitle>div{min-width:0}
.ltitle .t{font-weight:650;font-size:16px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltitle .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltitle .s.vivo{color:var(--accent)}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ---------- la chat aperta ---------- */
.msgwrap{flex:1;min-height:0;position:relative;display:flex}
#cmsgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 22px;overscroll-behavior:contain}
.daysep{text-align:center;margin:16px 0 12px}
.daysep span{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.01em}
.nuovi{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:12px;font-weight:700;margin:8px auto 14px;max-width:46rem}
.nuovi::before,.nuovi::after{content:'';flex:1;border-top:1px solid var(--accent-soft)}
.msg{display:flex;flex-direction:column;margin:0 auto 18px;max-width:46rem;border-radius:var(--r-m)}
.msg.andrea{align-items:flex-end;margin-bottom:14px}
.msg.claude,.msg.sistema{align-items:flex-start}
.bubble{max-width:100%;font-size:16px;line-height:1.6;overflow-wrap:anywhere;position:relative}
.msg.andrea .bubble{
  background:var(--me);color:var(--me-ink);max-width:min(84%,36rem);
  padding:9px 15px;border-radius:22px 22px 6px 22px;line-height:1.5;
}
.msg.claude .bubble{padding:0 2px;width:100%}
.msg.sistema .bubble{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-m);padding:11px 14px;font-size:15px;width:100%}
.msg.briefing .bubble{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;box-shadow:var(--sh-1)}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;color:var(--text);margin:0 0 7px;max-width:100%}
.who .mark{width:24px;height:24px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff}
.who .mark svg.i{width:15px;height:15px;stroke-width:2}
.who small{color:var(--faint);font-weight:500;font-size:12.5px}
.msg.sistema .who{color:var(--warn-ink)}
.msg.sistema .who .mark{background:var(--warn-bg);color:var(--warn-ink)}
.msg .meta{font-size:12px;color:var(--faint);margin:4px 6px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg .meta button,.msg .meta a{color:var(--accent);font-weight:650;font-size:13px;padding:4px 0;text-decoration:none}
.tagmodo{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:650}
.tagmodo svg.i{width:13px;height:13px}
.acts{display:flex;align-items:center;gap:0;margin:6px 0 0 -8px}
.acts button{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:color .15s,background .15s}
.acts button:active{background:var(--line-soft);color:var(--text)}
.acts button.on{color:var(--accent)}
.acts svg.i{width:18px;height:18px}
.acts .ora{font-size:12px;color:var(--faint);margin-left:6px;font-variant-numeric:tabular-nums}
.msg.out .bubble{opacity:.7}
.msg.fail .bubble{box-shadow:0 0 0 1.5px var(--danger)}
.msg.nuovo{animation:sale .38s cubic-bezier(.2,.8,.2,1) both}
.msg.claude.nuovo .md>*{animation:compare .5s ease both;animation-delay:calc(var(--i,0) * 90ms)}
.msg.lampeggia{animation:lampo 1.6s ease both}
.proposte{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.proposta{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  border-radius:99px;padding:8px 14px;font-size:14.5px;font-weight:550;color:var(--text);text-align:left;
  transition:background .15s,border-color .15s;
}
.proposta svg.i{width:15px;height:15px;color:var(--accent);stroke-width:2.2}
.proposta:active{background:var(--accent-soft);border-color:transparent}
.pensiero .who .mark svg.i{animation:gira 2.6s linear infinite}
.shimmer{
  background:linear-gradient(90deg,var(--muted) 0%,var(--muted) 30%,var(--text) 50%,var(--muted) 70%,var(--muted) 100%);
  background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:luccica 2s linear infinite;
}
.timer{font-variant-numeric:tabular-nums;color:var(--faint);font-weight:500;font-size:12.5px}
.fasi{display:flex;gap:6px;width:100%;max-width:26rem;margin:4px 0 2px}
.fase{flex:1;min-width:0}
.fase i{display:block;height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.fase.fatta i{background:var(--accent)}
.fase.ora i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scorre 1.3s ease-in-out infinite}
.fase span{display:block;font-size:11.5px;color:var(--faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fase.ora span{color:var(--text);font-weight:600}
.fase.fatta span{color:var(--muted)}
.vuota{text-align:center;padding:14vh 24px 20px;color:var(--muted);line-height:1.6}
.vuota svg.logo{width:46px;height:46px;display:block;margin:0 auto 14px;animation:respira 6s ease-in-out infinite}
.vuota h3{color:var(--text);font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.vuota p{margin:0}
.loadmore{display:block;margin:4px auto 14px;color:var(--accent);font-weight:600;font-size:14px;padding:8px 14px}
.giu{
  position:absolute; left:50%; bottom:12px; z-index:3; width:40px; height:40px; margin-left:-20px; border-radius:50%;
  background:var(--panel); border:1px solid var(--line); color:var(--text); box-shadow:var(--sh-2);
  display:flex; align-items:center; justify-content:center; animation:sale .2s ease both;
}
.giu svg.i{width:20px;height:20px}

/* markdown dentro le risposte e nel lettore */
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .7em}
.md h1,.md h2,.md h3,.md h4{line-height:1.25;margin:1em 0 .4em;letter-spacing:-.015em}
.md h1{font-size:1.25em}.md h2{font-size:1.14em}.md h3,.md h4{font-size:1.03em}
.md ul,.md ol{padding-left:1.35em;margin:0 0 .7em}
.md li{margin:.22em 0}
.md li::marker{color:var(--faint)}
.md blockquote{margin:0 0 .7em;padding:.1em 0 .1em .9em;border-left:3px solid var(--line);color:var(--muted)}
.md code{font-family:var(--mono);font-size:.87em;background:var(--panel-2);border:1px solid var(--line-soft);padding:.08em .35em;border-radius:6px}
.md pre{background:var(--panel-2);padding:11px 13px;border-radius:var(--r-s);overflow-x:auto;font-size:13px;line-height:1.5;margin:0 0 .7em}
.md pre code{background:none;border:0;padding:0}
.md .code{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin:0 0 .8em;background:var(--panel-2)}
.md .code pre{margin:0;border-radius:0;background:none}
.code-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 4px 13px;font:12px/1.4 var(--mono);color:var(--muted);border-bottom:1px solid var(--line)}
.code-h button{font:600 12.5px/1 var(--sans);color:var(--muted);padding:7px 9px;border-radius:8px;display:inline-flex;gap:5px;align-items:center}
.code-h button svg.i{width:15px;height:15px}
.code-h button:active{background:var(--line-soft)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.1em 0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:.92em;margin:0 0 .8em;max-width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{font-weight:650;color:var(--muted);font-size:.92em;border-bottom-width:2px}
.md img{max-width:100%;border-radius:var(--r-m);display:block;margin:.4em 0}
.md a.repo{font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--accent-soft)}
.md strong{font-weight:680}
.msg.andrea .md code,.msg.andrea .md pre{background:rgba(127,127,127,.12);border-color:transparent}
mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 2px}

/* schede d'agenda e allegati sotto i messaggi */
.cards{display:flex;flex-direction:column;gap:7px;margin-top:10px;width:100%;max-width:30rem}
.mini{
  display:flex;align-items:center;gap:11px;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;
  box-shadow:var(--sh-1);position:relative;overflow:hidden;
}
.mini::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tcol,var(--t-appuntamento))}
.mini .mt{font-weight:620;font-size:14.5px}
.mini .ms{font-size:12.5px;color:var(--muted)}
.mini .mi{flex:1;min-width:0}
.mini.compito::before{background:var(--faint)}
.mini.compito.fatto .mt{text-decoration:line-through;color:var(--muted)}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;justify-content:flex-end;max-width:84%}
.att{
  border-radius:var(--r-m);overflow:hidden;background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;gap:6px;font-size:13px;padding:7px 11px;max-width:100%;
}
.att.img{padding:0;width:128px;height:128px}
.att.img img{width:100%;height:100%;object-fit:cover;display:block}

/* la casella nella chat */
.composer{flex:none;padding:6px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg)}
.composer>*{max-width:46rem;margin-left:auto;margin-right:auto}

/* ---------- agenda ---------- */
.subnav{display:flex;gap:8px;padding:6px 12px 8px;flex:none}
.subnav .seg{flex:1}
#abody{padding:8px 12px calc(env(safe-area-inset-bottom) + 100px)}
#abody>*{max-width:46rem;margin-left:auto;margin-right:auto}
.day{margin:0 auto 16px}
.day-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 7px}
.day-h .dn{font-weight:700;font-size:15px;letter-spacing:-.01em}
.day-h .dd{font-size:13px;color:var(--muted)}
.day-h.oggi .dn{color:var(--accent)}
.evlist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--sh-1)}
.ev{
  display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;padding:11px 13px;
  border-bottom:1px solid var(--line-soft);
}
.ev:last-child{border-bottom:0}
.ev:active{background:var(--panel-2)}
.ev .eo{width:50px;flex:none;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;padding-top:1px}
.ev .eo small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ev .eb{width:4px;border-radius:2px;flex:none;background:var(--tcol,var(--t-appuntamento))}
.ev .ei{flex:1;min-width:0}
.ev .et{font-weight:600;font-size:15px}
.ev .es{font-size:12.5px;color:var(--muted);margin-top:1px}
.ev.passato{opacity:.5}
.nulla{padding:13px 14px;color:var(--muted);font-size:14px}
.tag{
  display:inline-block;font-size:11.5px;font-weight:650;border-radius:99px;padding:1px 8px;
  background:var(--line-soft);color:var(--muted);margin-right:4px;vertical-align:1px;
}
.tag.rosso{background:var(--err-bg);color:var(--err-ink)}
.tag.ambra{background:var(--warn-bg);color:var(--warn-ink)}
.mese-h{display:flex;align-items:center;gap:4px;margin:2px 0 8px}
.mese-h .mn{flex:1;font-weight:700;font-size:18px;text-transform:capitalize;padding-left:4px;letter-spacing:-.015em}
.mese-h button{min-width:40px;height:40px;border-radius:var(--r-m);color:var(--text);display:flex;align-items:center;justify-content:center}
.mese-h button:active{background:var(--line-soft)}
.mese-h .oggibtn{font-size:13.5px;font-weight:650;color:var(--accent);padding:0 10px}
.griglia{
  display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-l);padding:6px;box-shadow:var(--sh-1);
}
.griglia .wd{font-size:11.5px;font-weight:700;color:var(--faint);text-align:center;padding:4px 0}
.cella{
  aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  padding-top:5px;font-size:14.5px;font-variant-numeric:tabular-nums;position:relative;min-width:0;
}
.cella.fuori{color:var(--muted);opacity:.4}
.cella .n{width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cella.oggi .n{background:var(--accent);color:#fff;font-weight:700}
.cella.sel{background:var(--accent-soft)}
.cella .pts{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cella .pts i{width:6px;height:6px;border-radius:50%;background:var(--tcol,var(--t-appuntamento))}
.cella .piu{font-size:10px;color:var(--muted);line-height:1}
.todo{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 13px;
  border-bottom:1px solid var(--line-soft);
}
.todo:last-child{border-bottom:0}
.check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s,border-color .15s,transform .15s;
}
.check:active{transform:scale(.88)}
.check svg.i{width:15px;height:15px;stroke-width:3;opacity:0}
.todo.fatto .check{background:var(--ok);border-color:var(--ok)}
.todo.fatto .check svg.i{opacity:1}
.todo.fatto .tt{text-decoration:line-through;color:var(--muted)}
.todo .ti{flex:1;min-width:0}
.todo .tt{font-size:15px;font-weight:550}
.todo .ts{font-size:12.5px;color:var(--muted);margin-top:2px}
.todo.alta .tt::after{content:' ●';color:var(--danger);font-size:11px}
.quickadd{display:flex;gap:8px;margin:2px auto 6px}
.quickadd input{
  flex:1;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-m);padding:12px 14px;outline:none;
}
.quickadd input:focus{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.fab{
  position:absolute; right:16px; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:5;
  background:var(--ink); color:var(--ink-on); border-radius:99px;
  height:52px; padding:0 20px 0 16px; box-shadow:var(--sh-2);
  font-size:15px; font-weight:700; letter-spacing:.1px;
  display:flex; align-items:center; gap:8px; transition:transform .12s ease;
}
.fab:active{transform:scale(.97)}

/* ---------- lettore / editor di file ---------- */
#viewer{z-index:40}
#vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#editor{
  width:100%; height:100%; border:0; outline:none; resize:none; display:block;
  background:var(--panel); caret-color:var(--accent); box-shadow:none;
  padding:18px max(16px,calc((100% - 46rem)/2)) calc(env(safe-area-inset-bottom) + 40px);
  font:15px/1.7 var(--mono);
}
#preview{
  padding:20px 18px calc(env(safe-area-inset-bottom) + 64px);
  max-width:44rem; margin:0 auto; font-size:16.5px; line-height:1.65;
}
#preview.pagina{max-width:none;padding:0;height:100%}
#preview.pagina iframe{display:block;width:100%;height:100%;min-height:420px;border:0;background:#fff}
#preview pre.raw{white-space:pre-wrap;font:13.5px/1.55 var(--mono)}
#preview img.solo{max-width:100%;display:block;margin:0 auto;border-radius:var(--r-s)}
.lbar .seg{margin-right:4px}
.lbar .seg button{padding:6px 10px;font-size:13.5px}
.savebtn{background:var(--ink);color:var(--ink-on);font-weight:700;border-radius:99px;padding:8px 14px;font-size:14px}
.savebtn[disabled]{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line);cursor:default}

/* ---------- pannelli a scomparsa e menu laterale ---------- */
.sheet{
  position:fixed; inset:0; z-index:50; background:var(--scrim);
  display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease both;
}
.sheet.esce{animation:sfuma .18s ease both;pointer-events:none}
.sheetbox{
  background:var(--panel); width:100%; max-width:560px; max-height:92vh; overflow:auto;
  border-radius:var(--r-xl) var(--r-xl) 0 0; padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);
  animation:rise .26s cubic-bezier(.2,.8,.2,1) both; box-shadow:var(--sh-2);
  border:1px solid var(--line); border-bottom:0;
}
.sheet.esce .sheetbox{animation:scende .18s ease-in both}
.sheetbox::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@media (min-width:700px){
  .sheet{align-items:center}
  .sheetbox{border-radius:var(--r-xl);border-bottom:1px solid var(--line);animation:pop .2s ease both}
}
.sheet.drawer{justify-content:flex-start;align-items:stretch}
.sheet.drawer .sheetbox{
  width:min(86vw,360px); max-width:none; max-height:none; height:100%;
  border-radius:0 var(--r-xl) var(--r-xl) 0; border:0; border-right:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px);
  animation:daSinistra .26s cubic-bezier(.2,.8,.2,1) both; display:flex; flex-direction:column;
}
.sheet.drawer .sheetbox::before{display:none}
.sheet.drawer.esce .sheetbox{animation:versoSinistra .18s ease-in both}
.sheetbox h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.help{color:var(--muted);font-size:14px;line-height:1.55;margin:4px 0 10px}
.sheetbox ol{padding-left:1.25em;margin:4px 0 8px;font-size:14px;line-height:1.6;color:var(--muted)}
.sheetbox ol b{color:var(--text)}
label.l{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:14px 0 6px}
.f{
  width:100%; border:1px solid var(--line); background:var(--bg); border-radius:var(--r-m);
  padding:11px 13px; outline:none; font-size:16px; min-height:46px;
}
.f:focus{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
textarea.f{resize:vertical;min-height:84px;line-height:1.5}
.frow{display:flex;gap:10px}
.frow>*{flex:1;min-width:0}
.segf{display:flex;gap:4px;background:var(--bg-2);border-radius:var(--r-m);padding:3px;flex-wrap:wrap}
.segf button{flex:1;padding:9px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.segf button.on{background:var(--panel);color:var(--text);box-shadow:var(--sh-1)}
:root[data-tema="scuro"] .segf button.on{background:var(--line)}
@media (prefers-color-scheme:dark){ :root:not([data-tema="chiaro"]) .segf button.on{background:var(--line)} }
.days7{display:flex;gap:5px}
.days7 button{flex:1;height:38px;border-radius:11px;background:var(--bg-2);font-weight:650;font-size:13.5px;color:var(--muted)}
.days7 button.on{background:var(--accent);color:#fff}
.switch{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1; padding:13px; border-radius:99px; font-weight:650; font-size:15px;
  background:var(--bg-2); color:var(--text); text-align:center;
}
.btn.primary{background:var(--ink);color:var(--ink-on)}
.btn.danger{color:var(--danger)}
.btn:active{filter:brightness(.95)}
.btn svg.i{width:18px;height:18px;vertical-align:-3px;margin-right:4px}
.btn.solo{flex:0 0 52px;padding:13px 0}
.btn.solo svg.i{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links button,.links a{
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:99px;padding:8px 13px;text-decoration:none;
}
.links svg.i{width:16px;height:16px}
.menu{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-top:8px}
.menu button{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;
  border-bottom:1px solid var(--line-soft);font-size:15.5px;
}
.menu button:last-child{border-bottom:0}
.menu button:active{background:var(--panel-2)}
.menu button svg.i{color:var(--muted)}
.menu button small{margin-left:auto;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.menu .danger{color:var(--danger)}
.tokact{display:flex;gap:8px;margin-top:6px}
.come{margin-top:10px;color:var(--muted);font-size:14px}
.come summary{cursor:pointer;padding:6px 0;list-style-position:inside}
.come summary b{color:var(--text)}
.tokact button{font-size:13.5px;font-weight:600;color:var(--accent);padding:6px 2px}
.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px;line-height:1.45}
.checks li:last-child{border-bottom:0}
.checks .ck{flex:none;width:22px;text-align:center;font-weight:800}
.checks .ok .ck{color:var(--ok)}.checks .no .ck{color:var(--danger)}.checks .forse .ck{color:var(--t-promemoria)}
.checks small{display:block;color:var(--muted);font-size:13px}
/* menu laterale */
.dr-h{display:flex;align-items:center;gap:8px;padding:2px 2px 12px}
.dr-h .brand{justify-content:flex-start;padding-left:6px;height:auto}
.cerca{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:0 12px;height:44px;flex:none}
.cerca svg.i{width:18px;height:18px;color:var(--muted)}
.cerca input{flex:1;min-width:0;border:0;background:none;outline:none;box-shadow:none;font-size:16px;height:100%;-webkit-appearance:none;appearance:none}
.cerca input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.dr-scroll{flex:1;overflow-y:auto;margin:10px -12px 0;padding:0 12px}
.dr-nav button,.drchat{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 10px;border-radius:12px;font-size:15.5px;font-weight:550;
}
.dr-nav button:active,.drchat:active{background:var(--panel-2)}
.dr-nav svg.i{width:21px;height:21px;color:var(--muted)}
.dr-nav .badge{margin-left:auto}
.dr-sec{font-size:12.5px;font-weight:650;color:var(--faint);margin:16px 10px 6px;display:flex;align-items:center}
.dr-sec button{margin-left:auto;color:var(--accent);font-weight:650}
.drchat .av{width:30px;height:30px;border-radius:10px;font-size:13px}
.drchat .av svg.i{width:17px;height:17px}
.drchat .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drchat .dotp{color:var(--accent)}
.drchat.arch{color:var(--muted)}
.dr-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding-top:10px;margin-top:6px}
.dr-foot button{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;font-weight:600;flex:1;text-align:left}
.dr-foot button:active{background:var(--panel-2)}
.dr-foot small{color:var(--faint);padding-right:8px}
.ris{display:block;width:100%;text-align:left;padding:10px 10px;border-radius:12px}
.ris:active{background:var(--panel-2)}
.ris .rt{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:6px}
.ris .rs{font-size:14px;line-height:1.45;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nota{color:var(--muted);font-size:14px;padding:10px}
.scelte{display:flex;flex-direction:column;gap:2px;margin-top:6px}

.welcome{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:20px 18px;margin-top:4px;box-shadow:var(--sh-1)}
.welcome h2{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}
.welcome p{margin:0 0 10px;color:var(--muted);line-height:1.6}
.welcome ol{padding-left:1.25em;line-height:1.65;margin:8px 0 16px}

#toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 130px);
  background:var(--ink); color:var(--ink-on); padding:11px 18px; border-radius:18px;
  font-size:14px; font-weight:550; z-index:70; max-width:88%; text-align:center;
  box-shadow:var(--sh-2); transform:translateX(-50%); animation:toastin .22s ease both; line-height:1.4;
}
#toast button{color:var(--accent-2);font-weight:700;margin-left:10px}
.spin{
  display:inline-block; width:15px; height:15px; border:2px solid currentColor; border-right-color:transparent;
  border-radius:50%; animation:gira .7s linear infinite; vertical-align:-2px; opacity:.8;
}

/* ---------- l'uso di Claude: l'anello sempre in vista, in alto a destra ---------- */
.uso{
  position:fixed; z-index:45; top:calc(env(safe-area-inset-top) + 7px); right:8px;
  width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  transition:transform .15s;
}
.uso:active{transform:scale(.92)}
.uso svg{position:absolute;inset:3px;width:34px;height:34px;transform:rotate(-90deg)}
.uso .traccia{fill:none;stroke:var(--line);stroke-width:3.2}
.uso .arco{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .3s}
.uso.attenzione .arco{stroke:var(--st-avviso)}
.uso.critico .arco{stroke:var(--st-critico)}
.uso .num{position:relative;font-size:11px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.uso .num svg.i{position:static;width:16px;height:16px;transform:none}
.uso.avviso::after{
  content:''; position:absolute; top:1px; right:1px; width:9px; height:9px; border-radius:50%;
  background:var(--st-avviso); box-shadow:0 0 0 2px var(--bg);
}
.uso.avviso-critico::after{background:var(--st-critico)}
/* le barre lasciano il posto all'anello */
.topbar{padding-right:52px}
.lbar{padding-right:52px}
:root{ --st-avviso:#c98500; --st-critico:#d03b3b; --st-bene:#0ca30c;
  --m1:#2a78d6; --m2:#eb6834; --m3:#1baf7a; --m4:#eda100; }
@media (prefers-color-scheme:dark){ :root:not([data-tema="chiaro"]){ --st-avviso:#fab219; --st-critico:#e66767; --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; } }
:root[data-tema="scuro"]{ --st-avviso:#fab219; --st-critico:#e66767; --m1:#3987e5; --m2:#d95926; --m3:#199e70; --m4:#c98500; }

/* il pannello dell'uso */
.misure{display:flex;flex-direction:column;gap:14px;margin:10px 0 6px}
.misura .riga{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.misura .riga b{font-size:15px;font-weight:650}
.misura .riga .pct{margin-left:auto;font-size:22px;font-weight:700;letter-spacing:-.02em}
.misura .barra{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.misura .barra i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.misura.attenzione .barra i{background:var(--st-avviso)}
.misura.critico .barra i{background:var(--st-critico)}
.misura small{display:flex;gap:6px;align-items:center;margin-top:6px;color:var(--muted);font-size:12.5px}
.misura small svg.i{width:14px;height:14px}
.periodi{margin:16px 0 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel-2);border-radius:var(--r-m);padding:11px 12px}
.tile .tl{font-size:12.5px;color:var(--muted)}
.tile .tv{font-size:21px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.tile .ts{font-size:12px;color:var(--faint)}
.grafico{margin:16px 0 4px}
.grafico .gt{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:650;margin-bottom:6px}
.grafico .gt small{color:var(--muted);font-weight:500;margin-left:auto;font-size:12.5px}
.grafico svg{display:block;width:100%;height:120px;overflow:visible}
.grafico .base{stroke:var(--line);stroke-width:1}
.grafico .col{fill:var(--faint);transition:opacity .15s}
.grafico .col.oggi{fill:var(--accent)}
.grafico .col.su{opacity:.65}
.grafico .hit{fill:transparent;cursor:pointer}
.grafico text{fill:var(--muted);font-size:10.5px;font-family:var(--sans)}
.grafico text.val{fill:var(--text);font-weight:650}
.suggerimento{min-height:20px;font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
.modelli-uso{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.mu{display:flex;align-items:center;gap:10px;font-size:14px}
.mu .sw{width:10px;height:10px;border-radius:3px;flex:none}
.mu .n{width:88px;flex:none}
.mu .b{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mu .b i{display:block;height:100%;border-radius:99px}
.mu .p{width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.stack{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.stack i{display:block;height:100%}

/* ---------- le aree: una griglia di tessere ---------- */
.aree{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chatcard.area{
  flex-direction:column; align-items:stretch; gap:0; min-height:132px; padding:14px;
  background:var(--panel); border:1px solid var(--line); border-radius:22px; box-shadow:var(--sh-1);
  overflow:hidden; isolation:isolate; transition:transform .15s cubic-bezier(.2,.8,.2,1), border-color .2s;
}
.chatcard.area::before{
  content:''; position:absolute; z-index:-1; right:-40px; top:-50px; width:150px; height:150px; border-radius:50%;
  background:var(--tinta,#888); opacity:.14; filter:blur(18px); transition:opacity .3s;
}
.chatcard.area + .chatcard.area::before{left:auto;border-top:0}
.chatcard.area:active{transform:scale(.97)}
.chatcard.area.larga{grid-column:span 2;min-height:118px}
.chatcard.area .av{width:42px;height:42px;border-radius:14px;font-size:20px}
.av .emo{font-size:22px;line-height:1;filter:saturate(1.1)}
.chatcard.area .cc-t{margin-top:auto;padding-top:12px;font-size:16.5px;white-space:normal;line-height:1.2}
.chatcard.area .stato-a{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chatcard.area .stato-a.vivo{color:var(--accent);font-weight:600}
.chatcard.area .stato-a.errore{color:var(--err-ink)}
.chatcard.area > .badge{position:absolute;top:14px;right:14px}
.chatcard.area .ora-a{position:absolute;top:16px;right:14px;font-size:12px;color:var(--faint)}
.chatcard.area .dotp{position:absolute;top:18px;right:16px;color:var(--accent)}
.aree.entra .chatcard.area{animation:sale .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.lista.arch .chatcard{opacity:.8}

/* la scelta del modello nella casella */
.modello{
  display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 10px 0 9px;border-radius:99px;flex:none;
  border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--text);max-width:118px;
}
.modello svg.i{width:15px;height:15px;color:var(--muted)}
.modello .pallino{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.modello span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* i modi: solo l'icona, il nome compare quando sono accesi */
.modo span{display:none}
.modo{width:38px;padding:0;justify-content:center}
.modo.on{width:auto;padding:0 12px}
.modo.on span{display:inline}
.cbox .dove{height:30px;margin:4px 0 0 4px;font-size:12.5px;border-color:transparent;background:var(--panel-2);max-width:200px}
.cbox .dove .av{width:22px;height:22px;border-radius:7px;font-size:11px}
.cbox .dove .av svg.i{width:13px;height:13px}
.cbox .dove .av .emo{font-size:13px}
.scelta-modello{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.scelta-modello button{
  display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:var(--r-l);
  border:1px solid var(--line);background:var(--panel);transition:border-color .15s, background .15s;
}
.scelta-modello button.on{border-color:var(--ink);background:var(--panel-2)}
.scelta-modello .pallino{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:var(--faint)}
.scelta-modello b{display:block;font-size:15.5px}
.scelta-modello small{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:1px}
.scelta-modello svg.i{margin-left:auto;width:20px;height:20px;color:var(--ink);flex:none}

/* le routine */
.rt-lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-top:8px}
.rt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft);text-align:left;width:100%}
.rt:last-child{border-bottom:0}
.rt .ri{flex:1;min-width:0}
.rt b{display:block;font-size:15px;font-weight:620}
.rt small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.rt .area-r{color:var(--faint)}
.interruttore{position:relative;width:46px;height:28px;flex:none;border-radius:99px;background:var(--line);transition:background .2s}
.interruttore::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.interruttore.on{background:var(--ok)}
.interruttore.on::after{transform:translateX(18px)}
.msg.routine .bubble{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;box-shadow:var(--sh-1)}
.msg.routine .who .mark{background:var(--panel-2);color:var(--accent);border:1px solid var(--line)}
.tag.google{background:rgba(66,133,244,.14);color:#2f6bd8}
:root[data-tema="scuro"] .tag.google{color:#8ab4f8}
@media (prefers-color-scheme:dark){ :root:not([data-tema="chiaro"]) .tag.google{color:#8ab4f8} }
.modelli-idee{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 2px}
.emoji-scelte{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.emoji-scelte button{width:40px;height:40px;border-radius:12px;background:var(--panel-2);font-size:20px}
.emoji-scelte button.on{box-shadow:0 0 0 2px var(--ink)}
.chip.on{border-color:var(--ink);background:var(--panel-2)}
.segf button small{display:block;font-size:11.5px;font-weight:500;color:var(--faint);margin-top:1px}
.giorni-r{display:flex;gap:6px}
.giorni-r button{flex:1;height:40px;border-radius:12px;background:var(--panel-2);font-weight:650;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.giorni-r button.on{background:var(--ink);color:var(--ink-on)}
.chatcard.area .stato-a.uno{-webkit-line-clamp:1}
.chatcard.area .rt-a{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;color:var(--faint);min-width:0}
.chatcard.area .rt-a svg.i{width:13px;height:13px;flex:none}
.chatcard.area .rt-a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modello.scelto{border-color:var(--text)}
.tagmodello{display:inline-flex;align-items:center;gap:5px;font-weight:650;color:var(--muted)}
.tagmodello i{width:7px;height:7px;border-radius:50%}
.dr-nav button small{margin-left:auto;color:var(--muted);font-size:13px;font-weight:500}
.passi{padding-left:20px;margin:10px 0;line-height:1.55;font-size:14.5px}
.passi li{margin:7px 0}
.gsola .riga-g{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:15px;line-height:1.45}
.gsola .riga-g:last-child{border-bottom:0}
.gsola .riga-g svg.i{flex:none;color:var(--muted);margin-top:1px}

/* l'aurora dietro il saluto: due chiazze di colore che si muovono piano */
.hero{position:relative;isolation:isolate}
.hero::before,.hero::after{
  content:''; position:absolute; z-index:-1; width:220px; height:220px; border-radius:50%; filter:blur(48px);
  top:-30px; left:50%; opacity:.28; pointer-events:none;
}
.hero::before{background:#e47c50;margin-left:-190px;animation:aurora1 14s ease-in-out infinite alternate}
.hero::after{background:#7c6cf0;margin-left:-30px;opacity:.18;animation:aurora2 17s ease-in-out infinite alternate}
@keyframes aurora1{to{transform:translate(70px,30px) scale(1.15)}}
@keyframes aurora2{to{transform:translate(-60px,20px) scale(.9)}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes sfuma{to{opacity:0}}
@keyframes rise{from{transform:translateY(24px)}}
@keyframes scende{to{transform:translateY(24px)}}
@keyframes pop{from{transform:scale(.97);opacity:0}}
@keyframes daSinistra{from{transform:translateX(-100%)}}
@keyframes versoSinistra{to{transform:translateX(-100%)}}
@keyframes dentro{from{transform:translateX(100%)}}
@keyframes fuori{to{transform:translateX(100%)}}
@keyframes sale{from{transform:translateY(10px);opacity:0}}
@keyframes compare{from{opacity:0;transform:translateY(4px)}}
@keyframes lampo{0%,60%{background:var(--accent-soft);box-shadow:0 0 0 8px var(--accent-soft)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes luccica{from{background-position:110% 0}to{background-position:-110% 0}}
@keyframes scorre{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes respira{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.06) rotate(8deg)}}
@keyframes onda{0%{box-shadow:0 0 0 0 rgba(238,141,97,.55)}100%{box-shadow:0 0 0 12px rgba(238,141,97,0)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .spin,.brand.spin svg.logo{animation-duration:.8s!important;animation-iteration-count:infinite!important}
}
